<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Style Review · INSTA Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #FBFAFC; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
  * { box-sizing: border-box; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;

// ─── Design tokens (identical to dashboard.html) ──────────────────────────────
const T = {
  bg:          '#FBFAFC',
  surface:     '#FFFFFF',
  surfaceAlt:  '#F6F3FB',
  border:      '#ECE6F4',
  ink:         '#14101C',
  muted:       '#6E6780',
  mutedSoft:   '#9990A8',
  accent:      '#7C3AED',
  accentDeep:  '#5B21B6',
  accentSoft:  '#F0E8FF',
  accentInk:   '#4C1D95',
  ok:          '#15803D',
  okSoft:      '#DCFCE7',
  warn:        '#B45309',
  warnSoft:    '#FEF3C7',
  err:         '#B91C1C',
  errSoft:     '#FEE2E2',
  sans:        "'Geist', ui-sans-serif, sans-serif",
  serif:       "'Instrument Serif', Georgia, serif",
  mono:        "'Geist Mono', monospace",
};

// ─── Supabase ─────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://rgwbmqlcxxrynufcmwqx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_F-ZIctvp3JyhpVGNXbMttw_9vc7tdtH';

const sbHeaders = {
  apikey:        SUPABASE_KEY,
  Authorization: `Bearer ${SUPABASE_KEY}`,
  'Content-Type': 'application/json',
};

async function sbGet(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: sbHeaders });
  if (!res.ok) throw new Error(`Supabase ${res.status}: ${await res.text()}`);
  return res.json();
}

async function fetchEtappe(etappeId) {
  const cols = 'id,datum,tag_nr,tagesueberschrift,startort,zielort,reel_stil,erzaehl_stimmung,stil_bewertung,stil_notiz';
  const rows = await sbGet(`etappen?id=eq.${etappeId}&select=${cols}&limit=1`);
  return rows[0] || null;
}

async function fetchLatestEtappeIdWithBilder() {
  // Walk recent etappen by datum (UUIDs aren't chronological) and return
  // the first one that actually has fotos with bildgen_datei.
  const etappen = await sbGet(`etappen?select=id&order=datum.desc&limit=30`);
  for (const { id } of etappen) {
    const check = await sbGet(`fotos?etappe_id=eq.${id}&bildgen_datei=not.is.null&select=etappe_id&limit=1`);
    if (check.length) return id;
  }
  return null;
}

async function fetchFotos(etappeId) {
  return sbGet(
    `fotos?etappe_id=eq.${etappeId}&bildgen_datei=not.is.null&select=foto_nr,bildgen_datei,tagesstil&order=foto_nr.asc`
  );
}

async function saveReview(etappeId, bewertung, notiz) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/etappen?id=eq.${etappeId}`, {
    method:  'PATCH',
    headers: { ...sbHeaders, Prefer: 'return=minimal' },
    body:    JSON.stringify({ stil_bewertung: bewertung, stil_notiz: notiz || null }),
  });
  if (!res.ok) throw new Error(`Supabase PATCH ${res.status}: ${await res.text()}`);
}

// ─── URL helper ───────────────────────────────────────────────────────────────
function getUrlParam(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function etappeName(e) {
  if (e.startort && e.zielort) return `${e.startort} → ${e.zielort}`;
  return e.tagesueberschrift || `Etappe ${e.tag_nr || '?'}`;
}

// ─── Rating config ────────────────────────────────────────────────────────────
const RATINGS = [
  { value: 1, emoji: '🔄', label: 'Nochmal', color: T.warn,   bg: T.warnSoft,   activeBorder: '#92400E' },
  { value: 2, emoji: '👍', label: 'Gut',     color: T.accent, bg: T.accentSoft, activeBorder: T.accentDeep },
  { value: 3, emoji: '🔥', label: 'Top',     color: T.ok,     bg: T.okSoft,     activeBorder: '#166534' },
];

// ─── Components ───────────────────────────────────────────────────────────────
function RatingButton({ rating, selected, onClick }) {
  return (
    <button onClick={onClick} style={{
      display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 7,
      padding: '14px 32px', cursor: 'pointer', borderRadius: 12,
      border: `2px solid ${selected ? rating.activeBorder : T.border}`,
      background: selected ? rating.bg : T.surface,
      transform: selected ? 'translateY(-2px)' : 'none',
      boxShadow: selected ? `0 4px 16px ${rating.bg}` : 'none',
      transition: 'all 0.15s ease',
      minWidth: 110,
    }}>
      <span style={{ fontSize: 30, lineHeight: 1 }}>{rating.emoji}</span>
      <span style={{
        fontFamily: T.sans, fontSize: 12, fontWeight: 600, letterSpacing: 0.2,
        color: selected ? rating.color : T.muted,
        textTransform: 'uppercase',
      }}>
        {rating.label}
      </span>
    </button>
  );
}

function ImageCard({ foto }) {
  const [state, setState] = useState('loading'); // loading | ok | error
  // URL-encode each path segment so spaces and special chars (–, ä…) are valid in file:// URLs
  const imgSrc = foto.bildgen_datei
    ? 'file://' + foto.bildgen_datei.split('/').map(seg => encodeURIComponent(seg)).join('/')
    : null;

  return (
    <div style={{
      borderRadius: 10, overflow: 'hidden', background: T.surfaceAlt,
      border: `1px solid ${T.border}`, position: 'relative',
      aspectRatio: '9 / 16',
    }}>
      {/* placeholder while loading or on error */}
      {state !== 'ok' && (
        <div style={{
          position: 'absolute', inset: 0, display: 'flex', flexDirection: 'column',
          alignItems: 'center', justifyContent: 'center', gap: 8, padding: 12,
        }}>
          {state === 'loading' && (
            <span style={{ fontFamily: T.mono, fontSize: 10, color: T.mutedSoft }}>Laden…</span>
          )}
          {state === 'error' && (
            <>
              <span style={{ fontSize: 20 }}>🖼</span>
              <span style={{ fontFamily: T.mono, fontSize: 9, color: T.mutedSoft, textAlign: 'center',
                wordBreak: 'break-all', padding: '0 4px' }}>
                {foto.foto_nr}
              </span>
            </>
          )}
        </div>
      )}
      {imgSrc && (
        <img
          src={imgSrc}
          alt={foto.foto_nr}
          onLoad={() => setState('ok')}
          onError={() => setState('error')}
          style={{ width: '100%', height: '100%', objectFit: 'cover', display: state === 'ok' ? 'block' : 'none' }}
        />
      )}
      {/* foto_nr label */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0,
        padding: '20px 8px 7px',
        background: 'linear-gradient(transparent, rgba(20,16,28,0.72))',
        fontFamily: T.mono, fontSize: 9, color: 'rgba(255,255,255,0.75)',
        letterSpacing: 0.3,
      }}>
        {foto.foto_nr}
      </div>
    </div>
  );
}

// ─── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [etappe, setEtappe]   = useState(null);
  const [fotos, setFotos]     = useState([]);
  const [loading, setLoading] = useState(true);
  const [loadErr, setLoadErr] = useState(null);

  const [rating, setRating]   = useState(null);  // 1 | 2 | 3
  const [notiz, setNotiz]     = useState('');
  const [saving, setSaving]   = useState(false);
  const [saveMsg, setSaveMsg] = useState(null);   // { text, type }

  useEffect(() => {
    (async () => {
      try {
        let etappeId = getUrlParam('etappe_id');
        if (!etappeId) etappeId = await fetchLatestEtappeIdWithBilder();
        if (!etappeId) throw new Error('Keine Etappe mit generierten Bildern gefunden.');

        const [e, f] = await Promise.all([fetchEtappe(etappeId), fetchFotos(etappeId)]);
        if (!e) throw new Error(`Etappe ${etappeId} nicht gefunden.`);
        setEtappe(e);
        setFotos(f);
        if (e.stil_bewertung) setRating(e.stil_bewertung);
        if (e.stil_notiz)     setNotiz(e.stil_notiz);
      } catch (err) {
        setLoadErr(err.message);
      } finally {
        setLoading(false);
      }
    })();
  }, []);

  async function handleSave() {
    if (!etappe || rating === null || saving) return;
    setSaving(true);
    setSaveMsg(null);
    try {
      await saveReview(etappe.id, rating, notiz);
      setSaveMsg({ text: '✓ Bewertung gespeichert', type: 'ok' });
      setTimeout(() => setSaveMsg(null), 4000);
    } catch (err) {
      setSaveMsg({ text: `Fehler: ${err.message}`, type: 'error' });
    } finally {
      setSaving(false);
    }
  }

  // Stil-Name aus fotos (tagesstil), Fallback reel_stil
  const stilName = fotos.length > 0
    ? (fotos[0].tagesstil || etappe?.reel_stil || '–')
    : (etappe?.reel_stil || '–');

  const savedRating = RATINGS.find(r => r.value === etappe?.stil_bewertung);

  // ── Loading ──
  if (loading) return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh',
      fontFamily: T.sans, fontSize: 14, color: T.muted }}>
      Lade…
    </div>
  );

  // ── Error ──
  if (loadErr) return (
    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', height: '100vh',
      flexDirection: 'column', gap: 12, padding: 40 }}>
      <div style={{ fontFamily: T.serif, fontSize: 28, color: T.ink }}>Fehler</div>
      <div style={{ fontFamily: T.sans, fontSize: 14, color: T.err, maxWidth: 480, textAlign: 'center' }}>{loadErr}</div>
    </div>
  );

  return (
    <div style={{ minHeight: '100vh', background: T.bg, paddingBottom: 180 }}>

      {/* ── Sticky topbar ──────────────────────────────────────────────── */}
      <div style={{
        position: 'sticky', top: 0, zIndex: 10,
        background: T.surface, borderBottom: `1px solid ${T.border}`,
        padding: '14px 28px',
        display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 16,
      }}>
        <div>
          <div style={{
            fontFamily: T.mono, fontSize: 10, color: T.accent, fontWeight: 600,
            textTransform: 'uppercase', letterSpacing: 0.7, marginBottom: 4,
          }}>
            Style Review
            {etappe && ` · TAG ${etappe.tag_nr} · ${etappe.datum}`}
          </div>
          <div style={{ fontFamily: T.serif, fontSize: 22, color: T.ink, lineHeight: 1.1 }}>
            {etappe ? etappeName(etappe) : '…'}
          </div>
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 10, flexShrink: 0 }}>
          {savedRating && (
            <span style={{
              fontFamily: T.sans, fontSize: 12, padding: '4px 10px', borderRadius: 6,
              background: savedRating.bg, color: savedRating.color, fontWeight: 600,
            }}>
              {savedRating.emoji} {savedRating.label}
            </span>
          )}
          {etappe?.reel_stil && (
            <span style={{
              fontFamily: T.mono, fontSize: 11, color: T.muted, padding: '4px 10px',
              background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 6,
            }}>
              {etappe.reel_stil}
            </span>
          )}
          <a href="dashboard.html" style={{
            fontFamily: T.sans, fontSize: 12, color: T.accent, textDecoration: 'none',
            padding: '6px 14px', border: `1px solid ${T.border}`, borderRadius: 8,
            background: T.surface, fontWeight: 500,
          }}>
            ← Dashboard
          </a>
        </div>
      </div>

      {/* ── Style hero ─────────────────────────────────────────────────── */}
      <div style={{ padding: '28px 28px 4px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 6 }}>
          <div style={{ width: 4, height: 40, background: T.accent, borderRadius: 2, flexShrink: 0 }} />
          <div>
            <div style={{
              fontFamily: T.mono, fontSize: 10, color: T.muted, fontWeight: 500,
              textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 2,
            }}>
              Stil
            </div>
            <div style={{ fontFamily: T.serif, fontSize: 34, color: T.ink, lineHeight: 1 }}>
              {stilName}
            </div>
          </div>
        </div>
        {etappe?.erzaehl_stimmung && (
          <div style={{
            marginLeft: 18, fontFamily: T.sans, fontSize: 13, color: T.muted,
            fontStyle: 'italic', marginTop: 6,
          }}>
            {etappe.erzaehl_stimmung}
          </div>
        )}
        <div style={{
          marginLeft: 18, marginTop: 8,
          fontFamily: T.mono, fontSize: 11, color: T.mutedSoft,
        }}>
          {fotos.length} generierte Bilder
        </div>
      </div>

      {/* ── Image grid ─────────────────────────────────────────────────── */}
      {fotos.length > 0 ? (
        <div style={{
          padding: '20px 28px',
          display: 'grid',
          gridTemplateColumns: 'repeat(auto-fill, minmax(190px, 1fr))',
          gap: 12,
        }}>
          {fotos.map(foto => <ImageCard key={foto.foto_nr} foto={foto} />)}
        </div>
      ) : (
        <div style={{
          padding: 80, textAlign: 'center',
          fontFamily: T.sans, fontSize: 14, color: T.muted,
        }}>
          Keine generierten Bilder für diese Etappe.
        </div>
      )}

      {/* ── Sticky review panel ────────────────────────────────────────── */}
      <div style={{
        position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 20,
        background: T.surface, borderTop: `2px solid ${T.border}`,
        boxShadow: '0 -6px 28px rgba(20,16,28,0.07)',
        padding: '18px 28px',
      }}>
        <div style={{
          maxWidth: 960, margin: '0 auto',
          display: 'flex', gap: 24, alignItems: 'flex-end', flexWrap: 'wrap',
        }}>

          {/* Rating buttons */}
          <div>
            <div style={{
              fontFamily: T.sans, fontSize: 10, fontWeight: 600, color: T.mutedSoft,
              textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 10,
            }}>
              Bewertung
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              {RATINGS.map(r => (
                <RatingButton key={r.value} rating={r}
                  selected={rating === r.value}
                  onClick={() => setRating(r.value)} />
              ))}
            </div>
          </div>

          {/* Notes textarea */}
          <div style={{ flex: 1, minWidth: 200 }}>
            <div style={{
              fontFamily: T.sans, fontSize: 10, fontWeight: 600, color: T.mutedSoft,
              textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 10,
            }}>
              Notiz (optional)
            </div>
            <textarea
              value={notiz}
              onChange={e => setNotiz(e.target.value)}
              placeholder="Anmerkung zum Stil…"
              rows={2}
              style={{
                width: '100%', fontFamily: T.sans, fontSize: 13, color: T.ink,
                background: T.surfaceAlt, border: `1px solid ${T.border}`,
                borderRadius: 8, padding: '10px 12px', resize: 'vertical',
                outline: 'none', lineHeight: 1.5,
              }}
            />
          </div>

          {/* Save button + feedback */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'flex-end', flexShrink: 0 }}>
            {saveMsg && (
              <div style={{
                padding: '8px 14px', borderRadius: 8, fontFamily: T.sans, fontSize: 12, fontWeight: 500,
                background: saveMsg.type === 'ok' ? T.okSoft : T.errSoft,
                color:      saveMsg.type === 'ok' ? T.ok     : T.err,
                border: `1px solid ${saveMsg.type === 'ok' ? '#166534' : T.err}`,
              }}>
                {saveMsg.text}
              </div>
            )}
            <button
              onClick={handleSave}
              disabled={saving || rating === null}
              style={{
                fontFamily: T.sans, fontSize: 14, fontWeight: 600,
                padding: '13px 28px', borderRadius: 10, border: 'none',
                background: rating !== null && !saving ? T.accent : T.surfaceAlt,
                color:      rating !== null && !saving ? '#fff'   : T.mutedSoft,
                cursor:     rating !== null && !saving ? 'pointer' : 'not-allowed',
                opacity: saving ? 0.7 : 1,
                transition: 'background 0.15s, color 0.15s',
              }}
            >
              {saving ? 'Speichern…' : 'Bewertung speichern'}
            </button>
          </div>
        </div>
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
