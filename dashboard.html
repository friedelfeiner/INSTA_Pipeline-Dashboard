<script type="text/babel">
const { useState } = React;

// ─── Design tokens ────────────────────────────────────────────────────────────
const T = {
  bg:          '#FBFAFC',
  surface:     '#FFFFFF',
  surfaceAlt:  '#F6F3FB',
  border:      '#ECE6F4',
  ink:         '#14101C',
  muted:       '#6E6780',
  mutedSoft:   '#9990A8',
  accent:      '#7C3AED',
  accentDeep:  '#5B21B6',
  accentSoft:  '#F0E8FF',
  accentInk:   '#4C1D95',
  ok:          '#15803D',
  okSoft:      '#DCFCE7',
  warn:        '#B45309',
  warnSoft:    '#FEF3C7',
  err:         '#B91C1C',
  errSoft:     '#FEE2E2',
  sans:        "'Geist', ui-sans-serif, sans-serif",
  serif:       "'Instrument Serif', Georgia, serif",
  mono:        "'Geist Mono', monospace",
};

// ─── Supabase config ──────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://rgwbmqlcxxrynufcmwqx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_F-ZIctvp3JyhpVGNXbMttw_9vc7tdtH';

// ─── Data loading ─────────────────────────────────────────────────────────────
async function fetchEtappen() {
  const cols = [
    'datum','tag_nr','etappen_nr','tagesueberschrift','erzaehl_stimmung',
    'startort','zielort','pipeline_status','route_id',
    'run_at','cost_total_eur','cost_llm_eur','cost_imagegen_eur',
    'cost_video_eur','cost_tts_eur','duration_total_s','agent_timings_s',
    'retries','errors','photos_input','photos_selected','t2i_count','video_count',
  ].join(',');
  const url = `${SUPABASE_URL}/rest/v1/etappen?select=${cols}&order=datum.desc&limit=60`;
  const res = await fetch(url, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}: ${await res.text()}`);
  return res.json();
}

function etappeName(e) {
  if (e.startort && e.zielort) return `${e.startort} → ${e.zielort}`;
  return e.tagesueberschrift || `Etappe ${e.tag_nr || e.etappen_nr || '?'}`;
}

function statusMap(s) {
  if (s === 'publiziert') return 'success';
  if (!s || s === 'neu') return 'partial';
  return 'partial';
}

function transformData(rows) {
  if (!rows || !rows.length) return null;

  // Filtere auf Etappen die zumindest einen Namen haben
  const valid = rows.filter(e => e.datum);
  if (!valid.length) return null;

  const latest = valid[0];
  const chronological = [...valid].reverse();

  const etappenList = chronological.map(e => ({
    n:       e.tag_nr || 0,
    name:    etappeName(e),
    cost:    e.cost_total_eur || 0,
    dur:     e.duration_total_s || 0,
    status:  statusMap(e.pipeline_status),
    retries: Object.values(e.retries || {}).reduce((a, b) => a + b, 0),
  }));

  const trend28 = valid.slice(0, 28).map(e => e.cost_total_eur || 0).reverse();
  const retryHistory = valid.slice(0, 12).map(e =>
    Object.values(e.retries || {}).reduce((a, b) => a + b, 0)
  ).reverse();

  const timings = latest.agent_timings_s || {};
  const tripTotal = Math.round(valid.reduce((s, e) => s + (e.cost_total_eur || 0), 0) * 100) / 100;
  const runTime = latest.run_at ? latest.run_at.slice(11, 16) : '–';

  return {
    etappe:          latest.tag_nr || 0,
    name:            etappeName(latest),
    date:            latest.datum || '–',
    time:            runTime,
    status:          statusMap(latest.pipeline_status),
    coreTheme:       latest.tagesueberschrift || '',
    erzaehlStimmung: latest.erzaehl_stimmung || '',
    costs: {
      total:    latest.cost_total_eur    || 0,
      llm:      latest.cost_llm_eur      || 0,
      imagegen: latest.cost_imagegen_eur || 0,
      video:    latest.cost_video_eur    || 0,
      tts:      latest.cost_tts_eur      || 0,
    },
    tripTotal,
    duration: {
      total:    latest.duration_total_s || 0,
      analyst:  timings.analyst   || 0,
      narrator: timings.narrator  || 0,
      imagegen: timings.imagegen  || 0,
      animator: timings.animator  || 0,
      tts:      timings.tts       || 0,
    },
    retries:  latest.retries || {},
    errors:   latest.errors  || [],
    photos: {
      input:    latest.photos_input    || 0,
      selected: latest.photos_selected || 0,
    },
    trend28,
    retryHistory,
    durationHistory: {
      imagegen: valid.slice(0, 12).map(e => (e.agent_timings_s || {}).imagegen || 0).reverse(),
    },
    etappenList,
  };
}

// ─── Icons (inline SVG) ───────────────────────────────────────────────────────
const Ic = ({ d, size = 16, sw = 2, style: s, color: c }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
    fill="none" stroke={c || 'currentColor'} strokeWidth={sw}
    strokeLinecap="round" strokeLinejoin="round" style={s}>
    {[].concat(d).map((path, i) => <path key={i} d={path} />)}
  </svg>
);
const ISparkles    = p => <Ic {...p} d={["M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z","M20 3v4","M22 5h-4","M4 17v2","M5 18H3"]} />;
const ICircleCheck = p => <Ic {...p} d={["M22 11.08V12a10 10 0 1 1-5.93-9.14","m9 11 3 3L22 4"]} />;
const IAlert       = p => <Ic {...p} d={["m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3","M12 9v4","M12 17h.01"]} />;
const IDash        = p => <Ic {...p} d={["M11 3H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z","M19 3h-2a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z","M19 13h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2z","M11 13H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2z"]} />;
const ICoins       = p => <Ic {...p} d={["M9 14c0 1.657 2.686 3 6 3s6-1.343 6-3-2.686-3-6-3-6 1.343-6 3z","M9 14v4c0 1.656 2.686 3 6 3s6-1.344 6-3v-4","M3 6c0 1.072 1.144 2.062 3 2.598S10.5 9 12 8.598C13.5 8.19 15 7.334 15 6.002L15 6c0-1.657-2.686-3-6-3S3 4.343 3 6z","M3 6v10c0 1.657 2.686 3 6 3 1.5 0 2.87-.24 4-.655"]} />;
const IGauge       = p => <Ic {...p} d={["m12 14 2.5-2.5","M6.3 20.3a8 8 0 1 1 11.4 0L16 16H8z"]} />;
const IShield      = p => <Ic {...p} d={["M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z","m9 12 2 2 4-4"]} />;
const IEuro        = p => <Ic {...p} d={["M4 10h12","M4 14h12","M19.5 9.5c-1.5-2.5-4-3.5-6.5-3.5-5 0-8 3.5-8 8s3 8 8 8c2.5 0 5-1 6.5-3.5"]} />;
const IClock       = p => <Ic {...p} d={["M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z","M12 6v6l4 2"]} />;
const IRefresh     = p => <Ic {...p} d={["M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8","M21 3v5h-5","M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16","M8 16H3v5"]} />;
const ITrendDown   = p => <Ic {...p} d={["M22 17L13.5 8.5 8.5 13.5 2 7","M16 17h6v-6"]} />;
const ITrendUp     = p => <Ic {...p} d={["M22 7L13.5 15.5 8.5 10.5 2 17","M16 7h6v6"]} />;

// ─── Shared primitives ────────────────────────────────────────────────────────
function Pill({ state = 'ok', label }) {
  const m = {
    ok:      { bg: T.okSoft,   fg: T.ok,   Icon: ICircleCheck },
    partial: { bg: T.warnSoft, fg: T.warn, Icon: IAlert },
    warn:    { bg: T.warnSoft, fg: T.warn, Icon: IAlert },
    error:   { bg: T.errSoft,  fg: T.err,  Icon: IAlert },
  }[state] || { bg: T.okSoft, fg: T.ok, Icon: ICircleCheck };
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 10px',
      background: m.bg, color: m.fg, fontFamily: T.sans, fontSize: 11, fontWeight: 500, borderRadius: 4 }}>
      <m.Icon size={12} sw={2.2} /> {label}
    </span>
  );
}

function AreaChart({ points, h = 60, accent, id }) {
  const col = accent || T.accent;
  const gid = `g-${id || Math.random().toString(36).slice(2)}`;
  const max = Math.max(...points);
  const min = Math.min(...points);
  const range = max - min || 1;
  const w = 300;
  const step = w / (points.length - 1);
  const toY = v => 6 + (1 - (v - min) / range) * (h - 12);
  const line = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${(i * step).toFixed(1)},${toY(p).toFixed(1)}`).join(' ');
  const area = `${line} L${w},${h} L0,${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: '100%', height: h, display: 'block' }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={col} stopOpacity="0.28" />
          <stop offset="100%" stopColor={col} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke={col} strokeWidth="2" vectorEffect="non-scaling-stroke" />
      <circle cx={(points.length - 1) * step} cy={toY(points[points.length - 1])} r="3.5" fill={col} stroke={T.surface} strokeWidth="2" />
    </svg>
  );
}

function BarChart({ values, h = 90, colorFn }) {
  const max = Math.max(...values, 1);
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, height: h }}>
      {values.map((v, i) => (
        <div key={i} style={{ flex: 1, height: `${Math.max((v / max) * 100, 4)}%`,
          background: colorFn ? colorFn(v, i) : T.accent,
          borderRadius: '4px 4px 2px 2px' }} />
      ))}
    </div>
  );
}

function KPI({ icon: Icon, label, value, sub, trend }) {
  return (
    <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: 18 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div style={{ width: 28, height: 28, borderRadius: 8, background: T.accentSoft, display: 'flex', alignItems: 'center', justifyContent: 'center', color: T.accent }}>
            <Icon size={14} sw={2} />
          </div>
          <span style={{ fontFamily: T.sans, fontSize: 12, color: T.muted, fontWeight: 500 }}>{label}</span>
        </div>
        {trend && (
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, padding: '3px 7px',
            background: trend.dir === 'up' ? T.errSoft : T.okSoft,
            color: trend.dir === 'up' ? T.err : T.ok,
            fontFamily: T.mono, fontSize: 10, fontWeight: 600, borderRadius: 4 }}>
            {trend.dir === 'up' ? <ITrendUp size={10} /> : <ITrendDown size={10} />} {trend.v}
          </span>
        )}
      </div>
      <div style={{ fontFamily: T.serif, fontSize: 44, fontWeight: 400, color: T.ink, lineHeight: 1, letterSpacing: -1, marginBottom: 8 }}>{value}</div>
      <div style={{ fontFamily: T.sans, fontSize: 12, color: T.muted }}>{sub}</div>
    </div>
  );
}

function Panel({ children, style: s }) {
  return (
    <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: 20, ...s }}>
      {children}
    </div>
  );
}

function PanelHeader({ icon: Icon, label, serif, right }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 12, marginBottom: 18 }}>
      <div style={{ minWidth: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: serif ? 8 : 0 }}>
          {Icon && <Icon size={15} style={{ color: T.accent }} sw={2} />}
          <span style={{ fontSize: 13, fontWeight: 600, color: T.ink }}>{label}</span>
        </div>
        {serif && <div style={{ fontFamily: T.serif, fontSize: 20, fontWeight: 400, lineHeight: 1.2, color: T.ink }}>{serif}</div>}
      </div>
      {right && <div style={{ flexShrink: 0 }}>{right}</div>}
    </div>
  );
}

function AgentBar({ name, seconds, maxSec = 520 }) {
  const pct = Math.min(100, (seconds / maxSec) * 100);
  const intense = pct > 60;
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 500 }}>{name}</span>
        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{seconds}<span style={{ color: T.mutedSoft }}>s</span></span>
      </div>
      <div style={{ height: 8, background: T.surfaceAlt, borderRadius: 4, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct}%`,
          background: intense ? `linear-gradient(90deg, ${T.accent}, ${T.accentDeep})` : T.accent,
          borderRadius: 4 }} />
      </div>
    </div>
  );
}

function CostBar({ name, value, pct, color }) {
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7 }}>
          <span style={{ width: 8, height: 8, borderRadius: 2, background: color, flexShrink: 0 }} />
          <span style={{ fontFamily: T.sans, fontSize: 12.5, color: T.ink, fontWeight: 500 }}>{name}</span>
        </span>
        <span>
          <span style={{ fontFamily: T.mono, fontSize: 11, color: T.mutedSoft, marginRight: 8 }}>{pct}%</span>
          <span style={{ fontFamily: T.mono, fontSize: 12, color: T.ink, fontWeight: 500 }}>{value}</span>
        </span>
      </div>
      <div style={{ height: 8, background: T.surfaceAlt, borderRadius: 4, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct}%`, background: color, borderRadius: 4 }} />
      </div>
    </div>
  );
}

function StatusDot({ status }) {
  const c = { success: T.ok, partial: T.warn, error: T.err }[status] || T.muted;
  return <span style={{ width: 7, height: 7, borderRadius: '50%', background: c, display: 'inline-block', flexShrink: 0 }} />;
}

function TrendBadge({ dir, val }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, padding: '3px 7px',
      background: dir === 'up' ? T.errSoft : T.okSoft,
      color: dir === 'up' ? T.err : T.ok,
      fontFamily: T.mono, fontSize: 10, fontWeight: 600, borderRadius: 4 }}>
      {dir === 'up' ? <ITrendUp size={10} /> : <ITrendDown size={10} />} {val}
    </span>
  );
}

// ─── Tab content ──────────────────────────────────────────────────────────────
function TabUebersicht() {

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14 }}>

        <KPI icon={IClock}   label="Dauer"         value="847s"  sub="14:07 Min · Ø 720s" trend={{ dir: 'down', v: '6%' }} />
        <KPI icon={IRefresh} label="Retries"       value="2"     sub="1 Warnung · alle resolved" />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 14 }}>
        <Panel>
          <PanelHeader icon={ICoins} label="Kosten-Breakdown" serif="Wo geht das Geld hin?"
            right={<div style={{ textAlign: 'right' }}>
              <div style={{ fontFamily: T.serif, fontSize: 24, fontWeight: 400, letterSpacing: -0.3 }}>€0.43</div>
              <div style={{ fontSize: 10, color: T.muted, fontFamily: T.mono }}>dieser Run</div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>

            </div>
            <AreaChart points={data.trend28} h={56} id="ov-cost" />
          </div>
        </Panel>

        <Panel>
          <PanelHeader icon={IGauge} label="Dauer pro Agent" serif="Wer bremst?"
            right={<div style={{ textAlign: 'right' }}>
              <div style={{ fontFamily: T.serif, fontSize: 24, fontWeight: 400, letterSpacing: -0.3 }}>847<span style={{ fontSize: 14, color: T.muted }}>s</span></div>

          <div style={{ display: 'flex', flexDirection: 'column', gap: 13 }}>
            <AgentBar name="analyst"  seconds={12} />
            <AgentBar name="narrator" seconds={8} />
            <AgentBar name="imagegen" seconds={277} />
            <AgentBar name="video"    seconds={510} />
            <AgentBar name="tts"      seconds={40} />
          </div>
          <div style={{ marginTop: 18, paddingTop: 16, borderTop: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: T.sans, fontSize: 11, color: T.muted, fontWeight: 500 }}>imagegen · letzte 12 Etappen</div>
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 8px', marginTop: 5, background: T.warnSoft, color: T.warn, borderRadius: 4, fontSize: 11, fontWeight: 500 }}>

            </div>
            <div style={{ width: 90, flexShrink: 0 }}>
              <AreaChart points={data.durationHistory.imagegen} h={36} accent={T.warn} id="ov-img" />

        <PanelHeader icon={IShield} label="Reliability" serif="Hat alles funktioniert?"

        <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: 20 }}>
          <div>
            <div style={{ fontSize: 11, color: T.muted, fontWeight: 500, marginBottom: 8 }}>Retries pro Etappe · letzte 12</div>
            <BarChart values={data.retryHistory} h={90}

            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontFamily: T.mono, fontSize: 10, color: T.mutedSoft }}>

                <div>

                </div>

          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8, color: T.accent }}>
            <div style={{ width: 24, height: 1, background: T.accent }} />
            <span style={{ fontFamily: T.mono, fontSize: 11, letterSpacing: 0.6, textTransform: 'uppercase', fontWeight: 500 }}>Heute · Tag {data.etappe} von 30</span>
          </div>
          <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 20 }}>
            <h1 style={{ fontFamily: T.serif, fontSize: 34, fontWeight: 400, margin: 0, letterSpacing: -0.6, lineHeight: 1.05, whiteSpace: 'nowrap' }}>
              {data.name.replace('→', '')} <span style={{ color: T.accent, fontStyle: 'italic' }}>→</span> {data.name.split('→')[1]?.trim()}
            </h1>
            <ScopeSwitcher scope={scope} onChange={setScope} />
          </div>
        </div>

        {/* Tabs */}
        <div style={{ display: 'flex', gap: 2, marginTop: 18 }}>
          {TABS.map(t => (
            <div key={t.id} onClick={() => setTab(t.id)}
              style={{ display: 'flex', alignItems: 'center', gap: 7, padding: '9px 14px', borderRadius: 8, cursor: 'pointer',
                background: tab === t.id ? T.accentSoft : 'transparent',
                color: tab === t.id ? T.accentInk : T.muted,
                fontFamily: T.sans, fontSize: 13, fontWeight: tab === t.id ? 600 : 500,
                transition: 'background 0.12s, color 0.12s' }}>
              <t.Icon size={14} sw={tab === t.id ? 2 : 1.7} />
              {t.label}
            </div>
          ))}
        </div>
      </div>

      {/* Scrollable content */}
      <div style={{ flex: 1, overflow: 'auto', padding: '24px 28px' }}>
        <active.Content />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
