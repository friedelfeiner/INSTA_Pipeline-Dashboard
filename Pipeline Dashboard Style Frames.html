<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>INSTA Pipeline · Style Frames</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
// ─── Lucide Icons (inline SVG) ────────────────────────────────────────────────
const Icon = ({ d, size = 16, strokeWidth = 2, style, color }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24"
    fill="none" stroke={color || 'currentColor'} strokeWidth={strokeWidth}
    strokeLinecap="round" strokeLinejoin="round" style={style}>
    {[].concat(d).map((path, i) => <path key={i} d={path} />)}
  </svg>
);

const IconSparkles       = p => <Icon {...p} d={["M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z", "M20 3v4", "M22 5h-4", "M4 17v2", "M5 18H3"]} />;
const IconCircleCheck    = p => <Icon {...p} d={["M22 11.08V12a10 10 0 1 1-5.93-9.14", "m9 11 3 3L22 4"]} />;
const IconAlertTriangle  = p => <Icon {...p} d={["m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3", "M12 9v4", "M12 17h.01"]} />;
const IconLayoutDashboard= p => <Icon {...p} d={["M11 3H5a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z", "M19 3h-2a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z", "M19 13h-2a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2z", "M11 13H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2z"]} />;
const IconCoins          = p => <Icon {...p} d={["M9 14c0 1.657 2.686 3 6 3s6-1.343 6-3-2.686-3-6-3-6 1.343-6 3z", "M9 14v4c0 1.656 2.686 3 6 3s6-1.344 6-3v-4", "M3 6c0 1.072 1.144 2.062 3 2.598S10.5 9 12 8.598C13.5 8.19 15 7.334 15 6.002L15 6c0-1.657-2.686-3-6-3S3 4.343 3 6z", "M3 6v10c0 1.657 2.686 3 6 3 1.5 0 2.87-.24 4-.655"]} />;
const IconGauge          = p => <Icon {...p} d={["m12 14 2.5-2.5", "M6.3 20.3a8 8 0 1 1 11.4 0L16 16H8z"]} />;
const IconShieldCheck    = p => <Icon {...p} d={["M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z", "m9 12 2 2 4-4"]} />;
const IconEuro           = p => <Icon {...p} d={["M4 10h12", "M4 14h12", "M19.5 9.5c-1.5-2.5-4-3.5-6.5-3.5-5 0-8 3.5-8 8s3 8 8 8c2.5 0 5-1 6.5-3.5"]} />;
const IconClock          = p => <Icon {...p} d={["M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z", "M12 6v6l4 2"]} />;
const IconRefresh        = p => <Icon {...p} d={["M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8", "M21 3v5h-5", "M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16", "M8 16H3v5"]} />;
const IconTrendDown      = p => <Icon {...p} d={["M22 17L13.5 8.5 8.5 13.5 2 7", "M16 17h6v-6"]} />;
const IconTrendUp        = p => <Icon {...p} d={["M22 7L13.5 15.5 8.5 10.5 2 17", "M16 7h6v6"]} />;

// ─── Design Canvas shell ──────────────────────────────────────────────────────
function DesignCanvas({ children }) {
  return (
    <div style={{ minHeight: '100vh', padding: '40px 32px', fontFamily: "'Geist', sans-serif" }}>
      <div style={{ maxWidth: 2600, margin: '0 auto' }}>
        {children}
      </div>
    </div>
  );
}

function DCSection({ title, subtitle, children }) {
  return (
    <div style={{ marginBottom: 64 }}>
      <div style={{ marginBottom: 24 }}>
        <h2 style={{ margin: 0, fontSize: 13, fontWeight: 600, letterSpacing: 0.5, textTransform: 'uppercase', color: '#6B6558' }}>{title}</h2>
        {subtitle && <p style={{ margin: '4px 0 0', fontSize: 13, color: '#9A9386' }}>{subtitle}</p>}
      </div>
      <div style={{ display: 'flex', gap: 32, flexWrap: 'wrap', alignItems: 'flex-start' }}>
        {children}
      </div>
    </div>
  );
}

function DCArtboard({ label, width, height, children }) {
  return (
    <div style={{ flexShrink: 0 }}>
      <div style={{ marginBottom: 10, fontSize: 12, fontWeight: 500, color: '#6B6558', letterSpacing: 0.3 }}>{label}</div>
      <div style={{ width, height, borderRadius: 12, overflow: 'hidden', boxShadow: '0 2px 16px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.06)', position: 'relative' }}>
        {children}
      </div>
      <div style={{ marginTop: 8, fontSize: 11, color: '#9A9386', fontFamily: "'Geist Mono', monospace" }}>{width} × {height}</div>
    </div>
  );
}

function DCPostIt({ top, right, rotate = 0, width = 200, children }) {
  return (
    <div style={{
      position: 'fixed', top, right,
      width, padding: '14px 16px',
      background: '#FEF3C7',
      border: '1px solid #FDE68A',
      borderRadius: 6,
      boxShadow: '0 4px 12px rgba(0,0,0,0.1)',
      transform: `rotate(${rotate}deg)`,
      fontSize: 12,
      lineHeight: 1.5,
      color: '#78350F',
      fontFamily: "'Geist', sans-serif",
      zIndex: 1000,
    }}>
      {children}
    </div>
  );
}

// ─── VARIANT A · Editorial Warm ───────────────────────────────────────────────
const A_TOK = {
  bg: '#FAF7F2',
  surface: '#FFFFFF',
  surfaceAlt: '#F4EFE7',
  border: '#E8E1D4',
  borderStrong: '#D6CCBA',
  ink: '#1E1B16',
  muted: '#6B6558',
  mutedSoft: '#9A9386',
  accent: '#6D3FDB',
  accentSoft: '#EEE6FF',
  accentInk: '#3E2095',
  ok: '#4C8A5F',
  okSoft: '#E6F0E9',
  warn: '#B5872A',
  warnSoft: '#F7EFD9',
  err: '#B0423D',
  errSoft: '#F4E1DF',
  sans: "'Geist', ui-sans-serif, sans-serif",
  serif: "'Instrument Serif', Georgia, serif",
  mono: "'Geist Mono', monospace",
};

function A_StatusPill({ state = 'ok', label }) {
  const tok = A_TOK;
  const map = {
    ok:   { bg: tok.okSoft,   fg: tok.ok,   Icon: IconCircleCheck,   t: label || 'success' },
    warn: { bg: tok.warnSoft, fg: tok.warn, Icon: IconAlertTriangle, t: label || 'partial' },
    err:  { bg: tok.errSoft,  fg: tok.err,  Icon: IconAlertTriangle, t: label || 'error' },
  };
  const s = map[state];
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '3px 9px',
      background: s.bg, color: s.fg, fontFamily: tok.sans, fontSize: 11, fontWeight: 500, borderRadius: 999 }}>
      <s.Icon size={12} strokeWidth={2} /> {s.t}
    </span>
  );
}

function A_Tab({ icon: Icon, label, active }) {
  const tok = A_TOK;
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 7,
      padding: '10px 2px', marginRight: 24,
      borderBottom: active ? `2px solid ${tok.accent}` : '2px solid transparent',
      color: active ? tok.ink : tok.muted,
      fontFamily: tok.sans, fontSize: 13, fontWeight: active ? 500 : 400,
      marginBottom: -1,
    }}>
      {Icon && <Icon size={14} />}
      {label}
    </div>
  );
}

function A_KPI({ icon: Icon, label, value, sub, trend }) {
  const tok = A_TOK;
  return (
    <div style={{ background: tok.surface, border: `1px solid ${tok.border}`, borderRadius: 10, padding: 16 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: tok.muted, marginBottom: 10 }}>
        {Icon && <Icon size={14} />}
        <span style={{ fontFamily: tok.sans, fontSize: 11, letterSpacing: 0.3, textTransform: 'uppercase', fontWeight: 500 }}>{label}</span>
      </div>
      <div style={{ display: 'flex', alignItems: 'baseline', gap: 8, marginBottom: 6 }}>
        <span style={{ fontFamily: tok.serif, fontSize: 38, fontWeight: 400, color: tok.ink, lineHeight: 1, letterSpacing: -0.5 }}>{value}</span>
        {trend && (
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, color: trend.dir === 'up' ? tok.err : tok.ok, fontFamily: tok.mono, fontSize: 11 }}>
            {trend.dir === 'up' ? <IconTrendUp size={11} /> : <IconTrendDown size={11} />} {trend.v}
          </span>
        )}
      </div>
      <div style={{ fontFamily: tok.sans, fontSize: 12, color: tok.muted }}>{sub}</div>
    </div>
  );
}

function A_CostBar({ name, value, pct, color }) {
  const tok = A_TOK;
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 5 }}>
        <span style={{ fontFamily: tok.sans, fontSize: 12, color: tok.ink }}>{name}</span>
        <span style={{ display: 'inline-flex', alignItems: 'baseline', gap: 6 }}>
          <span style={{ fontFamily: tok.mono, fontSize: 11, color: tok.mutedSoft }}>{pct}%</span>
          <span style={{ fontFamily: tok.mono, fontSize: 12, color: tok.ink }}>{value}</span>
        </span>
      </div>
      <div style={{ height: 6, background: tok.surfaceAlt, borderRadius: 3, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct}%`, background: color, borderRadius: 3 }} />
      </div>
    </div>
  );
}

function A_AreaChart({ points = [30, 28, 34, 22, 26, 18, 24, 15, 20, 14, 19, 12], h = 80, accent }) {
  const tok = A_TOK;
  const col = accent || tok.accent;
  const max = Math.max(...points);
  const min = Math.min(...points);
  const range = max - min || 1;
  const w = 300;
  const step = w / (points.length - 1);
  const toY = (v) => 8 + (1 - (v - min) / range) * (h - 16);
  const line = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${i * step},${toY(p)}`).join(' ');
  const area = `${line} L${w},${h} L0,${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: '100%', height: h, display: 'block' }}>
      <defs>
        <linearGradient id="a-area-grad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={col} stopOpacity="0.18" />
          <stop offset="100%" stopColor={col} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill="url(#a-area-grad)" />
      <path d={line} fill="none" stroke={col} strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
      {points.map((p, i) => i === points.length - 1 && (
        <circle key={i} cx={i * step} cy={toY(p)} r="3" fill={tok.surface} stroke={col} strokeWidth="1.5" />
      ))}
    </svg>
  );
}

function A_AgentBar({ name, seconds, maxSec = 520 }) {
  const tok = A_TOK;
  const pct = Math.min(100, (seconds / maxSec) * 100);
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 5 }}>
        <span style={{ fontFamily: tok.mono, fontSize: 11, color: tok.ink }}>{name}</span>
        <span style={{ fontFamily: tok.mono, fontSize: 11, color: tok.muted }}>{seconds}s</span>
      </div>
      <div style={{ height: 6, background: tok.surfaceAlt, borderRadius: 3, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct}%`, background: tok.accent, borderRadius: 3 }} />
      </div>
    </div>
  );
}

function VariantWarmA() {
  const tok = A_TOK;
  return (
    <div style={{ width: '100%', height: '100%', background: tok.bg, fontFamily: tok.sans, color: tok.ink, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
      {/* Header */}
      <div style={{ background: tok.surface, borderBottom: `1px solid ${tok.border}`, padding: '16px 28px' }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ width: 26, height: 26, borderRadius: 7, background: tok.accent, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <IconSparkles size={14} strokeWidth={2} />
            </div>
            <div>
              <div style={{ fontFamily: tok.serif, fontSize: 17, fontWeight: 400, letterSpacing: -0.3, lineHeight: 1 }}>INSTA Pipeline</div>
              <div style={{ fontSize: 11, color: tok.muted, marginTop: 3 }}>MVP · v1</div>
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <A_StatusPill state="ok" label="success" />
            <span style={{ fontFamily: tok.mono, fontSize: 11, color: tok.muted }}>Etappe 12 · 18:42</span>
          </div>
        </div>

        {/* Editorial Titel */}
        <div style={{ marginTop: 20, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', gap: 20 }}>
          <div>
            <div style={{ fontSize: 11, color: tok.muted, marginBottom: 4, fontFamily: tok.mono, letterSpacing: 0.5, textTransform: 'uppercase' }}>Heute · 23. April</div>
            <h1 style={{ fontFamily: tok.serif, fontSize: 36, fontWeight: 400, margin: 0, letterSpacing: -0.6, lineHeight: 1.05 }}>
              Pontremoli <span style={{ color: tok.mutedSoft }}>→</span> Aulla
            </h1>
          </div>
          <div style={{ display: 'flex', gap: 6 }}>
            {['Heute', '28 Tage', 'Reise'].map((l, i) => (
              <div key={l} style={{ padding: '6px 12px', borderRadius: 999,
                background: i === 0 ? tok.ink : 'transparent',
                color: i === 0 ? tok.bg : tok.muted,
                border: i === 0 ? 'none' : `1px solid ${tok.border}`,
                fontSize: 12, fontWeight: 500 }}>{l}</div>
            ))}
          </div>
        </div>

        {/* Tabs */}
        <div style={{ display: 'flex', marginTop: 20, borderBottom: `1px solid ${tok.border}`, marginBottom: -17 }}>
          <A_Tab icon={IconLayoutDashboard} label="Übersicht" active />
          <A_Tab icon={IconCoins} label="Kosten" />
          <A_Tab icon={IconGauge} label="Performance" />
          <A_Tab icon={IconShieldCheck} label="Reliability" />
        </div>
      </div>

      {/* Content */}
      <div style={{ flex: 1, minHeight: 0, overflow: 'auto', padding: 24 }}>
        {/* KPIs */}
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14, marginBottom: 16 }}>
          <A_KPI icon={IconEuro}    label="Kosten"   value="€0.43" sub="Σ Reise €4.82 · 12 Etappen" trend={{ dir: 'down', v: '−12%' }} />
          <A_KPI icon={IconClock}   label="Dauer"    value="847s"  sub="14 Min · Ø 720s"             trend={{ dir: 'down', v: '−6%' }} />
          <A_KPI icon={IconRefresh} label="Retries"  value="2"     sub="1 Warnung · alle resolved" />
        </div>

        {/* 2 Panels */}
        <div style={{ display: 'grid', gridTemplateColumns: '1.1fr 1fr', gap: 14, marginBottom: 16 }}>
          {/* Kosten */}
          <div style={{ background: tok.surface, border: `1px solid ${tok.border}`, borderRadius: 10, padding: 18 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 }}>
              <div>
                <div style={{ fontFamily: tok.serif, fontSize: 18, fontWeight: 400 }}>Kosten-Breakdown</div>
                <div style={{ fontSize: 12, color: tok.muted, marginTop: 2 }}>aktueller Run · pro Kategorie</div>
              </div>
              <span style={{ fontFamily: tok.mono, fontSize: 12, color: tok.muted }}>€0.43</span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              <A_CostBar name="LLM"      value="€0.18" pct={42} color={tok.accent} />
              <A_CostBar name="ImageGen" value="€0.12" pct={28} color="#8E63E8" />
              <A_CostBar name="Video"    value="€0.09" pct={21} color="#B799F0" />
              <A_CostBar name="TTS"      value="€0.04" pct={9}  color="#D9C8F7" />
            </div>
            <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${tok.border}` }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
                <span style={{ fontFamily: tok.mono, fontSize: 10, color: tok.muted, textTransform: 'uppercase', letterSpacing: 0.5 }}>Trend · 28 Tage</span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, color: tok.ok, fontFamily: tok.mono, fontSize: 11 }}>
                  <IconTrendDown size={12} /> stabil
                </span>
              </div>
              <A_AreaChart h={60} />
            </div>
          </div>

          {/* Performance */}
          <div style={{ background: tok.surface, border: `1px solid ${tok.border}`, borderRadius: 10, padding: 18 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 12, marginBottom: 16 }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontFamily: tok.serif, fontSize: 18, fontWeight: 400, lineHeight: 1.2, whiteSpace: 'nowrap' }}>Dauer pro Agent</div>
                <div style={{ fontSize: 12, color: tok.muted, marginTop: 4 }}>wer bremst?</div>
              </div>
              <span style={{ fontFamily: tok.mono, fontSize: 12, color: tok.muted, whiteSpace: 'nowrap', flexShrink: 0 }}>847s Σ</span>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 11 }}>
              <A_AgentBar name="analyst"  seconds={12} />
              <A_AgentBar name="narrator" seconds={8} />
              <A_AgentBar name="imagegen" seconds={277} />
              <A_AgentBar name="video"    seconds={510} />
              <A_AgentBar name="tts"      seconds={40} />
            </div>
            <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${tok.border}`, display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ flex: 1 }}>
                <div style={{ fontFamily: tok.mono, fontSize: 10, color: tok.muted, textTransform: 'uppercase', letterSpacing: 0.5 }}>imagegen · 12 Etappen</div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, color: tok.warn, fontSize: 12, marginTop: 3 }}>
                  <IconTrendUp size={12} strokeWidth={2} />
                  <span style={{ fontFamily: tok.mono }}>+18%</span>
                  <span style={{ color: tok.muted, fontFamily: tok.sans }}>langsamer</span>
                </div>
              </div>
              <div style={{ width: 80 }}>
                <A_AreaChart points={[120, 135, 140, 150, 155, 180, 200, 210, 220, 245, 260, 277]} h={32} accent={tok.warn} />
              </div>
            </div>
          </div>
        </div>

        {/* Reliability */}
        <div style={{ background: tok.surface, border: `1px solid ${tok.border}`, borderRadius: 10, padding: 18 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 }}>
            <div>
              <div style={{ fontFamily: tok.serif, fontSize: 18, fontWeight: 400 }}>Reliability</div>
              <div style={{ fontSize: 12, color: tok.muted, marginTop: 2 }}>Retries pro Agent · 28 Tage</div>
            </div>
            <A_StatusPill state="warn" label="1 aktive Warnung" />
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: 20 }}>
            <div>
              <div style={{ display: 'flex', alignItems: 'flex-end', gap: 5, height: 80, borderBottom: `1px solid ${tok.border}`, paddingBottom: 2 }}>
                {[0, 1, 0, 0, 2, 0, 1, 0, 0, 3, 1, 2].map((v, i) => (
                  <div key={i} style={{ flex: 1, height: `${(v / 3) * 100}%`, background: v > 1 ? tok.warn : v > 0 ? tok.accent : tok.surfaceAlt, borderRadius: '3px 3px 0 0', minHeight: 4 }} />
                ))}
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, fontFamily: tok.mono, fontSize: 10, color: tok.mutedSoft }}>
                <span>T1</span><span>T4</span><span>T8</span><span>T12</span>
              </div>
            </div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <div style={{ padding: 12, background: tok.warnSoft, border: `1px solid ${tok.warn}33`, borderRadius: 8 }}>
                <div style={{ display: 'flex', gap: 8, alignItems: 'flex-start' }}>
                  <IconAlertTriangle size={14} style={{ color: tok.warn, marginTop: 1 }} />
                  <div style={{ flex: 1 }}>
                    <div style={{ fontSize: 12, fontWeight: 500, color: tok.ink }}>ImageGen · Timeout</div>
                    <div style={{ fontSize: 11, color: tok.muted, marginTop: 2 }}>Retry #2 erfolgreich · 14:22</div>
                  </div>
                </div>

function B_AreaChart({ points = [30, 28, 34, 22, 26, 18, 24, 15, 20, 14, 19, 12], h = 80, accent }) {
  const tok = B_TOK;
  const col = accent || tok.accent;
  const id = `b-area-${Math.floor(Math.random() * 99999)}`;
  const max = Math.max(...points);
  const min = Math.min(...points);
  const range = max - min || 1;
  const w = 300;
  const step = w / (points.length - 1);
  const toY = (v) => 8 + (1 - (v - min) / range) * (h - 16);
  const line = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${i * step},${toY(p)}`).join(' ');
  const area = `${line} L${w},${h} L0,${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: '100%', height: h, display: 'block' }}>
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={col} stopOpacity="0.28" />
          <stop offset="100%" stopColor={col} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${id})`} />
      <path d={line} fill="none" stroke={col} strokeWidth="2" vectorEffect="non-scaling-stroke" />
      {points.map((p, i) => i === points.length - 1 && (
        <circle key={i} cx={i * step} cy={toY(p)} r="3.5" fill={tok.surface} stroke={col} strokeWidth="2" />
      ))}
    </svg>
  );
}
