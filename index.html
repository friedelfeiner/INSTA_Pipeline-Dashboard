                        <span style={{ width: 8, height: 8, borderRadius: 2, background: r.color, display: 'inline-block' }} />
                        {r.label}
                      </span>
                      <span style={{ fontFamily: T.mono, fontSize: 12, color: T.ink, fontWeight: 600 }}>€{r.val.toFixed(3)}</span>
                    </div>
                    <div style={{ height: 6, background: T.surfaceAlt, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${(r.val / maxCost) * 100}%`, background: r.color, borderRadius: 3 }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>
            <div>
              <div style={{ fontSize: 12, fontWeight: 600, color: T.ink, marginBottom: 12 }}>Agent-Timings</div>
              {Object.keys(etappe.timings).length ? (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {Object.entries(etappe.timings).map(([name, sec]) => (
                    <div key={name}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 4 }}>
                        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{name}</span>
                        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 600 }}>{sec}s</span>
                      </div>
                      <div style={{ height: 6, background: T.surfaceAlt, borderRadius: 3, overflow: 'hidden' }}>
                        <div style={{ height: '100%', width: `${(sec / maxTiming) * 100}%`, background: T.accent, borderRadius: 3 }} />
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div style={{ fontSize: 12, color: T.mutedSoft, fontStyle: 'italic' }}>Keine Timing-Daten</div>
              )}
            </div>
          </div>

          {/* Pipeline Steps */}
          {stepGruppen.length > 0 && (
            <div>
              <div style={{ fontSize: 12, fontWeight: 600, color: T.ink, marginBottom: 12 }}>Pipeline-Schritte</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
                {stepGruppen.map((g, i) => (
                  <StepRow key={g.step} gruppe={g} isLast={i === stepGruppen.length - 1} />
                ))}
              </div>
            </div>
          )}

          {/* Errors */}
          {etappe.errors?.length > 0 && (
            <div>
              <div style={{ fontSize: 12, fontWeight: 600, color: T.err, marginBottom: 8 }}>Fehler</div>
              {etappe.errors.map((err, i) => (
                <div key={i} style={{ padding: '10px 14px', background: T.errSoft, borderRadius: 8,
                  borderLeft: `3px solid ${T.err}`, marginBottom: 6, fontSize: 12, color: T.err }}>
                  <strong>{err.agent}:</strong> {err.msg}
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── Live Run Tab ─────────────────────────────────────────────────────────────
// D2/D6: die elf Schritt-Namen, die die Pipeline wirklich schreibt, in ihrer
// Soll-Reihenfolge (main.py: Foto-Analyse → _stage_map → _stage_narrator →
// _stage_selektor → _stage_varianten [Bild-Zweig ∥ Narrator → Audio → Assembler →
// Publisher] → _stage_carousel → _stage_blog). Vorher richtete sich die Ansicht
// nach dem ersten Auftreten und kannte zwei Namen, die nie geschrieben wurden:
// 'carousel' gibt es nicht, 'publisher' schreibt seit D7 die Pipeline (Slot 1)
// bzw. die Edge Function ig-publish-queue (Slots 2–5).
const STEP_ORDER = [
  'analyst', 'map', 'narrator', 'selektor', 'imagegen', 'animator',
  'audio', 'assembler', 'publisher', 'carousel_publisher', 'blog_publisher',
];

const STEP_LABELS = {
  analyst:            'Analyst · Foto-Analyse',
  map:                'Map & Geolocator',
  narrator:           'Narrator · Erzählung',
  selektor:           'Selektor · Auswahl',
  imagegen:           'ImageGen · KI-Bilder',
  animator:           'Animator · KI-Clips',
  audio:              'Audio · Voice-Over',
  assembler:          'Assembler · Rendering',
  publisher:          'Publisher · Reel-Staffel',
  carousel_publisher: 'Karussell · Veröffentlichen',
  blog_publisher:     'Blog · Veröffentlichen',
};

const STEP_DESCRIPTIONS = {
  analyst:            'Jedes Foto wird einzeln auf Motiv, Stimmung und Bildqualität geprüft. Claude entscheidet, welche Aufnahmen zur Etappe passen.',
  map:                'GPS-Koordinaten werden aus den Fotos ausgelesen und Ortsnamen entlang der Route identifiziert. Bilder werden ihren Wegpunkten zugeordnet.',
  narrator:           'Aus Stimmung, Route und ausgewählten Fotos entsteht die Erzählung des Tages. Claude schreibt Text, Caption und Titel — einmal pro Stil.',
  selektor:           'Die besten Fotos werden für Reel, Karussell und Thumbnail ausgewählt. Bildqualität und Erzählfluss bestimmen die Auswahl.',
  imagegen:           'Für jedes ausgewählte Foto wird eine KI-generierte Szene erstellt. Nano Banana übersetzt Stimmung und Licht in neue Kompositionen.',
  animator:           'Die KI-Bilder werden zu kurzen Clips animiert. Tempo und Bewegung folgen der Erzählstimmung der Etappe.',
  audio:              'Der Erzähltext wird als Voice-Over gesprochen — pro Stil eine eigene Spur, die vier Stile laufen parallel.',
  assembler:          'Clips, Voice-Over und Musik werden zum fertigen Reel zusammengeschnitten. Jeder Stil wird einzeln gerendert.',
  publisher:          'Slot 1 (die Kür) postet die Pipeline direkt nach dem Veto-Fenster. Slots 2–5 stehen in der Queue und werden von der Edge Function über den Tag verteilt gepostet.',
  carousel_publisher: 'Das Karussell aus Original- und KI-Bildern wird auf Instagram veröffentlicht.',
  blog_publisher:     'Der Etappentext wandert als Blogbeitrag auf die Website — mit Karte, Bildern und eingebettetem Reel.',
};

const PROGRESS_UNIT = {
  analyst:  (c, t) => `Foto ${c} von ${t}`,
  selektor: (c, t) => `Foto ${c} von ${t}`,
  imagegen: (c, t) => `Bild ${c} von ${t}`,
  animator: (c, t) => `Clip ${c} von ${t}`,
  audio:    (c, t) => `Spur ${c} von ${t}`,
};

// G5: reel_varianten wird heute immer als jsonb-String geschrieben (Hitl1Panel.freigeben
// bleibt dabei — das ist die kanonische Schreibform). Käme künftig eine echte Liste an,
// würde JSON.parse(array) im try/catch still zu [] werden — deshalb hier den Array-Fall
// zuerst behandeln, statt ihn stumm zu verschlucken.
function parseReelVarianten(v) {
  if (Array.isArray(v)) return v;
  if (!v) return [];
  try { return JSON.parse(v); } catch { return []; }
}

function parsePhotoProgress(detail) {
  if (!detail) return null;
  const m = detail.match(/(\d+)\s*\/\s*(\d+)/);
  if (!m) return null;
  const current = parseInt(m[1], 10);
  const total   = parseInt(m[2], 10);
  if (total === 0 || current > total + 1) return null;
  return { current, total };
}

// D8: ein Schritt, der so lange auf 'running' steht, läuft nicht mehr — er hängt.
const HAENGER_MS = 30 * 60 * 1000;

const STEP_STATUS = {
  running: { dot: T.accent,    label: 'läuft…',       bg: T.accentSoft, fg: T.accentInk },
  done:    { dot: T.ok,        label: 'fertig',        bg: T.okSoft,     fg: T.ok },
  error:   { dot: T.err,       label: 'Fehler',        bg: T.errSoft,    fg: T.err },
  skipped: { dot: T.mutedSoft, label: 'übersprungen',  bg: T.surfaceAlt, fg: T.muted },
  haenger: { dot: T.warn,      label: 'abgebrochen?',  bg: T.warnSoft,   fg: T.warn },
  offen:   { dot: T.border,    label: 'offen',         bg: T.surfaceAlt, fg: T.mutedSoft },
};

// D3/D4: pro (Schritt, Variante) gewinnt die zeitlich letzte Zeile — ein 'done'
// nach einem 'error' ist ein gelungener Retry und darf das error ablösen. Auf
// Schritt-Ebene wird über die Varianten aggregiert: der Schritt zeigt Fehler,
// solange irgendeine Variante zuletzt auf 'error' steht.
//
// Vorher nahm die Ansicht stumpf die letzte Zeile pro Schritt. Bei vier parallel
// gerenderten Stilen heißt das: der Fehler von Variante A verschwindet, sobald
// Variante B ihr 'running' hinterherschreibt.
//
// Läufe von vor der variante-Spalte (D1) haben überall NULL — die fallen auf
// genau eine Gruppe pro Schritt zusammen und sehen aus wie bisher. Rückwirkend
// lässt sich das nicht aufdröseln, die Kennung wurde damals nicht geschrieben.
function gruppiereSteps(steps, { jetzt = Date.now(), zeigeOffene = true } = {}) {
  const chronologisch = [...(steps || [])]
    .sort((a, b) => new Date(a.ts || 0) - new Date(b.ts || 0));

  const proSchritt = new Map();
  chronologisch.forEach(s => {
    if (!proSchritt.has(s.step)) proSchritt.set(s.step, new Map());
    proSchritt.get(s.step).set(s.variante || '', s);   // letzte Zeile gewinnt
  });

  // Namen, die die Pipeline schreibt, die Soll-Liste aber (noch) nicht kennt,
  // hinten anhängen statt sie zu verschlucken.
  const namen = STEP_ORDER.concat(
    [...proSchritt.keys()].filter(n => !STEP_ORDER.includes(n))
  );

  return namen.map(step => {
    const varMap = proSchritt.get(step);
    if (!varMap) {
      return { step, status: 'offen', begonnen: false, varianten: [],
               ts: null, detail: null, fertig: 0, fehler: 0, uebersprungen: 0, gesamt: 0 };
    }
    const varianten = [...varMap.values()].map(row => ({
      variante: row.variante || null,
      status: (row.status === 'running' && row.ts &&
               (jetzt - new Date(row.ts).getTime()) > HAENGER_MS) ? 'haenger' : row.status,
      row,
    }));
    const hat = st => varianten.some(v => v.status === st);
    const status = hat('error')   ? 'error'
                 : hat('haenger') ? 'haenger'
                 : hat('running') ? 'running'
                 : varianten.every(v => v.status === 'skipped') ? 'skipped'
                 : 'done';
    const neueste = varianten.reduce((a, b) =>
      new Date(b.row.ts || 0) > new Date(a.row.ts || 0) ? b : a);
    return {
      step, status, begonnen: true, varianten,
      ts: neueste.row.ts, detail: neueste.row.detail,
      fertig:        varianten.filter(v => v.status === 'done').length,
      fehler:        varianten.filter(v => v.status === 'error').length,
      haenger:       varianten.filter(v => v.status === 'haenger').length,
      uebersprungen: varianten.filter(v => v.status === 'skipped').length,
      gesamt:        varianten.length,
    };
  }).filter(g => zeigeOffene || g.begonnen);
}

// Eine Zeile pro Variante — nur wenn es mehr als eine gibt (D4).
function VariantenListe({ varianten }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 5, marginTop: 8 }}>
      {varianten.map((v, i) => {
        const st = STEP_STATUS[v.status] || STEP_STATUS.offen;
        const zeigeGrund = !!v.row.detail;
        return (
          <div key={v.variante || i} style={{ display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap' }}>
            <span style={{ width: 6, height: 6, borderRadius: '50%', background: st.dot, flexShrink: 0 }} />
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.ink }}>
              {v.variante || 'ohne Varianten-Kennung'}
            </span>
            <span style={{ padding: '1px 6px', background: st.bg, color: st.fg,
              fontFamily: T.mono, fontSize: 9, fontWeight: 600, borderRadius: 3 }}>
              {st.label}
            </span>
            {zeigeGrund && (
              <span style={{ flex: '1 1 100%', paddingLeft: 14, fontSize: 11, lineHeight: 1.45,
                color: v.status === 'error' ? T.err : v.status === 'haenger' ? T.warn : T.mutedSoft }}>
                {v.row.detail}
              </span>
            )}
          </div>
        );
      })}
    </div>
  );
}

function StepRow({ gruppe, isLast }) {
  const mobile = useMobile();
  const statusStyle = STEP_STATUS[gruppe.status]
    || { dot: T.muted, label: gruppe.status, bg: T.surfaceAlt, fg: T.muted };

  const ts       = gruppe.ts ? new Date(gruppe.ts).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
  const desc     = STEP_DESCRIPTIONS[gruppe.step];
  const mehrere  = gruppe.gesamt > 1;
  // Auch eine einzelne benannte Variante wird aufgeschlüsselt — sonst steht bei
  // „Assembler · läuft…" nicht, welcher Stil gerade gerendert wird.
  const zeigeVarianten = gruppe.varianten.some(v => v.variante);
  // Der Fortschrittsbalken ("Foto 12 / 26") gehört zu Schritten, die einmal pro Run
  // laufen — bei Varianten wäre die Zahl der letzten Zeile irreführend.
  const progress = zeigeVarianten ? null : parsePhotoProgress(gruppe.detail);
  const showDesc = desc && ['running', 'done', 'haenger'].includes(gruppe.status);
  const unitFn   = PROGRESS_UNIT[gruppe.step];
  const progressLabel = progress && unitFn ? unitFn(progress.current, progress.total) : progress ? `${progress.current} von ${progress.total}` : null;
  const zeigeDetail = !zeigeVarianten && gruppe.detail;
  const hatInhalt = showDesc || zeigeDetail || zeigeVarianten;

  return (
    <div style={{ display: 'flex', gap: 16, position: 'relative' }}>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flexShrink: 0, width: 20 }}>
        <div style={{
          width: 12, height: 12, borderRadius: '50%',
          background: gruppe.status === 'offen' ? 'transparent' : statusStyle.dot,
          border: gruppe.status === 'offen' ? `2px solid ${T.border}` : 'none',
          boxSizing: 'border-box', flexShrink: 0, marginTop: 4,
          boxShadow: gruppe.status === 'running' ? `0 0 0 4px ${T.accentSoft}` : 'none',
        }} />
        {!isLast && <div style={{ width: 2, flex: 1, background: T.border, marginTop: 4 }} />}
      </div>
      <div style={{ flex: 1, paddingBottom: isLast ? 0 : 22, opacity: gruppe.status === 'offen' ? 0.55 : 1 }}>
        {/* Name + Status + Uhrzeit. D4: Sammelstand über die Varianten — auf dem
            Handy als eigene Zeile, sonst zerbricht der Schrittname in drei Zeilen. */}
        {(() => {
          const bilanz = mehrere && (
            <span style={{ fontFamily: T.mono, fontSize: 10, color: T.muted }}>
              {gruppe.fertig}/{gruppe.gesamt} fertig
              {gruppe.fehler ? ` · ${gruppe.fehler} Fehler` : ''}
              {gruppe.haenger ? ` · ${gruppe.haenger} hängt` : ''}
              {gruppe.uebersprungen ? ` · ${gruppe.uebersprungen} übersprungen` : ''}
            </span>
          );
          return (
            <div style={{ marginBottom: hatInhalt ? 6 : 0 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <span style={{ fontSize: 13, fontWeight: 600, color: gruppe.status === 'offen' ? T.muted : T.ink }}>
                  {STEP_LABELS[gruppe.step] || gruppe.step}
                </span>
                <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '2px 8px',
                  background: statusStyle.bg, color: statusStyle.fg,
                  fontFamily: T.mono, fontSize: 10, fontWeight: 600, borderRadius: 4, whiteSpace: 'nowrap' }}>
                  {statusStyle.label}
                </span>
                {!mobile && bilanz}
                <span style={{ fontFamily: T.mono, fontSize: 10, color: T.mutedSoft, marginLeft: 'auto', whiteSpace: 'nowrap' }}>{ts}</span>
              </div>
              {mobile && bilanz && <div style={{ marginTop: 3 }}>{bilanz}</div>}
            </div>
          );
        })()}

        {showDesc && (
          <div style={{ fontSize: 12, color: T.mutedSoft, lineHeight: 1.55, marginBottom: zeigeDetail || zeigeVarianten ? 8 : 0 }}>
            {desc}
          </div>
        )}

        {zeigeVarianten && <VariantenListe varianten={gruppe.varianten} />}

        {/* Foto-/Bild-Fortschritt */}
        {zeigeDetail && progress ? (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 5 }}>
              <span style={{ fontFamily: T.mono, fontSize: 11.5, color: T.ink, fontWeight: 500 }}>
                {progressLabel}
              </span>
              <span style={{ fontFamily: T.mono, fontSize: 10, color: T.mutedSoft }}>
                {Math.round((progress.current / progress.total) * 100)}%
              </span>
            </div>
            <div style={{ height: 5, background: T.surfaceAlt, borderRadius: 3, overflow: 'hidden' }}>
              <div style={{ height: '100%', width: `${(progress.current / progress.total) * 100}%`,
                background: gruppe.status === 'done' ? T.ok : T.accent,
                borderRadius: 3, transition: 'width 0.4s ease' }} />
            </div>
            <div style={{ fontSize: 11, color: T.mutedSoft, fontFamily: T.mono, marginTop: 4 }}>{gruppe.detail}</div>
          </div>
        ) : zeigeDetail ? (
          <div style={{ fontSize: 12, fontFamily: T.mono,
            color: gruppe.status === 'error' ? T.err : gruppe.status === 'haenger' ? T.warn : T.muted }}>
            {gruppe.detail}
          </div>
        ) : null}
      </div>
    </div>
  );
}

function TabProgress({ steps, onRefresh, latestEtappe }) {
  const { useState: useS, useEffect: useE } = React;
  const [tick, setTick] = useS(0);
  const [detailOpen, setDetailOpen] = useS(false);

  // A run is only "live" if there's a 'running' step updated within the last 30 minutes
  const LIVE_MS = 30 * 60 * 1000;
  const now = Date.now();
  const isRunning = steps.some(s =>
    s.status === 'running' && s.ts && (now - new Date(s.ts).getTime()) < LIVE_MS
  );

  useE(() => {
    if (!isRunning) return;
    const iv = setInterval(() => setTick(t => t + 1), 1000);
    return () => clearInterval(iv);
  }, [isRunning]);

  // D2/D3/D4/D8 — eine Gruppe pro Soll-Schritt, Varianten darunter. `tick` läuft
  // im Sekundentakt und hält die Hänger-Erkennung (30 Min auf 'running') aktuell.
  const gruppen = gruppiereSteps(steps, { jetzt: now });

  if (!isRunning) return (
    <Panel style={{ textAlign: 'center', padding: 48 }}>
      <IActivity size={32} style={{ color: T.mutedSoft, marginBottom: 12 }} sw={1.5} />
      <div style={{ fontFamily: T.serif, fontSize: 20, color: T.muted, marginBottom: 8 }}>Kein aktiver Run</div>
      <div style={{ fontSize: 13, color: T.mutedSoft, marginBottom: latestEtappe ? 20 : 0 }}>
        Sobald die Pipeline startet, erscheinen hier die Schritte live.
      </div>
      {latestEtappe && (
        <button onClick={() => setDetailOpen(true)} style={{
          display: 'inline-flex', alignItems: 'center', gap: 7,
          padding: '8px 16px', background: T.accentSoft, border: `1px solid ${T.border}`,
          borderRadius: 8, cursor: 'pointer', fontFamily: T.sans, fontSize: 12,
          color: T.accentInk, fontWeight: 600
        }}>
          <IDash size={13} sw={2} /> Letzte Etappe · T{latestEtappe.n} {latestEtappe.name}
        </button>
      )}
      {detailOpen && latestEtappe && (
        <EtappeDetailModal etappe={latestEtappe} onClose={() => setDetailOpen(false)} />
      )}
    </Panel>
  );

  // D5: Fortschritt gegen die Soll-Liste, nicht gegen die Zahl der bisher
  // gesehenen Namen — sonst steht der Balken schon bei 100 %, während die Hälfte
  // der Pipeline noch aussteht. Übersprungene Schritte zählen als erledigt
  // (personal_hook-Läufe überspringen z. B. map/selektor).
  const doneCount = gruppen.filter(g => g.status === 'done' || g.status === 'skipped').length;
  const total = gruppen.length;
  const pct = total ? Math.round((doneCount / total) * 100) : 0;
  const fehlerhaft = gruppen.filter(g => g.status === 'error' || g.status === 'haenger');

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <Panel>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <IActivity size={15} style={{ color: T.accent }} sw={2} />
            <span style={{ fontSize: 13, fontWeight: 600, color: T.ink }}>Laufender Run</span>
            {isRunning && (
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 9px',
                background: T.accentSoft, color: T.accentInk,
                fontFamily: T.mono, fontSize: 10, fontWeight: 700, borderRadius: 4, letterSpacing: 0.4 }}>
                ● LIVE
              </span>
            )}
          </div>
          <button onClick={onRefresh} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '6px 12px',
            background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 7, cursor: 'pointer',
            fontFamily: T.sans, fontSize: 12, color: T.muted, fontWeight: 500 }}>
            <IRefresh size={12} sw={2} /> Aktualisieren
          </button>
        </div>

        <div style={{ marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
            <span style={{ fontSize: 12, color: T.muted, fontWeight: 500 }}>{doneCount} / {total} Schritte</span>
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 600 }}>{pct}%</span>
          </div>
          <div style={{ height: 8, background: T.surfaceAlt, borderRadius: 4, overflow: 'hidden' }}>
            <div style={{ height: '100%', width: `${pct}%`,
              background: `linear-gradient(90deg, ${T.accent}, ${T.accentDeep})`,
              borderRadius: 4, transition: 'width 0.4s ease' }} />
          </div>
          {/* Fehler stehen sonst weiter unten in der Liste und gehen im Scrollen unter. */}
          {fehlerhaft.length > 0 && (
            <div style={{ marginTop: 10, padding: '8px 12px', background: T.errSoft, borderRadius: 7,
              borderLeft: `3px solid ${T.err}`, fontSize: 12, color: T.err }}>
              {fehlerhaft.map(g => {
                const name = STEP_LABELS[g.step] || g.step;
                const teile = [
                  g.fehler  ? `${g.fehler} Fehler` : null,
                  g.haenger ? `${g.haenger} hängt` : null,
                ].filter(Boolean).join(', ');
                return g.gesamt > 1 ? `${name} (${teile} von ${g.gesamt})` : `${name} — ${teile}`;
              }).join(' · ')}
            </div>
          )}
        </div>

        <div>
          {gruppen.map((g, i) => (
            <StepRow key={g.step} gruppe={g} isLast={i === gruppen.length - 1} />
          ))}
        </div>
      </Panel>
    </div>
  );
}

// ─── Lightbox ────────────────────────────────────────────────────────────────
function Lightbox({ fotos, startIdx, onClose }) {
  const [idx, setIdx] = React.useState(startIdx);
  const touchX = React.useRef(null);

  const prev = () => setIdx(i => (i - 1 + fotos.length) % fotos.length);
  const next = () => setIdx(i => (i + 1) % fotos.length);

  React.useEffect(() => {
    const onKey = e => {
      if (e.key === 'ArrowLeft')  prev();
      if (e.key === 'ArrowRight') next();
      if (e.key === 'Escape')     onClose();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const onTouchStart = e => { touchX.current = e.touches[0].clientX; };
  const onTouchEnd   = e => {
    if (touchX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchX.current;
    if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
    touchX.current = null;
  };

  const foto = fotos[idx];

  return (
    <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      style={{ position: 'fixed', inset: 0, zIndex: 2000, background: '#000',
        display: 'flex', flexDirection: 'column' }}>

      {/* Bild — füllt den ganzen Screen */}
      <img src={foto.bildgen_url} alt={foto.foto_nr}
        style={{ flex: 1, width: '100%', objectFit: 'contain', display: 'block', minHeight: 0 }} />

      {/* X-Button oben rechts */}
      <button onClick={onClose}
        style={{ position: 'absolute', top: 14, right: 14,
          background: 'rgba(0,0,0,0.5)', border: 'none', borderRadius: 20,
          color: '#fff', fontSize: 16, lineHeight: 1,
          width: 36, height: 36, cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>

      {/* Prev/Next Desktop */}
      {fotos.length > 1 && <>
        <button onClick={prev}
          style={{ position: 'absolute', left: 10, top: '40%',
            background: 'rgba(0,0,0,0.4)', border: 'none', borderRadius: 8,
            color: '#fff', fontSize: 22, padding: '8px 13px', cursor: 'pointer' }}>‹</button>
        <button onClick={next}
          style={{ position: 'absolute', right: 10, top: '40%',
            background: 'rgba(0,0,0,0.4)', border: 'none', borderRadius: 8,
            color: '#fff', fontSize: 22, padding: '8px 13px', cursor: 'pointer' }}>›</button>
      </>}

    </div>
  );
}

// ─── Style Review Tab (inline) ─────────────────────────────────────────────────────────
// value = was in etappen.stil_bewertung gespeichert wird (aligned mit stile.bewertung)
// 0=Raus, 1=Mittel, 2=Gut, 4=Top
const STYLE_RATINGS = [
  { value: 0, emoji: '❌', label: 'Raus',   cls: 'on-raus',   stilUpdate: { aktiv: false, bewertung: null } },
  { value: 1, emoji: '🟡', label: 'Mittel', cls: 'on-mittel', stilUpdate: { aktiv: true,  bewertung: 1    } },
  { value: 2, emoji: '👍', label: 'Gut',    cls: 'on-gut',    stilUpdate: { aktiv: true,  bewertung: 2    } },
  { value: 4, emoji: '🔥', label: 'Top',    cls: 'on-top',    stilUpdate: { aktiv: true,  bewertung: 4    } },
];

function TabStyleReview({ data, selectedEtappe }) {
  const mobile = useMobile();
  const curE = selectedEtappe || data.etappenList.find(e => e.id === data.latestId);

  const [fotos, setFotos]       = React.useState([]);
  const [loading, setLoading]   = React.useState(false);
  const [rating, setRating]     = React.useState(null);
  const [saving, setSaving]     = React.useState(false);
  const [saveMsg, setSaveMsg]   = React.useState(null);
  const [lightbox, setLightbox] = React.useState(null);
  const [stilInfo, setStilInfo] = React.useState(null);

  React.useEffect(() => {
    if (!curE?.id) return;
    setLoading(true); setFotos([]); setRating(null); setSaveMsg(null); setStilInfo(null);
    const h = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/etappen?id=eq.${curE.id}&select=id,stil_bewertung&limit=1`, { headers: h }).then(r => r.json()).then(rows => rows[0] || null),
      fetch(`${SUPABASE_URL}/rest/v1/fotos?etappe_id=eq.${curE.id}&bildgen_url=not.is.null&select=foto_nr,bildgen_url,tagesstil&order=foto_nr.asc`, { headers: h }).then(r => r.json()),
    ]).then(([det, f]) => {
      setFotos(f);
      if (det?.stil_bewertung != null) setRating(det.stil_bewertung);
      const tagesstil = f.length > 0 ? f[0].tagesstil : null;
      if (tagesstil) {
        fetch(`${SUPABASE_URL}/rest/v1/stile?name=eq.${encodeURIComponent(tagesstil)}&select=name,bewertung,aktiv,mal_benutzt&limit=1`, { headers: h })
          .then(r => r.json()).then(rows => setStilInfo(rows[0] || null));
      }
    }).finally(() => setLoading(false));
  }, [curE?.id]);

  async function handleRate(r) {
    if (!curE || saving) return;
    // Optimistisch setzen, bei Fehler unten wieder zurückrollen — sonst zeigt der Button eine
    // Bewertung an, die nie in der DB gelandet ist (genau der Fall, der bis 27.07. still lief).
    const vorher = rating;
    setRating(r.value); setSaving(true); setSaveMsg(null);
    const h = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' };
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/etappen?id=eq.${curE.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ stil_bewertung: r.value, stil_notiz: null }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status} beim Speichern der Bewertung`);
      const tagesstil = fotos.length > 0 ? fotos[0].tagesstil : null;
      if (tagesstil) {
        const resStil = await fetch(`${SUPABASE_URL}/rest/v1/stile?name=eq.${encodeURIComponent(tagesstil)}`, {
          method: 'PATCH', headers: h, body: JSON.stringify(r.stilUpdate),
        });
        if (!resStil.ok) throw new Error(`HTTP ${resStil.status} beim Speichern des Stils`);
        setStilInfo(prev => prev ? { ...prev, ...r.stilUpdate } : prev);
      }
      setSaveMsg({ text: `✓ ${r.emoji} ${r.label}`, type: 'ok' });
      setTimeout(() => setSaveMsg(null), 3000);
    } catch (err) {
      setRating(vorher);
      setSaveMsg({ text: `Fehler: ${err.message}`, type: 'error' });
    } finally { setSaving(false); }
  }

  if (!curE) return null;
  const stilName = fotos.length > 0 ? (fotos[0].tagesstil || '–') : '–';

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>

      {/* Stil-Header */}
      <Panel>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ width: 4, height: 44, background: T.accent, borderRadius: 2, flexShrink: 0 }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: T.mono, fontSize: 10, color: T.muted, fontWeight: 500,
              textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 2 }}>Stil</div>
            <div style={{ fontFamily: T.serif, fontSize: mobile ? 24 : 32, color: T.ink, lineHeight: 1 }}>
              {loading ? '…' : stilName}
            </div>
          </div>
          {/* Bewertet-Badge */}
          {!loading && (() => {
            if (stilInfo?.aktiv === false) return (
              <div style={{ fontFamily: T.mono, fontSize: 11, fontWeight: 600,
                background: '#fee2e2', color: '#dc2626', borderRadius: 20,
                padding: '4px 12px', whiteSpace: 'nowrap' }}>❌ Deaktiviert</div>
            );
            if (stilInfo?.bewertung != null) return (
              <div style={{ fontFamily: T.mono, fontSize: 11, fontWeight: 600,
                background: '#dcfce7', color: '#16a34a', borderRadius: 20,
                padding: '4px 12px', whiteSpace: 'nowrap' }}>✓ Bewertet</div>
            );
            return (
              <div style={{ fontFamily: T.mono, fontSize: 11, fontWeight: 600,
                background: '#fff7ed', color: '#ea580c', borderRadius: 20,
                padding: '4px 12px', whiteSpace: 'nowrap' }}>Nicht bewertet</div>
            );
          })()}
        </div>
        <div style={{ marginLeft: 18, marginTop: 10, fontFamily: T.mono, fontSize: 11, color: T.mutedSoft }}>
          {stilInfo != null ? `${stilInfo.mal_benutzt ?? 0}× benutzt` : (loading ? '' : '–')}
        </div>
      </Panel>

      {/* Bildergalerie (Swipeable Carousel) */}
      {fotos.length > 0 ? (
        <div className="no-scrollbar" style={{
          display: 'flex',
          gap: 12,
          overflowX: 'auto',
          scrollSnapType: 'x mandatory',
          paddingBottom: 8,
        }}>
          {fotos.map((foto, i) => (
            <div key={foto.foto_nr} onClick={() => setLightbox(i)}
              style={{
                scrollSnapAlign: 'center',
                flexShrink: 0,
                width: mobile ? '85vw' : '280px',
                maxWidth: '400px',
                cursor: 'pointer',
              }}>
              <ImageCardInline foto={foto} />
            </div>
          ))}
        </div>
      ) : !loading ? (
        <Panel style={{ textAlign: 'center', padding: 48 }}>
          <IImage size={32} style={{ color: T.mutedSoft, marginBottom: 12 }} sw={1.5} />
          <div style={{ fontFamily: T.serif, fontSize: 18, color: T.muted, marginBottom: 6 }}>Keine generierten Bilder</div>
          <div style={{ fontSize: 13, color: T.mutedSoft }}>für diese Etappe verfügbar</div>
        </Panel>
      ) : null}

      {/* Bewertung */}
      <Panel>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <PanelHeader icon={ISparkles} label="Bewertung" serif="Wie war der Stil?" />
          {saveMsg && (
            <div style={{ padding: '6px 12px', borderRadius: 8, fontFamily: T.sans, fontSize: 12, fontWeight: 500,
              background: saveMsg.type === 'ok' ? T.okSoft : T.errSoft,
              color: saveMsg.type === 'ok' ? T.ok : T.err }}>
              {saveMsg.text}
            </div>
          )}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, maxWidth: 360, opacity: saving ? 0.6 : 1, transition: 'opacity 0.15s' }}>
          {STYLE_RATINGS.map(r => (
            <button key={r.value} onClick={() => handleRate(r)}
              className={`sk-rate-btn${rating === r.value ? ' ' + r.cls : ''}`}
              style={{ padding: '12px 8px' }}>
              <span style={{ fontSize: '1.6rem', lineHeight: 1 }}>{r.emoji}</span>
              <span style={{ fontFamily: T.sans, fontSize: '0.7rem', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', color: T.muted }}>{r.label}</span>
            </button>
          ))}
        </div>
      </Panel>

      {lightbox !== null && (
        <Lightbox fotos={fotos} startIdx={lightbox}
          onClose={() => setLightbox(null)} />
      )}
    </div>
  );
}

// ─── Stil-Katalog ─────────────────────────────────────────────────────────────
const SK_RATINGS = {
  top:    { emoji: '🔥', label: 'Top',    db: { bewertung: 4, aktiv: true },    weight: '4×', cls: 'on-top' },
  gut:    { emoji: '👍', label: 'Gut',    db: { bewertung: 2, aktiv: true },    weight: '2×', cls: 'on-gut' },
  mittel: { emoji: '🟡', label: 'Mittel', db: { bewertung: 1, aktiv: true },    weight: '1×', cls: 'on-mittel' },
  raus:   { emoji: '❌', label: 'Raus',   db: { bewertung: null, aktiv: false }, weight: '0×', cls: 'on-raus' },
};
const SK_ORDER = ['top', 'gut', 'mittel', 'raus'];
const SK_RANK  = { top: 0, gut: 1, mittel: 2, unbewertet: 3, raus: 4 };
let _skCache = null;

function skStateOf(s) {
  if (s.aktiv === false) return 'raus';
  if (s.bewertung === 4) return 'top';
  if (s.bewertung === 2) return 'gut';
  if (s.bewertung === 1) return 'mittel';
  return 'unbewertet';
}
function skPickSpread(arr, n) {
  if (arr.length <= n) return arr.map((u, i) => ({ u, i }));
  const out = [];
  for (let k = 0; k < n; k++) {
    const i = Math.round(k * (arr.length - 1) / (n - 1));
    if (!out.some(o => o.i === i)) out.push({ u: arr[i], i });
  }
  return out;
}
function TabStilKatalog() {
  const mobile = useMobile();
  const [stile, setStile]           = React.useState(_skCache ? _skCache.stile : []);
  const [images, setImages]         = React.useState(_skCache ? _skCache.images : {});
  const [loading, setLoading]       = React.useState(!_skCache);
  const [error, setError]           = React.useState(null);
  const [activeStatus, setActiveStatus] = React.useState('alle');
  const [activeCat, setActiveCat]   = React.useState('alle');
  const [sort, setSort]             = React.useState('rating');
  const [toast, setToast]           = React.useState(null);
  const [lb, setLb]                 = React.useState(null);   // { list, idx }
  const [gallery, setGallery]       = React.useState(null);   // { styleId }
  const [expandedDescs, setExpandedDescs] = React.useState({});
  const [filtersOpen, setFiltersOpen] = React.useState(false);
  const toastTimer = React.useRef(null);

  React.useEffect(() => {
    if (_skCache) return;
    const h = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/stile?select=*&order=name`, { headers: h }).then(r => r.json()),
      fetchAll('fotos?select=tagesstil,bildgen_url,foto_nr&bildgen_url=not.is.null&order=foto_nr'),
    ]).then(([stileRows, urlRows]) => {
      const imgs = {};
      const add = (style, src) => {
        if (!style || !src) return;
        const list = (imgs[style] = imgs[style] || []);
        if (list.length < 150 && !list.includes(src)) list.push(src);
      };
      stileRows.forEach(s => { if (Array.isArray(s.review_bilder)) s.review_bilder.forEach(u => add(s.name, u)); });
      urlRows.forEach(r => add(r.tagesstil, r.bildgen_url));
      _skCache = { stile: stileRows, images: imgs };
      setStile(stileRows);
      setImages(imgs);
      setLoading(false);
    }).catch(e => { setError(e.message); setLoading(false); });
  }, []);

  const showToast = React.useCallback((msg, bg) => {
    setToast({ msg, bg: bg || '#fff' });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }, []);

  const skPatch = React.useCallback(async (id, body) => {
    const h = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
    const res = await fetch(`${SUPABASE_URL}/rest/v1/stile?id=eq.${id}`, { method: 'PATCH', headers: h, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  }, []);

  const skRate = React.useCallback(async (id, key) => {
    const s = stile.find(x => x.id === id);
    if (!s) return;
    const body = key === 'reset' ? { bewertung: null, aktiv: true } : SK_RATINGS[key].db;
    try {
      await skPatch(id, body);
      const updated = stile.map(x => x.id === id ? { ...x, ...body } : x);
      setStile(updated);
      _skCache = null;
      showToast(`✓ ${s.name} → ${key === 'reset' ? 'Reset' : SK_RATINGS[key].label}`, T.okSoft);
    } catch (e) { showToast(`❌ Fehler: ${e.message}`, T.errSoft); }
  }, [stile, skPatch, showToast]);

  const skToggleFav = React.useCallback(async (id) => {
    const s = stile.find(x => x.id === id);
    if (!s) return;
    const next = !s.favorit;
    try {
      await skPatch(id, { favorit: next });
      const updated = stile.map(x => x.id === id ? { ...x, favorit: next } : x);
      setStile(updated);
      _skCache = null;
      showToast(`${next ? '★' : '☆'} ${s.name} → Favorit ${next ? 'an' : 'aus'}`, '#fdeef5');
    } catch (e) { showToast(`❌ Fehler: ${e.message}`, T.errSoft); }
  }, [stile, skPatch, showToast]);

  React.useEffect(() => {
    const handler = e => {
      if (lb) {
        if (e.key === 'ArrowLeft')  setLb(p => ({ ...p, idx: (p.idx - 1 + p.list.length) % p.list.length }));
        if (e.key === 'ArrowRight') setLb(p => ({ ...p, idx: (p.idx + 1) % p.list.length }));
        if (e.key === 'Escape')     setLb(null);
      } else if (gallery) {
        if (e.key === 'Escape') setGallery(null);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [lb, gallery]);

  const counts = React.useMemo(() => {
    const inCat = activeCat === 'alle' ? stile : stile.filter(s => (s.kategorie || '—') === activeCat);
    const c = { alle: inCat.length, unbewertet: 0, top: 0, gut: 0, mittel: 0, raus: 0, fav: 0 };
    inCat.forEach(s => { c[skStateOf(s)]++; if (s.favorit) c.fav++; });
    return c;
  }, [stile, activeCat]);

  const catCounts = React.useMemo(() => {
    const c = {};
    stile.forEach(s => { const k = s.kategorie || '—'; c[k] = (c[k] || 0) + 1; });
    return c;
  }, [stile]);

  const visible = React.useMemo(() => {
    const filtered = stile.filter(s => {
      if (activeCat !== 'alle' && (s.kategorie || '—') !== activeCat) return false;
      if (activeStatus === 'alle')  return true;
      if (activeStatus === 'fav')   return !!s.favorit;
      return skStateOf(s) === activeStatus;
    });
    const arr = [...filtered];
    if (sort === 'name')   arr.sort((a, b) => a.name.localeCompare(b.name));
    else if (sort === 'used')   arr.sort((a, b) => (b.mal_benutzt || 0) - (a.mal_benutzt || 0));
    else if (sort === 'recent') arr.sort((a, b) => (b.zuletzt_benutzt || '').localeCompare(a.zuletzt_benutzt || ''));
    else arr.sort((a, b) => SK_RANK[skStateOf(a)] - SK_RANK[skStateOf(b)] || a.name.localeCompare(b.name));
    return arr;
  }, [stile, activeStatus, activeCat, sort]);

  const STATUS_DEFS = [
    ['alle','Alle'],['unbewertet','⚪ Unbewertet'],['top','🔥 Top'],
    ['gut','👍 Gut'],['mittel','🟡 Mittel'],['raus','❌ Raus'],['fav','⭐ Favoriten'],
  ];
  const cats = Object.keys(catCounts).sort();
  const galleryStyle = gallery ? stile.find(s => s.id === gallery.styleId) : null;
  const galleryImgs  = galleryStyle ? (images[galleryStyle.name] || []) : [];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
      {/* Filter bar */}
      <div style={{ padding: mobile ? '8px 12px' : '10px 28px', borderBottom: `1px solid ${T.border}`, background: T.surface, flexShrink: 0 }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <select value={sort} onChange={e => setSort(e.target.value)}
              style={{ fontFamily: T.sans, fontSize: 12, padding: '4px 8px', border: `1px solid ${T.border}`, borderRadius: 7, background: T.surface, color: T.ink, cursor: 'pointer' }}>
              <option value="rating">Bewertung</option>
              <option value="name">Name A–Z</option>
              <option value="used">Meist genutzt</option>
              <option value="recent">Zuletzt genutzt</option>
            </select>
            {mobile && (
              <button onClick={() => setFiltersOpen(p => !p)}
                style={{ fontFamily: T.sans, fontSize: 12, fontWeight: 600, padding: '5px 10px', borderRadius: 7, border: `1px solid ${T.border}`, background: filtersOpen ? T.accentSoft : T.surface, color: filtersOpen ? T.accentInk : T.muted, cursor: 'pointer' }}>
                Filter {filtersOpen ? '▲' : '▼'}
                {(activeStatus !== 'alle' || activeCat !== 'alle') && !filtersOpen ? ' •' : ''}
              </button>
            )}
          </div>
          {(!mobile || filtersOpen) && (
            <>
              <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                {STATUS_DEFS.map(([k, lbl]) => (
                  <div key={k} className={`sk-chip${activeStatus === k ? ' active' : ''}`} onClick={() => setActiveStatus(k)}>
                    {lbl}<span style={{ opacity: activeStatus === k ? 0.85 : 0.6, marginLeft: 3, fontVariantNumeric: 'tabular-nums' }}>{counts[k] ?? 0}</span>
                  </div>
                ))}
              </div>
              <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
                <div className={`sk-chip${activeCat === 'alle' ? ' active' : ''}`} onClick={() => setActiveCat('alle')}>Alle Kategorien</div>
                {cats.map(k => (
                  <div key={k} className={`sk-chip${activeCat === k ? ' active' : ''}`} onClick={() => setActiveCat(k)}>
                    {k}<span style={{ opacity: activeCat === k ? 0.85 : 0.6, marginLeft: 3, fontVariantNumeric: 'tabular-nums' }}>{catCounts[k]}</span>
                  </div>
                ))}
              </div>
            </>
          )}
          <span style={{ fontFamily: T.sans, fontSize: 11, color: T.muted, paddingTop: 2 }}>
            {loading ? 'Lade …' : `${stile.length} Stile · ${counts.top + counts.gut + counts.mittel} bewertet · ${counts.unbewertet} offen · ${counts.raus} raus`}
          </span>
        </div>
      </div>

      {/* List */}
      <div style={{ flex: 1, overflow: 'auto', padding: mobile ? '8px 12px 80px' : '8px 28px 80px' }}>
        {loading && <div style={{ padding: 60, textAlign: 'center', color: T.muted, fontFamily: T.sans }}>Lade Styles aus Supabase …</div>}
        {error   && <div style={{ padding: 60, textAlign: 'center', color: T.err,  fontFamily: T.sans }}>❌ {error}</div>}
        {!loading && !error && !visible.length && <div style={{ padding: 60, textAlign: 'center', color: T.muted, fontFamily: T.sans }}>Keine Styles in diesem Filter.</div>}
        {visible.map(s => {
          const st = skStateOf(s);
          const imgs = images[s.name] || [];
          const preview = skPickSpread(imgs, 9);
          const used = s.mal_benutzt
            ? `${s.mal_benutzt}× genutzt${s.zuletzt_benutzt ? ' · ' + s.zuletzt_benutzt : ''}`
            : 'nie genutzt';
          return (
            <div key={s.id} className="sk-row" style={mobile ? { flexDirection: 'column', gap: 12, padding: 12 } : undefined}>
              {/* Info */}
              <div style={{ width: mobile ? '100%' : 250, flexShrink: 0 }}>
                <div className="sk-name" onClick={() => setGallery({ styleId: s.id })} title="Alle Bilder ansehen">{s.name}</div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginBottom: 9 }}>
                  {s.kategorie && <span style={{ fontFamily: T.mono, fontSize: '0.68rem', padding: '2px 7px', borderRadius: 5, background: T.accentSoft, color: T.accentInk, fontWeight: 600 }}>{s.kategorie}</span>}

                      <span style={{ fontFamily: T.mono, fontSize: '0.6rem', color: T.mutedSoft }}>{r.weight}</span>
                    </button>
                  );

                <div style={{ display: 'flex', gap: 6, marginTop: 2, gridColumn: '1 / -1' }}>
                  <button className={`sk-mini-btn sk-fav-btn${s.favorit ? ' on' : ''}`} onClick={() => skToggleFav(s.id)}>

      {/* Toast */}

        <div style={{ position: 'fixed', bottom: 22, left: '50%', transform: 'translateX(-50%)',
          padding: '10px 18px', borderRadius: 9, fontFamily: T.sans, fontSize: '0.85rem', zIndex: 1000,
          boxShadow: '0 6px 22px rgba(124,58,237,0.16)', background: toast.bg, color: T.ink, pointerEvents: 'none' }}>
          {toast.msg}
        </div>

      {/* Gallery lightbox */}
      {gallery && galleryStyle && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(10,8,18,0.95)', zIndex: 3000, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}
          onClick={e => { if (e.target === e.currentTarget) setGallery(null); }}>
          <div style={{ flexShrink: 0, display: 'flex', alignItems: 'center', gap: 16, padding: '16px 28px 12px', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
            <span style={{ fontFamily: T.serif, fontSize: '1.6rem', color: '#fff', fontWeight: 400 }}>{galleryStyle.name}</span>
            <span style={{ fontFamily: T.mono, fontSize: '0.78rem', color: 'rgba(255,255,255,0.4)' }}>{galleryImgs.length ? `${galleryImgs.length} Bilder` : ''}</span>
            <button onClick={() => setGallery(null)}
              style={{ marginLeft: 'auto', background: 'rgba(255,255,255,0.1)', border: 'none', color: '#fff', fontSize: '1.4rem', width: 38, height: 38, borderRadius: 9, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
          </div>
          <div style={{ flex: 1, overflowY: 'auto', padding: '20px 28px 40px' }}>
            {galleryImgs.length === 0
              ? <div style={{ color: 'rgba(255,255,255,0.3)', fontStyle: 'italic', fontFamily: T.sans, padding: '60px 0' }}>Noch keine Bilder vorhanden.</div>
              : <div className="sk-gallery-grid" style={{ display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'flex-start' }}>
                  {galleryImgs.map((u, i) => (
                    <img key={i} loading="lazy" src={u} onError={e => e.target.style.display = 'none'}
                      title={`${galleryStyle.name} #${i + 1}`}
                      onClick={() => setLb({ list: galleryImgs, idx: i })} />
                  ))}
                </div>
            }
          </div>
        </div>
      )}

      {/* Single-image lightbox */}
      {lb && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.86)', zIndex: 4000, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'zoom-out' }}
          onClick={() => setLb(null)}>
          {lb.list.length > 1 && (

          )}
          <img src={lb.list[lb.idx]} style={{ maxWidth: '86vw', maxHeight: '92vh', borderRadius: 8, cursor: 'default' }} onClick={e => e.stopPropagation()} />
          {lb.list.length > 1 && (
            <button onClick={e => { e.stopPropagation(); setLb(p => ({ ...p, idx: (p.idx + 1) % p.list.length })); }}
              style={{ position: 'fixed', top: '50%', right: '3vw', transform: 'translateY(-50%)', zIndex: 4001, width: 54, height: 84, border: 'none', borderRadius: 10, background: 'rgba(255,255,255,0.12)', color: '#fff', fontSize: '2.2rem', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>›</button>
          )}
          {lb.list.length > 1 && (
            <div style={{ position: 'fixed', bottom: '4vh', left: '50%', transform: 'translateX(-50%)', zIndex: 4001, color: '#fff', fontSize: '0.9rem', background: 'rgba(0,0,0,0.45)', padding: '5px 14px', borderRadius: 20, fontVariantNumeric: 'tabular-nums' }}>
              {lb.idx + 1} / {lb.list.length}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function fmtDatumDE(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function MonologListeItem({ e, aktiv, hideKuerzel, onPick }) {
  const route = e.route || {};
  const kuerzel = route.kuerzel || '—';
  const routeName = route.name || '';
  const heading = e.tagesueberschrift || `Etappe ${e.tag_nr || e.etappen_nr || '?'}`;
  const tagLabel = e.tag_nr ? `Tag ${e.tag_nr}` : (e.etappen_nr ? `Etappe ${e.etappen_nr}` : '');

  return (
    <button onClick={() => onPick(e)} type="button"
      style={{
        textAlign: 'left', width: '100%', cursor: 'pointer', display: 'block',
        background: aktiv ? T.accentSoft : T.surface,
        border: `1px solid ${aktiv ? T.accent : T.border}`,
        borderRadius: 8, padding: '10px 12px', marginBottom: 8,
        fontFamily: T.sans, color: T.ink,
      }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4, flexWrap: 'wrap' }}>
        {!hideKuerzel && (
          <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 600, color: T.accentInk, background: T.accentSoft, padding: '2px 6px', borderRadius: 4, letterSpacing: 0.3 }}>{kuerzel}</span>
        )}
        {tagLabel && <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{tagLabel}</span>}
        {tagLabel && <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>·</span>}
        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{fmtDatumDE(e.datum)}</span>
        {aktiv && <span style={{ marginLeft: 'auto', fontSize: 10, fontWeight: 600, color: T.accent, fontFamily: T.mono }}>im Editor</span>}
      </div>
      <div style={{ fontFamily: T.serif, fontSize: 15, color: T.ink, lineHeight: 1.2, marginBottom: routeName ? 3 : 0 }}>
        {heading}
      </div>
      {routeName && !hideKuerzel && (
        <div style={{ fontFamily: T.sans, fontSize: 11, color: T.mutedSoft }}>
          {routeName}
        </div>
      )}
    </button>
  );
}

function MonologPanel() {
  const mobile = useMobile();
  const [datum, setDatum] = React.useState(() => new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Vienna' }).format(new Date()));
  const [text, setText] = React.useState('');
  const [status, setStatus] = React.useState(null);
  const [laden, setLaden] = React.useState(false);
  const [saving, setSaving] = React.useState(false);
  const [liste, setListe] = React.useState([]);
  const [listeLaden, setListeLaden] = React.useState(true);
  const [listeError, setListeError] = React.useState(null);
  const [activeRoute, setActiveRoute] = React.useState(null); // null = alle

  // Beim Datum-Wechsel den gespeicherten Monolog laden → korrigieren statt überschreiben.
  React.useEffect(() => {
    let abbruch = false;
    setLaden(true); setStatus(null);
    fetchMonolog(datum).then(t => { if (!abbruch) { setText(t); setLaden(false); } });
    return () => { abbruch = true; };
  }, [datum]);

  // Liste der bereits aufgezeichneten Monologe einmal laden.
  React.useEffect(() => {
    let abbruch = false;
    setListeLaden(true);
    fetchMonologListe()
      .then(rows => { if (!abbruch) { setListe(rows); setListeLaden(false); } })
      .catch(err => { if (!abbruch) { setListeError(err.message); setListeLaden(false); } });
    return () => { abbruch = true; };
  }, []);

  // Reines Speichern — kein KI-Schritt, sichert was gerade im Feld steht.
  async function speichern() {
    if (!text.trim()) return;
    setSaving(true); setStatus('…');
    try {
      const res = await sendMonolog(datum, text, true);
      setStatus(res.ok ? '✓ Gespeichert' : 'Fehler: ' + (res.error || 'unbekannt'));
      if (res.ok) {
        // Liste lokal aktualisieren, damit der neue Eintrag sofort erscheint.
        setListe(prev => {
          const idx = prev.findIndex(p => p.datum === datum);
          const eintrag = {
            id: prev[idx]?.id || `local-${datum}`,
            datum, etappen_nr: null, tag_nr: null,
            tagesueberschrift: prev[idx]?.tagesueberschrift || null,
            tages_monolog: text.trim(),
            route: prev[idx]?.route || null,
          };
          return idx >= 0
            ? [eintrag, ...prev.filter((_, i) => i !== idx)]
            : [eintrag, ...prev];
        });
      }
    } catch (err) {
      setStatus('Fehler: ' + err.message);
    } finally { setSaving(false); }
  }

  // Säubern + Speichern in einem Schritt — der geputzte Text geht direkt in die DB.
  async function saeubern() {
    if (!text.trim()) return;
    setSaving(true); setStatus('… säubere & speichere');
    try {
      const res = await sendMonolog(datum, text, false);
      if (!res.gesaeubert) { setStatus('Fehler: ' + (res.error || 'unbekannt')); return; }
      const save = await sendMonolog(datum, res.gesaeubert, true);
      if (save.ok) {
        setText(res.gesaeubert);
        setStatus('✓ Gespeichert');
        setListe(prev => {
          const idx = prev.findIndex(p => p.datum === datum);
          const eintrag = {
            id: prev[idx]?.id || `local-${datum}`,
            datum, etappen_nr: null, tag_nr: null,
            tagesueberschrift: prev[idx]?.tagesueberschrift || null,
            tages_monolog: res.gesaeubert.trim(),
            route: prev[idx]?.route || null,
          };
          return idx >= 0
            ? [eintrag, ...prev.filter((_, i) => i !== idx)]
            : [eintrag, ...prev];
        });
      } else {
        setStatus('Fehler beim Speichern: ' + (save.error || 'unbekannt'));
      }
    } catch (err) {
      setStatus('Fehler: ' + err.message);
    } finally { setSaving(false); }
  }

  function pick(e) {
    setDatum(e.datum);
    setStatus(null);
    if (mobile && typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Monolog direkt freigeben — schreibt den Text nach monolog_final (die Tonquelle, die der
  // Narrator bevorzugt liest) UND setzt hitl1_entschieden_um, damit der Lauf HITL #1 überspringt.
  // Die etappe_id kommt direkt aus der Speichern-Antwort der Edge-Function (kein separater,
  // fehleranfälliger Lookup, der den früheren Bug "monolog_final blieb leer" verursacht hat).
  async function freigeben() {
    if (!text.trim()) return;
    setSaving(true); setStatus('… freigeben');
    try {
      // 1. Sauber speichern — Edge-Function legt die Etappe an / aktualisiert tages_monolog
      //    und liefert die etappe_id zurück.
      const save = await sendMonolog(datum, text, true);
      if (!save.ok || !save.etappe_id) { setStatus('Fehler beim Speichern: ' + (save.error || 'unbekannt')); return; }
      // 2. Als final + freigegeben markieren. return=representation + Status-Check, damit ein
      //    fehlgeschlagener PATCH nicht mehr still verschluckt wird.
      const h = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', Prefer: 'return=representation' };
      const patch = await fetch(`${SUPABASE_URL}/rest/v1/etappen?id=eq.${save.etappe_id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({
          monolog_final: text.trim(),
          hitl1_entschieden_um: new Date().toISOString(),
        }),
      });
      if (!patch.ok) { setStatus('Fehler beim Freigeben: HTTP ' + patch.status); return; }
      setStatus('✓ Freigegeben — Narrator nimmt den Text, HITL #1 entfällt');
    } catch (err) {
      setStatus('Fehler beim Freigeben: ' + err.message);
    } finally { setSaving(false); }
  }

  // Wege aus den geladenen Monologen ableiten — nur die mit Inhalt tauchen als Chip auf.
  const routen = React.useMemo(() => {
    const m = new Map();
    liste.forEach(e => {
      const k = e.route?.kuerzel;
      if (k) m.set(k, e.route);
    });
    return Array.from(m.values()).sort((a, b) => (a.kuerzel || '').localeCompare(b.kuerzel || ''));
  }, [liste]);

  const gefiltert = activeRoute
    ? liste.filter(e => e.route?.kuerzel === activeRoute)
    : liste;

  const aktiv = text.trim() && !saving && !laden;

  return (
    <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : 'minmax(0, 1fr) 320px', gap: 0, alignItems: 'start', background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, overflow: 'hidden', width: 'fit-content', maxWidth: '100%' }}>
      <div style={{ maxWidth: mobile ? '100%' : 640, padding: 24, borderRight: mobile ? 'none' : `1px solid ${T.border}`, borderBottom: mobile ? `1px solid ${T.border}` : 'none' }}>
        <h2 style={{ fontFamily: T.serif, fontSize: 22, fontWeight: 400, margin: '0 0 16px', color: T.ink }}>Tages-Monolog</h2>
        <div style={{ marginBottom: 12 }}>
          <label style={{ display: 'block', fontSize: 13, color: T.muted, marginBottom: 4 }}>Datum</label>
          <input type="date" value={datum} onChange={e => setDatum(e.target.value)}
            style={{ fontFamily: T.sans, fontSize: 14, padding: '8px 12px', border: `1px solid ${T.border}`, borderRadius: 8, background: T.bg, color: T.ink, width: '100%' }} />
        </div>
        <div style={{ marginBottom: 16 }}>
          <label style={{ display: 'block', fontSize: 13, color: T.muted, marginBottom: 4 }}>Monolog{laden ? ' — lade…' : ''}</label>
          <textarea rows={10} value={text} placeholder="Diktier deinen Monolog…" disabled={laden}
            onChange={e => setText(e.target.value)}
            style={{ width: '100%', fontFamily: T.sans, fontSize: 14, padding: '10px 12px', border: `1px solid ${T.border}`, borderRadius: 8, background: T.bg, color: T.ink, resize: 'vertical', opacity: laden ? 0.5 : 1 }} />
        </div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
          <button onClick={saeubern} disabled={!aktiv}
            style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 8, border: 'none', cursor: aktiv ? 'pointer' : 'not-allowed', background: aktiv ? T.accent : T.surfaceAlt, color: aktiv ? '#fff' : T.mutedSoft }}>
            {saving ? '…' : '✨ Säubern & Speichern'}
          </button>
          <button onClick={speichern} disabled={!aktiv}
            style={{ fontFamily: T.sans, fontSize: 12, fontWeight: 500, padding: '8px 14px', borderRadius: 8, border: `1px solid ${T.border}`, cursor: aktiv ? 'pointer' : 'not-allowed', background: 'transparent', color: T.muted }}>
            nur Speichern
          </button>
          <button onClick={freigeben} disabled={!aktiv} title="Speichert den Monolog und markiert die Etappe als freigegeben — der Narrator nimmt den Text dann direkt, HITL #1 entfällt."
            style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 8, border: 'none', cursor: aktiv ? 'pointer' : 'not-allowed', background: aktiv ? T.ok : T.surfaceAlt, color: aktiv ? '#fff' : T.mutedSoft }}>
            {saving ? '…' : '✓ Freigeben'}
          </button>
        </div>
        <p style={{ marginTop: 10, fontSize: 12, color: T.muted, fontFamily: T.sans }}>
          Diktieren → <b>Säubern & Speichern</b>. Roh reinschreiben, die KI glättet und legt ab.
          <br/><b>Freigeben</b> sichert den Text und markiert die Etappe als entschieden — der nächste Run nimmt ihn direkt, ohne nochmal in HITL #1 zu landen.
        </p>
        {status && (
          <p style={{ marginTop: 12, fontSize: 13, color: status.startsWith('✓') ? T.ok : T.err, fontFamily: T.mono }}>
            {status}
          </p>
        )}
      </div>

      <aside style={{ background: T.surfaceAlt, padding: 18 }}>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, marginBottom: 14 }}>
          <span className={`sk-chip ${activeRoute === null ? 'active' : ''}`} onClick={() => setActiveRoute(null)}>Alle</span>
          {routen.map(r => (
            <span key={r.kuerzel} className={`sk-chip ${activeRoute === r.kuerzel ? 'active' : ''}`} onClick={() => setActiveRoute(r.kuerzel)}>{r.kuerzel}</span>
          ))}
        </div>
        {listeLaden && <div style={{ fontSize: 13, color: T.muted, fontFamily: T.sans }}>Lade…</div>}
        {listeError && <div style={{ fontSize: 12, color: T.err, fontFamily: T.sans }}>{listeError}</div>}
        {!listeLaden && !listeError && liste.length === 0 && (
          <div style={{ fontSize: 13, color: T.muted, fontFamily: T.sans, lineHeight: 1.4 }}>
            Noch keine Monologe aufgezeichnet. Diktier oben deinen ersten — er erscheint dann hier.
          </div>
        )}
        {!listeLaden && !listeError && liste.length > 0 && gefiltert.length === 0 && (
          <div style={{ fontSize: 13, color: T.muted, fontFamily: T.sans, lineHeight: 1.4 }}>
            Keine Monologe auf {activeRoute}.
          </div>
        )}
        <div style={{ maxHeight: mobile ? 'none' : 'calc(100dvh - 180px)', overflowY: 'auto', marginRight: mobile ? 0 : -6, paddingRight: mobile ? 0 : 6 }}>
          {gefiltert.map(e => (
            <MonologListeItem key={e.id || e.datum} e={e} aktiv={e.datum === datum} hideKuerzel={activeRoute !== null} onPick={pick} />
          ))}
        </div>
      </aside>
    </div>
  );
}

// ─── HITL #1 ─────────────────────────────────────────────────────────────────
async function fetchEtappenFuerHitl1() {
  const cols = 'id,datum,etappen_nr,tag_nr,pipeline_status,startort,zielort,reel_varianten,hitl_prio_stil,hitl1_benachrichtigt_um,hitl1_entschieden_um';
  const url = `${SUPABASE_URL}/rest/v1/etappen_aktuell?select=${cols}&hitl1_benachrichtigt_um=not.is.null&hitl1_entschieden_um=is.null&order=datum.desc&limit=10`;
  const res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!res.ok) return [];
  return res.json();
}

// Archiv: ALLE Tage mit gespeicherten Narrator-Texten (nicht nur die offenen), zum
// Nachschauen alter Varianten — analog zur Monolog-Liste rechts im Monolog-Tab.
async function fetchEtappenHistorie() {
  const cols = 'id,datum,etappen_nr,tag_nr,tagesueberschrift,reel_varianten,hitl_prio_stil,'
    + 'hitl1_entschieden_um,route:routen(name,kuerzel)';
  const url = `${SUPABASE_URL}/rest/v1/etappen_aktuell?select=${cols}&reel_varianten=not.is.null&order=datum.desc&limit=30`;
  const res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!res.ok) return [];
  return res.json();
}

async function fetchFotosForEtappe(etappeId) {
  const url = `${SUPABASE_URL}/rest/v1/fotos?etappe_id=eq.${etappeId}&select=foto_nr,bildgen_datei,story_text&order=aufnahmedatum.asc`;
  const res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!res.ok) return [];
  return res.json();
}

const HITL1_STILE = ['ki_narrator', 'impact', 'selfie_first', 'rap'];

function Hitl1Panel({ etappe, onFreigegeben }) {
  const [saving, setSaving] = React.useState(false);
  const [fehler, setFehler] = React.useState(null);
  const [startort, setStartort] = React.useState(etappe.startort || '');
  const [zielort, setZielort] = React.useState(etappe.zielort || '');

  // Verfügbare Varianten aus reel_varianten (enthält Narrator-Texte aller Stile)
  const varianten = React.useMemo(() => parseReelVarianten(etappe.reel_varianten), [etappe.reel_varianten]);

  const alleStile = varianten.length > 0 ? varianten.map(v => v.stil) : HITL1_STILE;

  // Prio-Stil-Picker: Default = was die Pipeline vorbelegt hat (hitl_prio_stil oder erster Stil aus varianten)
  const defaultStil = etappe.hitl_prio_stil || (varianten[0]?.stil) || '';
  const [prioStil, setPrioStil] = React.useState(defaultStil);

  // Ein Kommentarfeld pro Stil — vorbefüllt mit dem, was ggf. schon in reel_varianten steckt
  // (so geht ein gespeicherter Kommentar beim Reload nicht mehr aus der Ansicht verloren).
  const [kommentare, setKommentare] = React.useState(() => {
    const init = {};
    varianten.forEach(v => { if (v?.stil) init[v.stil] = v.kommentar || ''; });
    return init;
  });
  const setKommentarFuer = (stil, text) => setKommentare(prev => ({ ...prev, [stil]: text }));
  const kopiereAufAlle = (stil) => {
    const text = kommentare[stil] || '';
    setKommentare(prev => {
      const next = { ...prev };
      alleStile.forEach(s => { next[s] = text; });
      return next;
    });
  };

  const fieldInput = { width: '100%', boxSizing: 'border-box', fontFamily: T.sans, fontSize: 14, lineHeight: 1.5, padding: '10px 12px', border: `1px solid ${T.border}`, borderRadius: 6, background: T.bg, color: T.ink };
  const isPreview = etappe.id === '__preview__';

  async function freigeben() {
    if (isPreview) return;
    setSaving(true); setFehler(null);
    const patchVarianten = (varianten.length > 0 ? varianten : HITL1_STILE.map(stil => ({ stil }))).map(v => ({
      ...v,
      kommentar: (kommentare[v.stil] || '').trim() || null,
    }));
    const patch = {
      hitl1_entschieden_um: new Date().toISOString(),
      hitl_prio_stil: prioStil || null,
      reel_varianten: JSON.stringify(patchVarianten),
      startort: startort.trim() || null,
      zielort: zielort.trim() || null,
    };
    try {
      const res = await patchEtappe(etappe.id, patch);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      onFreigegeben?.();
    } catch (err) {
      // Ohne diese Meldung blieb der Eintrag bei einem 401/Netzwerkfehler einfach stumm stehen.
      setFehler(`Freigabe fehlgeschlagen: ${err.message}`);
    } finally { setSaving(false); }
  }

  const bereitsEntschieden = !!etappe.hitl1_entschieden_um;

  return (
    <div style={{ maxWidth: 680, background: T.surface, borderRadius: 12, border: `1px solid ${T.border}`, padding: 24, marginBottom: 20, opacity: isPreview ? 0.6 : 1 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 }}>
        <div>
          <h2 style={{ fontFamily: T.serif, fontSize: 20, fontWeight: 400, margin: 0, color: T.ink }}>
            Narrator-Check — Tag {etappe.tag_nr || etappe.etappen_nr} ({etappe.datum})
          </h2>
          {bereitsEntschieden && <span style={{ fontSize: 12, color: T.ok, fontFamily: T.mono }}>✓ Bereits freigegeben</span>}
        </div>
      </div>

      <div style={{ display: 'flex', gap: 12, marginBottom: 20 }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 12, color: T.muted, fontFamily: T.sans, marginBottom: 4, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 }}>Startort</div>
          <input value={startort} onChange={e => setStartort(e.target.value)} disabled={isPreview} style={fieldInput} />
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 12, color: T.muted, fontFamily: T.sans, marginBottom: 4, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 }}>Zielort</div>
          <input value={zielort} onChange={e => setZielort(e.target.value)} disabled={isPreview} style={fieldInput} />
        </div>
      </div>

      {/* Ein Kärtchen pro Stil: Text + eigener Kommentar. Prio-Wahl sitzt direkt am Kärtchen. */}
      {(varianten.length > 0 ? varianten : HITL1_STILE.map(stil => ({ stil }))).map(v => {
        const stil = v.stil;
        const text = v.erzaehler_lang || '';
        const kommentar = kommentare[stil] || '';
        const istPrio = prioStil === stil;
        return (
          <div key={stil} style={{ border: `1.5px solid ${istPrio ? T.accent : T.border}`, borderRadius: 8, padding: 14, marginBottom: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
              <span style={{ fontFamily: T.sans, fontSize: 13, fontWeight: 700, color: T.ink }}>{stil}</span>
              <button onClick={() => setPrioStil(stil)} disabled={isPreview}
                style={{ fontFamily: T.sans, fontSize: 12, fontWeight: istPrio ? 700 : 400, padding: '4px 12px', borderRadius: 20, border: `1.5px solid ${istPrio ? T.accent : T.border}`, cursor: isPreview ? 'not-allowed' : 'pointer', background: istPrio ? T.accentSoft : 'transparent', color: istPrio ? T.accentInk : T.muted }}>
                {istPrio ? '★ Prio' : 'Als Prio wählen'}
              </button>
            </div>

            {text ? (
              <div style={{ fontFamily: T.sans, fontSize: 13, lineHeight: 1.55, color: T.ink, whiteSpace: 'pre-wrap', background: T.accentSoft, borderRadius: 6, padding: '10px 12px', marginBottom: 8 }}>
                {text}
              </div>
            ) : (
              <div style={{ fontFamily: T.sans, fontSize: 13, color: T.muted, fontStyle: 'italic', marginBottom: 8 }}>
                Noch kein Narrator-Text verfügbar.
              </div>
            )}

            <textarea rows={2} value={kommentar} onChange={e => setKommentarFuer(stil, e.target.value)} disabled={isPreview}
              placeholder="Kommentar / Korrektur zu diesem Text (optional)…"
              style={{ ...fieldInput, fontSize: 13, resize: 'vertical' }} />
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: 4 }}>
              {kommentar.trim() ? (
                <span style={{ fontSize: 11, color: T.warn, fontFamily: T.sans }}>
                  ↺ Dieser Text wird mit der Korrektur neu generiert bevor die Audio-Produktion startet.
                </span>
              ) : <span />}
              {kommentar.trim() && (
                <button onClick={() => kopiereAufAlle(stil)} disabled={isPreview}
                  style={{ fontFamily: T.sans, fontSize: 11, padding: '3px 8px', borderRadius: 6, border: `1px solid ${T.border}`, cursor: isPreview ? 'not-allowed' : 'pointer', background: 'transparent', color: T.muted, whiteSpace: 'nowrap' }}>
                  → auf alle {alleStile.length} Stile kopieren
                </button>
              )}
            </div>
          </div>
        );
      })}

      <button onClick={freigeben} disabled={saving || bereitsEntschieden || isPreview}
        style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 8, border: 'none', cursor: (saving || bereitsEntschieden || isPreview) ? 'not-allowed' : 'pointer', background: (bereitsEntschieden || isPreview) ? T.surfaceAlt : T.accent, color: (bereitsEntschieden || isPreview) ? T.mutedSoft : '#fff' }}>
        {bereitsEntschieden ? '✓ Freigegeben' : saving ? '…' : 'Freigeben →'}
      </button>
      {fehler && (
        <div style={{ marginTop: 10, background: T.errSoft, border: `1px solid ${T.err}`, borderRadius: 8, padding: '10px 14px', fontSize: 13, fontFamily: T.sans, color: T.err, fontWeight: 600 }}>
          ❌ {fehler}
        </div>
      )}
    </div>
  );
}

          <h2 style={{ fontFamily: T.serif, fontSize: 20, fontWeight: 400, margin: 0, color: T.ink }}>

          <span style={{ fontSize: 12, color: entschieden ? T.ok : T.muted, fontFamily: T.mono }}>

          Schließen ✕
        </button>
