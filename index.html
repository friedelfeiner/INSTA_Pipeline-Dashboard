// ─── Platform cost split ──────────────────────────────────────────────────────
// Einheitspreise + Kurs kommen aus costs_data.json (tools/costs_report.py --json,
// C1) — dieselbe Quelle, die der Ist-Kosten-Tab zeigt, damit Schätzwert und Beleg
// nie mit unterschiedlichen Preisen rechnen. setKostenPreise() wird beim Laden von
// costs_data.json aufgerufen; bis dahin bzw. falls das JSON fehlt, gelten die
// eingebauten Fallback-Werte (Stand 23.07., siehe pipeline_telemetry.PREISE_USD).
const KOSTEN_PREISE_FALLBACK = {
  kurs: 0.8765,
  preise: { t2i_bild: 0.067, flash_clip: 0.175, wan27_clip: 1.50, hero_bild: 0.075, tts: 0.11, tts_minimax: 0.17, suno_song: 0.06 },
  anbieter: { t2i_bild: 'wavespeed', wan27_clip: 'wavespeed', flash_clip: 'atlas', hero_bild: 'atlas', tts: 'fal', tts_minimax: 'minimax', suno_song: 'sunoapi' },
};
let kostenPreise = KOSTEN_PREISE_FALLBACK;
function setKostenPreise(meta) {
  if (!meta?.preise_usd || !meta?.preise_anbieter) return;
  kostenPreise = { kurs: meta.kurs_usd_eur || KOSTEN_PREISE_FALLBACK.kurs, preise: meta.preise_usd, anbieter: meta.preise_anbieter };
}

// C2a: mit unit_counts (ab 02.08. geschrieben) rechnet der Split exakt aus den
// echten Stückzahlen. Ohne unit_counts (Altbestand) bleibt nur die Heuristik aus
// t2i_count — sie kann wan27_clip (WaveSpeed) nicht von flash_clip (Atlas) trennen
// und wird darum im Dashboard mit „≈" gekennzeichnet (precise: false, C2/C3).
function platformCosts(e) {
  const { kurs, preise, anbieter } = kostenPreise;
  if (e.unit_counts) {
    const split = { wavespeed: 0, atlas: 0 };
    for (const [posten, n] of Object.entries(e.unit_counts)) {
      const preis = preise[posten];
      const ziel = anbieter[posten];
      if (!preis || !ziel || !(n > 0) || !(ziel in split)) continue;
      split[ziel] += n * preis * kurs;
    }
    return {
      wavespeed: Math.round(split.wavespeed * 10000) / 10000,
      atlas:     Math.round(split.atlas * 10000) / 10000,
      precise: true,
    };
  }
  const wavespeedEurProT2i = preise.t2i_bild * kurs;
  const wavespeed = Math.round((e.t2i_count || 0) * wavespeedEurProT2i * 10000) / 10000;
  const rest       = (e.cost_imagegen_eur || 0) - wavespeed + (e.cost_video_eur || 0);
  const atlas      = Math.round(Math.max(0, rest) * 10000) / 10000;
  const sonstiges  = Math.round(Math.min(0, rest) * -10000) / 10000; // C4: negativer Rest statt stillem Kappen
  return { wavespeed, atlas, sonstiges, precise: false };
}

// ─── Supabase config ──────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://rgwbmqlcxxrynufcmwqx.supabase.co';

// PostgREST liefert maximal 1000 Zeilen pro Anfrage (ein &limit=3000 wird
// stillschweigend gekappt). Deshalb seitenweise über Range-Header holen.
async function fetchAll(path, pageSize = 1000) {
  const headers = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
  const out = [];
  for (let from = 0; ; from += pageSize) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      headers: { ...headers, Range: `${from}-${from + pageSize - 1}` },
    });
    if (!res.ok) throw new Error(`Supabase ${res.status}: ${await res.text()}`);
    const page = await res.json();
    out.push(...page);
    if (page.length < pageSize) return out;
  }
}

// Antwortet die Edge Function mit 500 und ohne JSON-Body, warf r.json() früher mitten in den
// Aufrufer hinein — setSaving(false) lief nie, die Buttons blieben bis zum Reload tot. Jetzt
// kommt in jedem Fall ein Objekt zurück, das die Aufrufer über res.ok/res.error auswerten.
async function sendMonolog(datum, text, nurText) {
  let r;
  try {
    r = await fetch(FUNCTIONS_URL + '/monolog-grundgeruest', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ datum, monolog_text: text, nur_text: !!nurText }),
    });
  } catch (err) {
    return { ok: false, error: 'Netzwerkfehler: ' + err.message };
  }
  const roh = await r.text();
  let daten = null;
  try { daten = roh ? JSON.parse(roh) : null; } catch { /* kein JSON — unten behandelt */ }
  if (!r.ok) {
    return { ok: false, error: daten?.error || `HTTP ${r.status}${roh ? ': ' + roh.slice(0, 200) : ''}` };
  }
  if (!daten) return { ok: false, error: 'Ungültige Antwort der Edge Function' };
  return daten;
}

function fmtDur(s) {
  if (!s) return '–';
  const m = Math.floor(s / 60);
  const sec = Math.round(s % 60);
  return m ? `${m}:${String(sec).padStart(2, '0')} Min` : `${s}s`;
}

// Trend aus einer Zeitreihe: vergleicht jüngere vs. ältere Hälfte.
// dir 'up' = steigend (rot), 'down'/'stabil' = fallend/gleich (grün).
function trendInfo(series) {
  const pts = (series || []).filter(v => typeof v === 'number');
  if (pts.length < 4) return { dir: 'down', val: 'stabil', pct: 0 };
  const half = Math.floor(pts.length / 2);
  const avg = a => a.reduce((s, x) => s + x, 0) / (a.length || 1);
  const o = avg(pts.slice(0, half));
  const r = avg(pts.slice(half));
  if (o === 0) return { dir: r > 0 ? 'up' : 'down', val: r > 0 ? 'neu' : 'stabil', pct: 0 };
  const pct = Math.round(((r - o) / o) * 100);
  if (Math.abs(pct) < 8) return { dir: 'down', val: 'stabil', pct };
  return { dir: pct > 0 ? 'up' : 'down', val: `${pct > 0 ? '+' : ''}${pct}%`, pct };
}

// C6: 5 gleichmäßig verteilte Achsenbeschriftungen aus den echten Tag-Nummern der
// gezeigten Trend-Punkte — ersetzt die hart codierte T1/T7/T14/T21/T28-Achse, die
// nur für exakt 28 Runs ohne Lücken stimmte.
function trendAxisTicks(labels) {
  const n = (labels || []).length;
  if (!n) return ['', '', '', '', ''];
  if (n <= 5) return labels;
  const idxs = [0, 1, 2, 3, 4].map(i => Math.round((i * (n - 1)) / 4));
  return idxs.map(i => labels[i]);
}

function etappeName(e) {
  if (e.startort && e.zielort) return `${e.startort} → ${e.zielort}`;
  return e.tagesueberschrift || `Etappe ${e.tag_nr || e.etappen_nr || '?'}`;
}

function routeLabel(id) {
  const m = {
    via_de_la_plata:  'Via de la Plata',
    camino_frances:   'Camino Francés',
    camino_aleman:    'Camino Alemán',
    via_francigena:   'Via Francigena',
    camino_del_norte: 'Camino del Norte',
    camino_portugues: 'Camino Portugués',
  };
  return m[id] || (id ? id.replace(/_/g, ' ') : '–');
}

function statusMap(s) {
  if (s === 'publiziert') return 'success';
  if (s === 'fehler' || s === 'error' || s === 'fehlgeschlagen') return 'error';
  return 'partial';
}

// E4: "alle resolved" ist nur wahr, wenn errors[].resolved es für jeden Eintrag
// sagt — vorher stand der Text pauschal da, sobald es überhaupt Fehler gab, egal
// ob die Telemetrie sie längst als behoben markiert hatte (add_error(resolved=…)).
function fehlerSub(errors) {
  const list = errors || [];
  if (!list.length) return 'keine Fehler';
  const unresolved = list.filter(e => !e.resolved).length;
  if (unresolved > 0) return `${unresolved} Fehler · bitte prüfen`;
  return `${list.length} Fehler · alle resolved`;
}

function transformData(rows, routeMap = {}) {
  if (!rows || !rows.length) return null;

  const valid = rows.filter(e => e.datum);
  if (!valid.length) return null;

  // Letzte verarbeitete Etappe (by run_at), nicht die mit dem neuesten Datum
  const withRunAt = valid.filter(e => e.run_at);
  const latest = withRunAt.length
    ? withRunAt.reduce((a, b) => (a.run_at > b.run_at ? a : b))
    : valid[0];
  const chronological = [...valid].reverse();

  const mapEtappe = e => {
    const platform = platformCosts(e);
    return {
      id:        e.id,
      n:         e.tag_nr || 0,
      name:      etappeName(e),
      datum:     e.datum || '',
      route:     e.route_id || '',
      kuerzel:   routeMap[e.route_id]?.kuerzel || '',
      routeName: routeMap[e.route_id]?.name || '',
      stimmung:  e.erzaehl_stimmung || '',
      headline: e.tagesueberschrift || '',
      status:   statusMap(e.pipeline_status),
      run_at:   e.run_at || null,
      run:      e.run || 1,
      cost:     e.cost_total_eur    || 0,
      llm:      e.cost_llm_eur      || 0,
      imagegen: e.cost_imagegen_eur || 0,
      video:    e.cost_video_eur    || 0,
      tts:      e.cost_tts_eur      || 0,
      wavespeed: platform.wavespeed,
      atlas:     platform.atlas,
      costSonstiges: platform.sonstiges || 0,
      costPrecise:   platform.precise,
      dur:      e.duration_total_s  || 0,
      timings:  e.agent_timings_s   || {},
      // I2: Wanderdauer/Höhenmeter des Etappentages selbst — nicht zu verwechseln
      // mit `dur` (Pipeline-Laufzeit). NULL heißt „nicht erfasst", Zelle weglassen.
      dauerMin:      e.dauer_min ?? null,
      hoehenmeterAuf: e.hoehenmeter_auf ?? null,
      hoehenmeterAb:  e.hoehenmeter_ab ?? null,
      // I3
      blogUrl:  e.blog_url || null,
      photos_input:    e.photos_input    || 0,
      photos_selected: e.photos_selected || 0,
      t2i:      e.t2i_count   || 0,
      clips:    e.video_count || 0,
      unitCounts: e.unit_counts || null,
      retries:  Object.values(e.retries || {}).reduce((a, b) => a + b, 0),
      retriesByAgent: e.retries || {},
      errors:   e.errors || [],
      publishedPlatforms: e.published_platforms || [],
      // B5: Etappen ohne run_at sind nie gelaufen — nicht „kostet €0.00", sondern
      // „gibt es noch nicht". Die Ansicht muss das unterscheiden können.
      nieGelaufen: !e.run_at,
      // C7: cost_total_eur=null heißt „ohne Telemetrie", nicht „€0.00" — die Ansicht
      // muss beides unterscheiden können statt mit || 0 auf einen Haufen zu werfen.
      ohneTelemetrie: e.cost_total_eur == null,
    };
  };

  // etappen enthält Redo-Dubletten (mehrere Runs pro route_id+datum). Für die
  // Übersicht zählt pro Tag nur der höchste Run — dieselbe Logik wie das View
  // etappen_aktuell. Der Kosten-Tab (A3) braucht dagegen jeden Run einzeln.
  const neuesterProTag = new Map();
  chronological.forEach(e => {
    const key = `${e.route_id || ''}|${e.datum}`;
    const bisher = neuesterProTag.get(key);
    if (!bisher || (e.run || 1) > (bisher.run || 1)) neuesterProTag.set(key, e);
  });
  const etappenList = chronological
    .filter(e => neuesterProTag.get(`${e.route_id || ''}|${e.datum}`) === e)
    .map(mapEtappe);
  const etappenListAlleRuns = chronological.map(mapEtappe);

  const timings = latest.agent_timings_s || {};
  const runTime = latest.run_at ? latest.run_at.slice(11, 16) : '–';
  const latestPlatform = platformCosts(latest);

  return {
    etappe:          latest.tag_nr || 0,
    name:            etappeName(latest),
    date:            latest.datum || '–',
    time:            runTime,
    status:          statusMap(latest.pipeline_status),
    coreTheme:       latest.tagesueberschrift || '',
    erzaehlStimmung: latest.erzaehl_stimmung || '',
    costs: {
      total:     latest.cost_total_eur    || 0,
      llm:       latest.cost_llm_eur      || 0,
      imagegen:  latest.cost_imagegen_eur || 0,
      video:     latest.cost_video_eur    || 0,
      tts:       latest.cost_tts_eur      || 0,
      wavespeed: latestPlatform.wavespeed,
      atlas:     latestPlatform.atlas,
    },
    duration: {
      total:    latest.duration_total_s || 0,
      analyst:  timings.analyst   || 0,
      narrator: timings.narrator  || 0,
      imagegen: timings.imagegen  || 0,
      animator: timings.animator  || 0,
      tts:      timings.tts       || 0,
    },
    latestId:     latest.id,
    retries:      latest.retries || {},
    retriesTotal: Object.values(latest.retries || {}).reduce((a, b) => a + b, 0),
    errors:       latest.errors  || [],
    photos: {
      input:    latest.photos_input    || 0,
      selected: latest.photos_selected || 0,
    },
    publishedPlatforms: latest.published_platforms || [],
    etappenList,
    etappenListAlleRuns,
    ...nebenreihen(etappenList, routeMap, latest.route_id || null),
  };
}

// B8 — Nebenreihen (Trend-Kurven, Reise-Summen) aus *der Liste*, die die Ansicht
// gerade zeigt. Vorher rechneten sie fest über alle Etappen aller Routen: mit
// gesetztem Routenfilter zeigte die Übersicht weiter gemischte Routen.
// list: chronologisch aufsteigend (ältester Tag zuerst), bereits gemappt.
// E5: "die letzten N Runs" heißt nach Rechendatum (run_at) — wann die Pipeline
// tatsächlich lief —, nicht nach Wandertag. Sortiert nach Datum stünde sonst ein
// Redo, das erst gestern nachgeholt wurde, weit hinten im Verlauf.
function letzteNachRechendatum(list, n) {
  return [...list].filter(e => e.run_at).sort((a, b) => a.run_at.localeCompare(b.run_at)).slice(-n);
}

function nebenreihen(list, routeMap = {}, fallbackRouteId = null) {
  const letzte = n => list.slice(-n);

  // C7: cost_total_eur=null („ohne Telemetrie") darf nicht als 0 in die Kurve —
  // sonst zeigt der Trend einen Kosteneinbruch, wo in Wahrheit nur nicht gemessen
  // wurde. null bleibt null, AreaChart überspringt/interpoliert solche Punkte.
  const trend28 = letzte(28).map(e => e.ohneTelemetrie ? null : (e.cost || 0));
  // C6: echte Tag-Nummern statt der hart codierten T1/T7/T14/T21/T28-Achse — die
  // stimmte nicht mehr, sobald weniger als 28 Runs vorliegen oder die Liste durch
  // einen Routenfilter kürzer wird.
  const trend28Labels = letzte(28).map(e => e.n || 0);
  // E5: nach Rechendatum statt Wandertag — sonst zeigt der Verlauf Redo-Tage
  // doppelt zeitversetzt oder lässt echte Läufe wegen eines nur früher
  // gebuchten Wandertags aus dem Fenster fallen.
  const retryRuns = letzteNachRechendatum(list, 12);
  const retryHistory = retryRuns.map(e => e.retries || 0);
  const durationHistory = { imagegen: retryRuns.map(e => e.timings?.imagegen || 0) };

  // Bezugsroute: bei aktivem Filter die gefilterte, sonst die der letzten Etappe.
  const routen = new Set(list.map(e => e.route).filter(Boolean));
  const bezugsRoute = routen.size === 1 ? [...routen][0] : fallbackRouteId;
  const routeEtappen = bezugsRoute ? list.filter(e => e.route === bezugsRoute) : list;

  const tripTotal = Math.round(routeEtappen.reduce((s, e) => s + (e.cost || 0), 0) * 100) / 100;
  const tripKuerzel = routeMap[bezugsRoute]?.kuerzel
    || routeEtappen.find(e => e.route === bezugsRoute)?.kuerzel || '';
  const tripEtappenCount = routeEtappen.filter(e => e.cost > 0).length;

  return { trend28, trend28Labels, retryHistory, retryRuns, durationHistory, tripTotal, tripKuerzel, tripEtappenCount };
}

// B1/B2/B5 — die Liste, die die Etappen-Ansicht zeigt.
// routeFilter: route_id oder '' für „Alle Routen".
// sortMode: 'wandertag' (Datum der Wanderung) | 'rechendatum' (run_at, wann die
// Pipeline gelaufen ist). Ohne Routenfilter wird immer erst nach Route gruppiert —
// sonst schneiden sich die Datumsbereiche der Routen ineinander.
function viewListe(alle, routeFilter, sortMode) {
  const list = routeFilter ? alle.filter(e => e.route === routeFilter) : alle.slice();

  const routenOrder = [];
  alle.forEach(e => { if (!routenOrder.includes(e.route)) routenOrder.push(e.route); });
  const routeRang = r => { const i = routenOrder.indexOf(r); return i < 0 ? 999 : i; };

  return list.sort((a, b) => {
    if (!routeFilter) {
      const dr = routeRang(a.route) - routeRang(b.route);
      if (dr) return dr;
    }
    if (sortMode === 'rechendatum') {
      // Nie gelaufene Etappen (kein run_at) haben kein Rechendatum → ans Ende.
      if (!a.run_at && !b.run_at) return (a.datum || '').localeCompare(b.datum || '');
      if (!a.run_at) return 1;
      if (!b.run_at) return -1;
      return a.run_at.localeCompare(b.run_at);
    }
    return (a.datum || '').localeCompare(b.datum || '');
  });
}

// ─── Reliability aus Echtdaten ────────────────────────────────────────────────
// Aggregiert Retries/Fehler aus den geladenen Etappen. Keine Platzhalterwerte:
// Wo nichts vorliegt, liefert die Funktion leere Listen → UI zeigt sauberen Zustand.
function reliabilityStats(data) {
  const list = data.etappenList || [];
  // E5: "die letzten 12" nach Rechendatum, nicht nach Wandertag (siehe
  // letzteNachRechendatum) — sonst zählt ein Redo-Tag am falschen Zeitpunkt mit.
  const recent = letzteNachRechendatum(list, 12);
  const n = recent.length;
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;

  const tripRetries = list.reduce((s, e) => s + e.retries, 0);
  // C7: "ist gelaufen" ist B5s nieGelaufen-Flag (aus run_at), nicht "hat Kosten/Dauer
  // > 0" — sonst zählt ein Lauf ohne Telemetrie (cost=null→0, dur=0) fälschlich als
  // "nie gelaufen", obwohl er lief.
  const ran = list.filter(e => !e.nieGelaufen);
  // C8: statusMap statt reinem errors[]-Count — ein Run mit pipeline_status='fehler'
  // aber ohne errors-Eintrag galt vorher als Erfolg. Ein Run zählt als Fehler, wenn
  // entweder der Status es sagt ODER ein unresolved Error in errors[] steht.
  const runsWithError = ran.filter(e =>
    e.status === 'error' || (e.errors || []).some(err => !err.resolved)
  ).length;
  const successRate   = ran.length ? Math.round(((ran.length - runsWithError) / ran.length) * 100) : 100;

  const imgSeries = recent.map(e => e.retriesByAgent?.imagegen || 0);
  const imgTrend  = trendInfo(imgSeries);
  const half      = Math.floor(imgSeries.length / 2) || 1;
  const imgStart  = avg(imgSeries.slice(0, half));
  const imgEnd    = avg(imgSeries.slice(half));

  // Echte Ereignisse: Fehler aus allen Etappen + ggf. eine berechnete Frühwarnung
  const events = [];
  list.forEach(e => (e.errors || []).forEach(err => events.push({
    kind: 'error', etappe: e,
    title: err.agent ? `${err.agent} · Fehler` : 'Fehler',
    detail: err.msg || (typeof err === 'string' ? err : JSON.stringify(err)),
  })));
  if (imgTrend.dir === 'up' && n >= 4) {
    events.unshift({
      kind: 'warn', etappe: null,
      title: 'imagegen: Retry-Rate erhöht',
      detail: `Über die letzten ${n} Runs steigt die imagegen-Retry-Rate von Ø ${imgStart.toFixed(1)} auf ${imgEnd.toFixed(1)} (${imgTrend.val}).`,
    });
  }

  return { tripRetries, successRate, runsWithError, ranCount: ran.length, events, warnings: events.length };
}

function AreaChart({ points: pointsIn, h = 60, accent, id }) {
  const col = accent || T.accent;
  const gid = `g-${id || Math.random().toString(36).slice(2)}`;
  // C7: null-Punkte ("ohne Telemetrie", trend28) sind kein Kosteneinbruch — aus
  // der Kurve rausfiltern statt sie als 0 zu zeichnen (NaN im Pfad wäre die Folge).
  const points = pointsIn.filter(v => typeof v === 'number');
  if (!points.length) return <svg viewBox={`0 0 300 ${h}`} style={{ width: '100%', height: h, display: 'block' }} />;
  const max = Math.max(...points);
  const min = Math.min(...points);
  const range = max - min || 1;
  const w = 300;
  const step = points.length > 1 ? w / (points.length - 1) : w;
  const toY = v => 6 + (1 - (v - min) / range) * (h - 12);
  const line = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${(i * step).toFixed(1)},${toY(p).toFixed(1)}`).join(' ');
  const area = `${line} L${w},${h} L0,${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: '100%', height: h, display: 'block' }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={col} stopOpacity="0.28" />
          <stop offset="100%" stopColor={col} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke={col} strokeWidth="2" vectorEffect="non-scaling-stroke" />
      <circle cx={(points.length - 1) * step} cy={toY(points[points.length - 1])} r="3.5" fill={col} stroke={T.surface} strokeWidth="2" />
    </svg>
  );
}

function TrendBadge({ dir, val }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 3, padding: '3px 7px',
      background: dir === 'up' ? T.errSoft : T.okSoft,
      color: dir === 'up' ? T.err : T.ok,
      fontFamily: T.mono, fontSize: 10, fontWeight: 600, borderRadius: 4 }}>
      {dir === 'up' ? <ITrendUp size={10} /> : <ITrendDown size={10} />} {val}
    </span>
  );
}

// Ereignis-Karte aus reliabilityStats().events (echter Fehler oder Frühwarnung)
function EventCard({ ev }) {
  const isWarn = ev.kind === 'warn';
  const col = isWarn ? T.accent : T.err;
  const bg  = isWarn ? T.accentSoft : T.errSoft;
  const Icon = isWarn ? ISparkles : IAlert;
  return (
    <div style={{ padding: 14, background: bg, borderRadius: 8, borderLeft: `3px solid ${col}` }}>
      <div style={{ display: 'flex', gap: 9, alignItems: 'flex-start' }}>
        <Icon size={15} style={{ color: col, marginTop: 1, flexShrink: 0 }} sw={2} />
        <div style={{ minWidth: 0 }}>
          {isWarn && <div style={{ fontFamily: T.mono, fontSize: 10, color: T.accentInk, textTransform: 'uppercase', letterSpacing: 0.6, fontWeight: 600, marginBottom: 3 }}>Frühwarnung</div>}
          <div style={{ fontSize: 13, fontWeight: 600, color: T.ink }}>
            {ev.title}{ev.etappe ? ` · T${ev.etappe.n}` : ''}
          </div>
          <div style={{ fontSize: 11.5, color: T.muted, marginTop: 3, lineHeight: 1.45, wordBreak: 'break-word' }}>{ev.detail}</div>
        </div>
      </div>
    </div>
  );
}

// Positiver Zustand, wenn keine Fehler/Warnungen vorliegen
function AllClearCard({ text = 'Keine Fehler · alle Runs sauber' }) {
  return (
    <div style={{ padding: 14, background: T.okSoft, borderRadius: 8, borderLeft: `3px solid ${T.ok}` }}>
      <div style={{ display: 'flex', gap: 9, alignItems: 'center' }}>
        <ICircleCheck size={15} style={{ color: T.ok, flexShrink: 0 }} sw={2} />
        <div style={{ fontSize: 12.5, color: T.ink, fontWeight: 500 }}>{text}</div>
      </div>
    </div>
  );
}

// ─── Tab content ──────────────────────────────────────────────────────────────
function TabUebersicht({ data, selectedEtappe }) {
  const mobile = useMobile();
  const latestE = selectedEtappe || data.etappenList.find(e => e.id === data.latestId);
  const ct = latestE?.cost || 1;
  const costPct = k => ct > 0 ? Math.round(((latestE?.[k] || 0) / ct) * 100) : 0;
  const dur = {
    total:    latestE?.dur                  || 0,
    analyst:  latestE?.timings?.analyst  || 0,
    narrator: latestE?.timings?.narrator || 0,
    imagegen: latestE?.timings?.imagegen || 0,
    animator: latestE?.timings?.animator || 0,
    tts:      latestE?.timings?.tts      || 0,
  };
  const maxAgentSec = Math.max(dur.analyst, dur.narrator, dur.imagegen, dur.animator, dur.tts, 1);
  const currentRoute = latestE?.route || '';
  const routeDurEtappen = data.etappenList.filter(e => (!currentRoute || e.route === currentRoute) && e.dur > 0);
  const avgDurRoute = routeDurEtappen.length
    ? Math.round(routeDurEtappen.reduce((s, e) => s + e.dur, 0) / routeDurEtappen.length)
    : 0;
  const avgCostRoute = data.tripEtappenCount > 0 ? data.tripTotal / data.tripEtappenCount : 0;
  const t2i   = latestE?.t2i   || 0;
  const clips = latestE?.clips || 0;
  const costTrend = trendInfo(data.trend28);
  const rel = reliabilityStats(data);
  // E5: die Runs hinter dem Balkendiagramm sind jetzt nach Rechendatum gewählt
  // (data.retryRuns) — vorher zeigte data.etappenList.slice(...) hier die letzten
  // Wandertage, was bei Redos nicht dieselben Runs waren wie im Chart.
  const recentRetry = data.retryRuns || [];
  const imgDurTrend = trendInfo(data.durationHistory.imagegen);

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(2, 1fr)' : 'repeat(4, 1fr)', gap: 14 }}>
        <KPI icon={IEuro}    label="Kosten (Run)"
          value={`€${(latestE?.cost || 0).toFixed(2)}`}
          sub={`Ø €${avgCostRoute.toFixed(2)} · Σ €${data.tripTotal.toFixed(2)}${data.tripKuerzel ? ' · ' + data.tripKuerzel : ''}`} />
        <KPI icon={IClock}   label="Dauer (Run)"
          value={dur.total ? fmtDur(dur.total) : '–'}
          sub={avgDurRoute ? `Ø ${fmtDur(avgDurRoute)}${data.tripKuerzel ? ' · ' + data.tripKuerzel : ''} · ${routeDurEtappen.length} Etappen` : 'Keine Daten'} />
        <KPI icon={IRefresh} label="Retries"
          value={String(latestE?.retries ?? 0)}
          sub={fehlerSub(latestE?.errors)} />
        <PublishedKPI platforms={latestE?.publishedPlatforms || []} />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : '1.1fr 1fr', gap: 14 }}>
        <Panel>
          <PanelHeader icon={ICoins} label="Kosten-Breakdown · hochgerechnet" serif="Wo geht das Geld hin?"
            right={<div style={{ textAlign: 'right' }}>
              <div style={{ fontFamily: T.serif, fontSize: 24, fontWeight: 400, letterSpacing: -0.3 }}>€{(latestE?.cost || 0).toFixed(2)}</div>
              <div style={{ fontSize: 10, color: T.muted, fontFamily: T.mono }}>dieser Run</div>
            </div>} />
          {/* C3: Schätzwert aus Einheitspreisen, kein Beleg — der ist im Ist-Kosten-Tab. */}
          <div style={{ fontSize: 11, color: T.muted, marginBottom: 14, lineHeight: 1.4 }}>
            hochgerechnet aus Einheitspreisen{!latestE?.costPrecise ? ' (≈, alte Etappe ohne Stückzahlen)' : ''} ·
            Belege im Ist-Kosten-Tab
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <CostBar name="LLM (Claude + Gemini)" value={`€${(latestE?.llm || 0).toFixed(2)}`}        pct={costPct('llm')}       color={T.accent} />
            <CostBar name="Atlas"      value={`€${(latestE?.atlas || 0).toFixed(2)}`}       pct={costPct('atlas')}     color="#9F6BF5" />
            <CostBar name="WaveSpeed"  value={`€${(latestE?.wavespeed || 0).toFixed(2)}`}   pct={costPct('wavespeed')} color="#C2A4F8" />
            <CostBar name="TTS + Musik" value={`€${(latestE?.tts || 0).toFixed(2)}`}         pct={costPct('tts')}       color="#DFCEFA" />
            {/* C4: negativer Rest aus der Heuristik (Atlas-Anteil < WaveSpeed-Schätzung)
                wird ausgewiesen statt mit Math.max(0,…) stumm gekappt — sonst gingen
                die Balken nicht mehr auf den Gesamtbetrag auf. */}
            {latestE?.costSonstiges > 0 && (
              <CostBar name="sonstiges (Heuristik-Rest)" value={`€${latestE.costSonstiges.toFixed(2)}`} pct={costPct('costSonstiges')} color={T.mutedSoft} />
            )}
          </div>
          <div style={{ marginTop: 18, paddingTop: 16, borderTop: `1px solid ${T.border}` }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
              <span style={{ fontFamily: T.sans, fontSize: 11, color: T.muted, fontWeight: 500 }}>Trend · {data.trend28.length} Runs</span>
              <TrendBadge dir={costTrend.dir} val={costTrend.val} />
            </div>
            <AreaChart points={data.trend28} h={56} id="ov-cost" />
          </div>
        </Panel>

        <Panel>
          <PanelHeader icon={IGauge} label="Dauer pro Agent" serif="Wer bremst?"
            right={<div style={{ textAlign: 'right' }}>
              <div style={{ fontFamily: T.serif, fontSize: 24, fontWeight: 400, letterSpacing: -0.3 }}>{dur.total ? fmtDur(dur.total) : '–'}</div>
              <div style={{ fontSize: 10, color: T.muted, fontFamily: T.mono }}>Σ Gesamtdauer</div>
            </div>} />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 13 }}>
            <AgentBar name="analyst"  seconds={dur.analyst}  maxSec={maxAgentSec} />
            <AgentBar name="narrator" seconds={dur.narrator} maxSec={maxAgentSec} />
            <AgentBar name="imagegen" seconds={dur.imagegen} maxSec={maxAgentSec} />
            <AgentBar name="animator" seconds={dur.animator} maxSec={maxAgentSec} />
            <AgentBar name="tts"      seconds={dur.tts}      maxSec={maxAgentSec} />
          </div>
          <div style={{ marginTop: 18, paddingTop: 16, borderTop: `1px solid ${T.border}`, display: 'flex', alignItems: 'center', gap: 12 }}>
            <div style={{ flex: 1 }}>
              <div style={{ fontFamily: T.sans, fontSize: 11, color: T.muted, fontWeight: 500 }}>imagegen · letzte {data.durationHistory.imagegen.length} Runs</div>
              <div style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 8px', marginTop: 5,
                background: imgDurTrend.dir === 'up' ? T.warnSoft : T.okSoft,
                color: imgDurTrend.dir === 'up' ? T.warn : T.ok, borderRadius: 4, fontSize: 11, fontWeight: 500 }}>
                {imgDurTrend.dir === 'up' ? <ITrendUp size={11} sw={2.2} /> : <ITrendDown size={11} sw={2.2} />}
                <span style={{ fontFamily: T.mono }}>{imgDurTrend.val}</span> {imgDurTrend.val === 'stabil' ? '' : imgDurTrend.dir === 'up' ? 'langsamer' : 'schneller'}
              </div>
            </div>
            <div style={{ width: 90, flexShrink: 0 }}>
              <AreaChart points={data.durationHistory.imagegen} h={36} accent={T.warn} id="ov-img" />
            </div>
          </div>
        </Panel>
      </div>

      <Panel>
        <PanelHeader icon={IShield} label="Reliability" serif="Hat alles funktioniert?"
          right={rel.warnings > 0
            ? <Pill state="warn" label={`${rel.warnings} aktive Warnung${rel.warnings === 1 ? '' : 'en'}`} />
            : <Pill state="ok" label="alles stabil" />} />
        {/* E3: Erfolgsrate + Retries Reise Σ standen bis zum Umbau von Block E nur
            im Reliability-Tab — der zeigt seit E1 nur noch die gewählte Etappe,
            darum ziehen die beiden Reise-Kennzahlen hierher in die Übersicht. */}
        <div style={{ display: 'flex', gap: 28, marginBottom: 18, flexWrap: 'wrap' }}>
          <div>
            <div style={{ fontFamily: T.serif, fontSize: 26, fontWeight: 400, color: T.ink, lineHeight: 1 }}>{rel.successRate}%</div>
            <div style={{ fontSize: 11, color: T.muted, marginTop: 4 }}>
              Erfolgsrate · {rel.runsWithError ? `${rel.runsWithError} von ${rel.ranCount} Runs mit Fehler` : `${rel.ranCount} Runs, 0 Fehler`}
            </div>
          </div>
          <div>
            <div style={{ fontFamily: T.serif, fontSize: 26, fontWeight: 400, color: T.ink, lineHeight: 1 }}>{rel.tripRetries}</div>
            <div style={{ fontSize: 11, color: T.muted, marginTop: 4 }}>Retries Reise Σ{data.tripKuerzel ? ` · ${data.tripKuerzel}` : ''}</div>
          </div>
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : '1.2fr 1fr', gap: 20 }}>
          <div>
            <div style={{ fontSize: 11, color: T.muted, fontWeight: 500, marginBottom: 8 }}>Retries pro Run · letzte {data.retryHistory.length}</div>
            <BarChart values={data.retryHistory} h={90}
              colorFn={(v) => v > 1 ? `linear-gradient(180deg, ${T.warn}, ${T.warn}cc)` : v > 0 ? T.accent : T.surfaceAlt} />
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontFamily: T.mono, fontSize: 10, color: T.mutedSoft }}>
              <span>T{recentRetry[0]?.n ?? ''}</span>
              <span>T{recentRetry[recentRetry.length - 1]?.n ?? ''}</span>
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {rel.events.length > 0
              ? rel.events.slice(0, 3).map((ev, i) => <EventCard key={i} ev={ev} />)
              : <AllClearCard />}
          </div>
        </div>
      </Panel>
    </div>
  );
}

function TabKosten({ data, selectedEtappe }) {
  const mobile = useMobile();
  const [sortBy, setSortBy] = React.useState('datum');
  const [sortDir, setSortDir] = React.useState('asc');
  const [selected, setSelected] = React.useState(null);

  const curE = selectedEtappe || data.etappenList.find(e => e.id === data.latestId);
  const ct = curE?.cost || 1;
  const costPct = k => ct > 0 ? Math.round(((curE?.[k] || 0) / ct) * 100) : 0;
  const alleRuns = data.etappenListAlleRuns || data.etappenList;
  const withCost = alleRuns.filter(e => e.cost > 0);
  const teuerste = withCost.length ? withCost.reduce((max, e) => e.cost > max.cost ? e : max) : null;
  const maxCost = Math.max(...alleRuns.map(x => x.cost), 0.01);
  const costTrend = trendInfo(data.trend28);

  const toggleSort = (col) => {
    if (sortBy === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortBy(col); setSortDir(col === 'datum' || col === 'n' ? 'asc' : 'desc'); }
  };

  const sorted = [...alleRuns].sort((a, b) => {
    let v;
    if      (sortBy === 'datum')   v = a.datum.localeCompare(b.datum);
    else if (sortBy === 'n')       v = a.n - b.n;
    else if (sortBy === 'cost')    v = a.cost - b.cost;
    else if (sortBy === 'llm')     v = a.llm - b.llm;
    else if (sortBy === 'imagegen')v = a.imagegen - b.imagegen;
    else if (sortBy === 'video')   v = a.video - b.video;
    else if (sortBy === 'tts')     v = a.tts - b.tts;
    else if (sortBy === 'route')   v = (a.kuerzel || a.route).localeCompare(b.kuerzel || b.route);
    else v = 0;
    return sortDir === 'asc' ? v : -v;
  });

  const SortTh = ({ col, children }) => {
    const active = sortBy === col;
    return (
      <th onClick={() => toggleSort(col)} style={{ textAlign: 'left', padding: '8px 10px', cursor: 'pointer',
        fontFamily: T.mono, fontSize: 10, color: active ? T.accent : T.muted,
        fontWeight: active ? 700 : 500, textTransform: 'uppercase', letterSpacing: 0.5,
        userSelect: 'none', whiteSpace: 'nowrap' }}>
        {children} {active ? (sortDir === 'asc' ? '↑' : '↓') : <span style={{ opacity: 0.3 }}>↕</span>}
      </th>
    );
  };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)', gap: 14 }}>
        <KPI icon={IEuro} label="Kosten (gewählter Run)" value={`€${(curE?.cost || 0).toFixed(2)}`} sub="dieser Run" />
        <KPI icon={IEuro} label={`Kosten${data.tripKuerzel ? ' ' + data.tripKuerzel : ' Reise'}`} value={`€${data.tripTotal.toFixed(2)}`} sub={`${data.tripEtappenCount} Runs · Ø €${data.tripEtappenCount ? (data.tripTotal / data.tripEtappenCount).toFixed(2) : '–'}`} />
        <KPI icon={IEuro} label="Teuerste Etappe" value={teuerste ? `€${teuerste.cost.toFixed(2)}` : '–'} sub={teuerste ? `${teuerste.kuerzel || ''} T${teuerste.n} · ${teuerste.name}`.trim() : 'Keine Daten'} />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : '1.4fr 1fr', gap: 14 }}>
        <Panel>
          <PanelHeader icon={ICoins} label="Kosten-Trend" serif={`${data.trend28.length} Runs Verlauf`}
            right={<TrendBadge dir={costTrend.dir} val={costTrend.val} />} />
          <AreaChart points={data.trend28} h={120} id="k-trend" />
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontFamily: T.mono, fontSize: 10, color: T.mutedSoft }}>
            {/* C6: echte Tag-Nummern der gezeigten Runs statt der hart codierten
                T1/T7/T14/T21/T28-Achse, die bei <28 Runs oder Routenfilter nicht mehr stimmte. */}
            {trendAxisTicks(data.trend28Labels).map((n, i) => <span key={i}>{n ? `T${n}` : ''}</span>)}
          </div>
        </Panel>

        <Panel>
          <PanelHeader icon={ICoins} label="Breakdown heute" serif="Pro Kategorie" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <CostBar name="LLM"      value={`€${(curE?.llm || 0).toFixed(2)}`}      pct={costPct('llm')}      color={T.accent} />
            <CostBar name="ImageGen" value={`€${(curE?.imagegen || 0).toFixed(2)}`} pct={costPct('imagegen')} color="#9F6BF5" />
            <CostBar name="Video"    value={`€${(curE?.video || 0).toFixed(2)}`}     pct={costPct('video')}    color="#C2A4F8" />
            <CostBar name="TTS"      value={`€${(curE?.tts || 0).toFixed(2)}`}       pct={costPct('tts')}      color="#DFCEFA" />
          </div>
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.border}` }}>
            <div style={{ fontSize: 11, color: T.muted, fontWeight: 500, marginBottom: 10 }}>Anteil pro Kategorie</div>
            <div style={{ display: 'flex', height: 12, borderRadius: 6, overflow: 'hidden', gap: 2 }}>
              {[{ k: 'llm', c: T.accent }, { k: 'imagegen', c: '#9F6BF5' }, { k: 'video', c: '#C2A4F8' }, { k: 'tts', c: '#DFCEFA' }].map((s, i) => (
                <div key={i} style={{ width: `${costPct(s.k) || 1}%`, background: s.c, borderRadius: i === 0 ? '6px 0 0 6px' : i === 3 ? '0 6px 6px 0' : 0 }} />
              ))}
            </div>
          </div>
        </Panel>
      </div>

      <Panel>
        <PanelHeader icon={ICoins} label="Kosten pro Etappe" serif="Alle Etappen im Vergleich" />
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: T.sans, fontSize: 12 }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${T.border}` }}>
                <SortTh col="route">Kürzel</SortTh>
                <SortTh col="datum">Tag</SortTh>
                <th style={{ textAlign: 'left', padding: '8px 10px', fontFamily: T.mono, fontSize: 10, color: T.muted, fontWeight: 500, textTransform: 'uppercase', letterSpacing: 0.5 }}>Etappe</th>
                <SortTh col="cost">Kosten</SortTh>
                <SortTh col="llm">LLM</SortTh>
                <SortTh col="imagegen">ImageGen</SortTh>
                <SortTh col="video">Video</SortTh>
                <SortTh col="tts">TTS</SortTh>
                <th />
              </tr>
            </thead>
            <tbody>
              {sorted.map(e => {
                return (
                  <tr key={e.id} onClick={() => setSelected(e)}
                    style={{ borderBottom: `1px solid ${T.border}`,
                      background: e.id === (selectedEtappe?.id ?? data.latestId) ? T.accentSoft : 'transparent',
                      cursor: 'pointer', transition: 'background 0.1s' }}
                    onMouseEnter={ev => ev.currentTarget.style.background = T.surfaceAlt}
                    onMouseLeave={ev => ev.currentTarget.style.background = e.id === (selectedEtappe?.id ?? data.latestId) ? T.accentSoft : 'transparent'}>
                    <td style={{ padding: '10px' }}>
                      {e.kuerzel ? <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 700, color: T.accentInk, background: T.accentSoft, borderRadius: 4, padding: '2px 7px', whiteSpace: 'nowrap' }}>{e.kuerzel}</span> : <span style={{ fontFamily: T.mono, fontSize: 10, color: T.mutedSoft }}>–</span>}
                    </td>
                    <td style={{ padding: '10px', fontFamily: T.mono, fontSize: 11, color: T.mutedSoft, whiteSpace: 'nowrap' }}>T{e.n} · {e.datum?.slice(5)}</td>
                    <td style={{ padding: '10px', color: T.ink, fontWeight: e.id === (selectedEtappe?.id ?? data.latestId) ? 600 : 400 }}>
                      <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                        <span>{e.name}</span>
                        {e.run > 1 && (
                          <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 600, padding: '2px 6px',
                            borderRadius: 4, background: T.accentSoft, color: T.accentInk }}>RUN {e.run}</span>
                        )}
                        {/* B5: kein run_at heißt „nie gelaufen" — nicht „hat €0.00 gekostet". */}
                        {e.nieGelaufen && (
                          <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 600, padding: '2px 6px',
                            borderRadius: 4, background: T.surfaceAlt, color: T.muted, whiteSpace: 'nowrap' }}>nie gelaufen</span>
                        )}
                        {/* C7: gelaufen, aber cost_total_eur=null — anderer Fall als "nie gelaufen",
                            z.B. Lauf vor dem Telemetrie-Einbau oder Abbruch vor dem Kosten-Write. */}
                        {!e.nieGelaufen && e.ohneTelemetrie && (
                          <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 600, padding: '2px 6px',
                            borderRadius: 4, background: T.surfaceAlt, color: T.muted, whiteSpace: 'nowrap' }}>ohne Telemetrie</span>
                        )}
                      </div>
                      {e.stimmung && <div style={{ fontSize: 10, color: T.mutedSoft, fontStyle: 'italic', marginTop: 2 }}>{e.stimmung}</div>}
                    </td>
                    <td style={{ padding: '10px', fontFamily: T.mono, fontSize: 12, color: (e.nieGelaufen || e.ohneTelemetrie) ? T.mutedSoft : T.ink, fontWeight: 600 }}>{(e.nieGelaufen || e.ohneTelemetrie) ? '–' : `€${e.cost.toFixed(2)}`}</td>
                    <td style={{ padding: '10px', fontFamily: T.mono, fontSize: 11, color: T.muted }}>{(e.nieGelaufen || e.ohneTelemetrie) ? '–' : `€${e.llm.toFixed(2)}`}</td>
                    <td style={{ padding: '10px', fontFamily: T.mono, fontSize: 11, color: T.muted }}>{(e.nieGelaufen || e.ohneTelemetrie) ? '–' : `€${e.imagegen.toFixed(2)}`}</td>
                    <td style={{ padding: '10px', fontFamily: T.mono, fontSize: 11, color: T.muted }}>{(e.nieGelaufen || e.ohneTelemetrie) ? '–' : `€${e.video.toFixed(2)}`}</td>
                    <td style={{ padding: '10px', fontFamily: T.mono, fontSize: 11, color: T.muted }}>{(e.nieGelaufen || e.ohneTelemetrie) ? '–' : `€${e.tts.toFixed(2)}`}</td>
                    <td style={{ padding: '10px' }}>
                      <div style={{ width: 60, height: 6, background: T.surfaceAlt, borderRadius: 3, overflow: 'hidden' }}>
                        <div style={{ height: '100%', width: `${(e.cost / maxCost) * 100}%`, background: T.accent, borderRadius: 3 }} />
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Panel>

      {selected && <EtappeDetailModal etappe={selected} onClose={() => setSelected(null)} />}
    </div>
  );
}

function TabPerformance({ data, selectedEtappe }) {
  const mobile = useMobile();
  const curE = selectedEtappe || data.etappenList.find(e => e.id === data.latestId);
  const dur = {
    total:    curE?.dur                  || 0,
    analyst:  curE?.timings?.analyst  || 0,
    narrator: curE?.timings?.narrator || 0,
    imagegen: curE?.timings?.imagegen || 0,
    animator: curE?.timings?.animator || 0,
    tts:      curE?.timings?.tts      || 0,
  };
  const totalSec = dur.total || 1;
  const withDur = data.etappenList.filter(e => e.dur > 0);
  const avgDur = withDur.length ? Math.round(withDur.reduce((s, e) => s + e.dur, 0) / withDur.length) : 0;
  const maxDur = Math.max(...withDur.map(e => e.dur), 1);
  const agentKeys = ['analyst', 'narrator', 'imagegen', 'animator', 'tts'];
  const slowest = agentKeys.reduce((max, k) => dur[k] > dur[max] ? k : max, agentKeys[0]);
  const agents = agentKeys.map(k => ({ name: k, seconds: dur[k] || 0 }));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)', gap: 14 }}>
        <KPI icon={IClock} label="Gesamtdauer" value={dur.total ? fmtDur(dur.total) : '–'} sub={dur.total ? `${dur.total}s` : 'Keine Daten'} />
        <KPI icon={IClock} label="Ø über Reise" value={avgDur ? fmtDur(avgDur) : '–'} sub={`${withDur.length} Etappen mit Daten`} />
        <KPI icon={IClock} label="Langsamster Agent" value={dur[slowest] ? slowest : '–'} sub={dur[slowest] ? `${fmtDur(dur[slowest])} · ${Math.round((dur[slowest] / totalSec) * 100)}% der Laufzeit` : 'Keine Daten'} />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : '1fr 1fr', gap: 14 }}>
        <Panel>
          <PanelHeader icon={IGauge} label="Dauer pro Agent" serif="Dieser Run"
            right={<div style={{ textAlign: 'right' }}>
              <div style={{ fontFamily: T.serif, fontSize: 24, fontWeight: 400, letterSpacing: -0.3 }}>{dur.total ? fmtDur(dur.total) : '–'}</div>
              <div style={{ fontSize: 10, color: T.muted, fontFamily: T.mono }}>Σ Gesamtdauer</div>
            </div>} />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 13 }}>
            {agents.map(a => <AgentBar key={a.name} name={a.name} seconds={a.seconds} maxSec={Math.max(...agents.map(x => x.seconds), 1)} />)}
          </div>
        </Panel>

        <Panel>
          <PanelHeader icon={IGauge} label="Zeitanteil pro Agent" serif="Verteilung" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {agents.map(a => {
              const pct = Math.round((a.seconds / totalSec) * 100);
              return (
                <div key={a.name} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{ width: 70, fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 500 }}>{a.name}</div>
                  <div style={{ flex: 1, height: 14, background: T.surfaceAlt, borderRadius: 4, overflow: 'hidden' }}>
                    <div style={{ height: '100%', width: `${pct}%`, background: pct > 50 ? `linear-gradient(90deg, ${T.accent}, ${T.accentDeep})` : T.accent, borderRadius: 4 }} />
                  </div>
                  <div style={{ width: 36, fontFamily: T.mono, fontSize: 11, color: T.muted, textAlign: 'right' }}>{pct}%</div>
                </div>
              );
            })}
          </div>
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.border}` }}>
            <div style={{ fontSize: 11, color: T.muted, fontWeight: 500, marginBottom: 8 }}>Zeitverteilung</div>
            <div style={{ display: 'flex', height: 14, borderRadius: 6, overflow: 'hidden', gap: 2 }}>
              {agents.map((a, i) => {
                const pct = (a.seconds / totalSec) * 100;
                const colors = [T.accent, '#9F6BF5', '#C2A4F8', '#DFCEFA', T.accentDeep];
                return <div key={i} style={{ width: `${Math.max(pct, 1)}%`, background: colors[i] }} />;
              })}
            </div>
          </div>
        </Panel>
      </div>

      <Panel>
        <PanelHeader icon={IGauge} label="Agent-Übersicht" serif="Letzter Run — alle Agenten" />
        <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(3, 1fr)' : 'repeat(5, 1fr)', gap: 14 }}>
          {agents.map(a => {
            const pct = Math.round((a.seconds / totalSec) * 100);
            const colors = { analyst: T.accent, narrator: '#9F6BF5', imagegen: '#C2A4F8', animator: '#DFCEFA', tts: T.accentDeep };
            return (
              <div key={a.name} style={{ background: T.surfaceAlt, borderRadius: 8, padding: 12 }}>
                <div style={{ fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 600, marginBottom: 8 }}>{a.name}</div>
                <div style={{ fontFamily: T.serif, fontSize: 28, fontWeight: 400, color: T.ink, lineHeight: 1, marginBottom: 6 }}>
                  {a.seconds > 0 ? fmtDur(a.seconds) : '–'}
                </div>
                <div style={{ height: 5, background: T.border, borderRadius: 3, overflow: 'hidden', marginBottom: 6 }}>
                  <div style={{ height: '100%', width: `${pct || 2}%`, background: colors[a.name] || T.accent, borderRadius: 3 }} />
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 10, color: T.muted }}>{pct}% der Laufzeit</div>
              </div>
            );
          })}
        </div>
      </Panel>

      <Panel>
        <PanelHeader icon={IGauge} label="Laufzeit pro Etappe" serif="Alle Etappen" />
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: T.sans, fontSize: 12 }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${T.border}` }}>
                {['Kürzel', '#', 'Etappe', 'Gesamt', 'Status', ''].map(h => (
                  <th key={h} style={{ textAlign: 'left', padding: '8px 10px', fontFamily: T.mono, fontSize: 10, color: T.muted, fontWeight: 500, textTransform: 'uppercase', letterSpacing: 0.5 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {data.etappenList.map(e => (
                <tr key={e.id} style={{ borderBottom: `1px solid ${T.border}`, background: e.id === (selectedEtappe?.id ?? data.latestId) ? T.accentSoft : 'transparent' }}>
                  {/* B2: ohne Routenfilter mischt die Liste Routen — das Kürzel je Zeile
                      macht den Wechsel sichtbar. */}
                  <td style={{ padding: '10px' }}>
                    {e.kuerzel
                      ? <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 700, color: T.accentInk, background: T.accentSoft, borderRadius: 4, padding: '2px 7px', whiteSpace: 'nowrap' }}>{e.kuerzel}</span>
                      : <span style={{ fontFamily: T.mono, fontSize: 10, color: T.mutedSoft }}>–</span>}
                  </td>
                  <td style={{ padding: '10px', fontFamily: T.mono, fontSize: 11, color: T.mutedSoft }}>T{e.n} · {e.datum?.slice(5)}</td>
                  <td style={{ padding: '10px', color: T.ink, fontWeight: e.id === (selectedEtappe?.id ?? data.latestId) ? 600 : 400 }}>
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
                      <span>{e.name}</span>
                      {e.nieGelaufen && (
                        <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 600, padding: '2px 6px',
                          borderRadius: 4, background: T.surfaceAlt, color: T.muted, whiteSpace: 'nowrap' }}>nie gelaufen</span>
                      )}
                    </div>
                  </td>
                  <td style={{ padding: '10px', fontFamily: T.mono, fontSize: 12, color: T.ink, fontWeight: 600 }}>{e.dur ? fmtDur(e.dur) : '–'}</td>
                  <td style={{ padding: '10px' }}><Pill state={e.status} label={e.status} /></td>
                  <td style={{ padding: '10px' }}>
                    <div style={{ width: 80, height: 6, background: T.surfaceAlt, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${(e.dur / maxDur) * 100}%`, background: e.dur > maxDur * 0.94 ? T.warn : T.accent, borderRadius: 3 }} />
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Panel>
    </div>
  );
}

// E1: Reliability zeigt nur noch die gewählte Etappe (Retries nach Agent,
// Fehlerliste, Pipeline-Schritte dieses Runs) — die Reise-Aggregate (Erfolgsrate,
// Retries Reise Σ, Retry-Verlauf) wohnen seit E3 in der Übersicht, sonst stünden
// dieselben Zahlen doppelt. „letzte 12 Runs" mischte hier ohnehin schon Bezugsgrößen
// (Wandertag vs. gewählter Run) — pro Etappe gibt es dieses Problem nicht mehr.
function TabReliability({ data, selectedEtappe }) {
  const mobile = useMobile();
  const curE = selectedEtappe || data.etappenList.find(e => e.id === data.latestId);
  const [steps, setSteps] = React.useState([]);
  React.useEffect(() => {
    if (curE?.id) fetchSteps(curE.id).then(setSteps);
    else setSteps([]);
  }, [curE?.id]);

  const agentRows = Object.entries(curE?.retriesByAgent || {})
    .map(([name, retries]) => ({ name, retries }))
    .filter(a => a.retries > 0)
    .sort((a, b) => b.retries - a.retries);
  const maxAgentRetries = Math.max(...agentRows.map(a => a.retries), 1);
  const curTopAgent = agentRows[0];
  const errors = curE?.errors || [];

  // D9: dieselbe Gruppierung wie im EtappeDetailModal (gruppiereSteps) — derselbe
  // Verschluck-Bug (letzte Zeile pro Schritt statt pro Variante) saß hier früher
  // genauso, weil das Panel "same logic as TabProgress" nachbaute. Nur begonnene
  // Schritte: dieses Panel ist Protokoll eines gelaufenen Runs, keine Vorschau.
  const stepGruppen = gruppiereSteps(steps, { zeigeOffene: false });
  const stepsFertig = stepGruppen.filter(g => g.status === 'done' || g.status === 'skipped').length;

  if (!curE) return <Panel><div style={{ color: T.muted, fontSize: 13 }}>Keine Etappe gewählt.</div></Panel>;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)', gap: 14 }}>
        <KPI icon={IShield} label="Retries (dieser Run)"
          value={String(curE.retries ?? 0)}
          sub={curE.retries ? `${curTopAgent ? curTopAgent.name + ' am häufigsten' : ''}` : 'keine Retries'} />
        <KPI icon={IAlert} label="Fehler (dieser Run)"
          value={String(errors.length)}
          sub={fehlerSub(errors)} />
        <KPI icon={IActivity} label="Pipeline-Schritte"
          value={stepGruppen.length ? `${stepsFertig}/${stepGruppen.length}` : '–'}
          sub={stepGruppen.length ? 'fertig / gesamt' : 'kein Protokoll für diesen Run'} />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : '1fr 1fr', gap: 14 }}>
        <Panel>
          <PanelHeader icon={IShield} label="Retries pro Agent" serif={`T${curE.n} · ${curE.name}`} />
          {agentRows.length > 0 ? (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {agentRows.map(a => {
                const pct = (a.retries / maxAgentRetries) * 100;
                return (
                  <div key={a.name}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                      <span style={{ fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 500 }}>{a.name}</span>
                      <span style={{ fontFamily: T.mono, fontSize: 11, color: a.retries > 1 ? T.warn : T.accent }}>{a.retries}</span>
                    </div>
                    <div style={{ height: 8, background: T.surfaceAlt, borderRadius: 4, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${Math.min(pct, 100) || 2}%`, background: a.retries > 1 ? T.warn : T.accent, borderRadius: 4 }} />
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div style={{ fontSize: 12, color: T.mutedSoft, fontStyle: 'italic' }}>Keine Retries in diesem Run.</div>
          )}
        </Panel>

        <Panel>
          <PanelHeader icon={IAlert} label="Fehler" serif={`T${curE.n} · ${curE.name}`} />
          {errors.length > 0 ? (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
              {/* E4: resolved-Flag aus errors[] (add_error(resolved=…) schreibt es) statt
                  pauschal "alle resolved" — vorher stand das da, sobald es überhaupt
                  Fehler gab, egal ob die Telemetrie sie längst als behoben markiert hatte. */}
              {errors.map((err, i) => (
                <div key={i} style={{ padding: 12, background: err.resolved ? T.surfaceAlt : T.errSoft, borderRadius: 8,
                  borderLeft: `3px solid ${err.resolved ? T.mutedSoft : T.err}` }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', gap: 8 }}>
                    <span style={{ fontSize: 12.5, fontWeight: 600, color: T.ink }}>{err.agent || 'Fehler'}</span>
                    <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 600, padding: '1px 6px', borderRadius: 3,
                      background: err.resolved ? T.okSoft : T.errSoft, color: err.resolved ? T.ok : T.err }}>
                      {err.resolved ? 'resolved' : 'offen'}
                    </span>
                  </div>
                  <div style={{ fontSize: 11.5, color: T.muted, marginTop: 4, lineHeight: 1.45, wordBreak: 'break-word' }}>
                    {err.msg || (typeof err === 'string' ? err : JSON.stringify(err))}
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <AllClearCard text="Keine Fehler in diesem Run" />
          )}
        </Panel>
      </div>

      <Panel>
        <PanelHeader icon={IActivity} label="Pipeline-Schritte" serif={`T${curE.n} · ${curE.name}`} />
        {stepGruppen.length > 0 ? (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 0 }}>
            {stepGruppen.map((g, i) => <StepRow key={g.step} gruppe={g} isLast={i === stepGruppen.length - 1} />)}
          </div>
        ) : (
          <div style={{ fontSize: 12, color: T.mutedSoft, fontStyle: 'italic' }}>Keine Protokoll-Zeilen für diesen Run.</div>
        )}
      </Panel>
    </div>
  );
}

// ─── Etappe Detail Modal ──────────────────────────────────────────────────────
function EtappeDetailModal({ etappe, onClose }) {
  const mobile = useMobile();
  const [steps, setSteps] = React.useState([]);
  React.useEffect(() => {
    if (etappe?.id) fetchSteps(etappe.id).then(setSteps);
  }, [etappe?.id]);
  React.useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  if (!etappe) return null;

  const maxCost = Math.max(etappe.llm, etappe.imagegen, etappe.video, etappe.tts, 0.01);
  const costRows = [
    { label: 'LLM',      val: etappe.llm,      color: T.accent },
    { label: 'ImageGen', val: etappe.imagegen,  color: '#9F6BF5' },
    { label: 'Video',    val: etappe.video,     color: '#C2A4F8' },
    { label: 'TTS',      val: etappe.tts,       color: '#DFCEFA' },
  ];
  const maxTiming = Math.max(...Object.values(etappe.timings), 1);
  const runTime = etappe.run_at ? new Date(etappe.run_at).toLocaleString('de-AT', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '–';

  // D9: dieselbe Gruppierung wie im Live-Run-Tab — hier steckte der
  // Verschluck-Bug in derselben Form („same logic as TabProgress"). Nur die
  // nie begonnenen Schritte bleiben weg: dieses Panel ist das Protokoll eines
  // gelaufenen Runs, keine Vorschau auf das, was noch käme.
  const stepGruppen = gruppiereSteps(steps, { zeigeOffene: false });

  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(20,16,28,0.45)', zIndex: 1000,
      display: 'flex', alignItems: mobile ? 'flex-end' : 'center', justifyContent: 'center', padding: mobile ? 0 : 24 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: T.surface,
        borderRadius: mobile ? '16px 16px 0 0' : 16,
        border: `1px solid ${T.border}`, width: '100%', maxWidth: mobile ? '100%' : 680,
        maxHeight: mobile ? '92dvh' : '90vh',
        overflow: 'auto', boxShadow: '0 24px 64px rgba(20,16,28,0.18)' }}>

        {/* Header */}
        <div style={{ padding: mobile ? '16px 16px 14px' : '22px 24px 18px', borderBottom: `1px solid ${T.border}` }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div>
              <div style={{ fontFamily: T.mono, fontSize: 10, color: T.accent, fontWeight: 600,
                textTransform: 'uppercase', letterSpacing: 0.6, marginBottom: 6 }}>
                TAG {etappe.n} · {etappe.datum}
              </div>
              <div style={{ fontFamily: T.serif, fontSize: mobile ? 20 : 26, fontWeight: 400, color: T.ink, lineHeight: 1.1 }}>
                {etappe.name}
              </div>
              {etappe.stimmung && (
                <div style={{ fontSize: 12, color: T.muted, marginTop: 6, fontStyle: 'italic' }}>{etappe.stimmung}</div>
              )}
            </div>
            <div style={{ display: 'flex', gap: 8, flexShrink: 0, flexDirection: mobile ? 'column' : 'row', alignItems: 'flex-end' }}>
              <button onClick={onClose} style={{ background: T.surfaceAlt, border: `1px solid ${T.border}`,
                borderRadius: 8, padding: '6px 12px', cursor: 'pointer', fontFamily: T.sans,
                fontSize: 12, color: T.muted, fontWeight: 500 }}>✕ Schließen</button>
            </div>
          </div>
          <div style={{ display: 'flex', gap: 8, marginTop: 12 }}>
            <Pill state={etappe.status} label={etappe.status} />
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.mutedSoft, alignSelf: 'center' }}>Run: {runTime}</span>
          </div>
        </div>

        <div style={{ padding: mobile ? 16 : 24, display: 'flex', flexDirection: 'column', gap: mobile ? 14 : 20 }}>
          {/* KPI row */}
          <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(3, 1fr)' : 'repeat(3, 1fr)', gap: mobile ? 8 : 12 }}>
            {[
              { label: 'Kosten', value: `€${etappe.cost.toFixed(mobile ? 2 : 3)}`, sub: 'dieser Run' },
              { label: 'Dauer',  value: etappe.dur ? fmtDur(etappe.dur) : '–', sub: etappe.dur ? `${etappe.dur}s` : '' },
              { label: 'Fotos',  value: String(etappe.photos_input || '–'), sub: mobile ? `${etappe.photos_selected} / ${etappe.t2i}` : `${etappe.photos_selected} ausgewählt · ${etappe.t2i} Bilder · ${etappe.clips} Clips` },
            ].map(k => (
              <div key={k.label} style={{ background: T.surfaceAlt, borderRadius: 10, padding: mobile ? '10px 8px' : '14px 16px' }}>

                <div style={{ fontFamily: T.serif, fontSize: mobile ? 20 : 28, fontWeight: 400, color: T.ink, lineHeight: 1 }}>{k.value}</div>

          {(etappe.dauerMin != null || etappe.hoehenmeterAuf != null || etappe.hoehenmeterAb != null) && (
            <div style={{ display: 'flex', gap: mobile ? 12 : 20, flexWrap: 'wrap', fontSize: 12, color: T.muted }}>

              {etappe.hoehenmeterAuf != null && (
                <span>↑ <strong style={{ color: T.ink, fontWeight: 600 }}>{etappe.hoehenmeterAuf} hm</strong></span>
              )}
              {etappe.hoehenmeterAb != null && (
                <span>↓ <strong style={{ color: T.ink, fontWeight: 600 }}>{etappe.hoehenmeterAb} hm</strong></span>
              )}
              {etappe.blogUrl && (
                <a href={etappe.blogUrl} target="_blank" rel="noopener noreferrer" style={{ color: T.accent, textDecoration: 'none' }}>
                  Blog-Beitrag ↗
                </a>
              )}
            </div>
          )}

          {/* Costs + Timings side by side */}
          <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : '1fr 1fr', gap: 16 }}>
            <div>
              <div style={{ fontSize: 12, fontWeight: 600, color: T.ink, marginBottom: 12 }}>Kosten-Breakdown</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {costRows.map(r => (
                  <div key={r.label}>
