// ─── Platform cost split ──────────────────────────────────────────────────────
// WaveSpeed t2i Seedream ~$0.030/Bild × ~0.88 EUR/USD ≈ €0.0264/Bild
// Alles andere in imagegen_eur → Atlas (hero_bild Nano Banana 2)
// video_eur ist komplett Atlas
const WAVESPEED_EUR_PER_T2I = 0.030 * 0.88;
function platformCosts(e) {
  const wavespeed = Math.round((e.t2i_count || 0) * WAVESPEED_EUR_PER_T2I * 10000) / 10000;
  const atlas     = Math.max(0, Math.round(((e.cost_imagegen_eur || 0) - wavespeed + (e.cost_video_eur || 0)) * 10000) / 10000);
  return { wavespeed, atlas };
}

const SUPABASE_URL = 'https://rgwbmqlcxxrynufcmwqx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_F-ZIctvp3JyhpVGNXbMttw_9vc7tdtH';
const FUNCTIONS_URL = SUPABASE_URL + '/functions/v1';

// ─── Data loading ─────────────────────────────────────────────────────────────
async function fetchEtappen() {
  const cols = [
    'id','datum','tag_nr','etappen_nr','tagesueberschrift','erzaehl_stimmung',
    'startort','zielort','pipeline_status','route_id',

  ].join(',');

async function patchEtappe(id, fields) {

  });
}

function fmtDur(s) {
  if (!s) return '–';
  const m = Math.floor(s / 60);
  const sec = Math.round(s % 60);
  return m ? `${m}:${String(sec).padStart(2, '0')} Min` : `${s}s`;
}

// Trend aus einer Zeitreihe: vergleicht jüngere vs. ältere Hälfte.
// dir 'up' = steigend (rot), 'down'/'stabil' = fallend/gleich (grün).
function trendInfo(series) {
  const pts = (series || []).filter(v => typeof v === 'number');
  if (pts.length < 4) return { dir: 'down', val: 'stabil', pct: 0 };
  const half = Math.floor(pts.length / 2);
  const avg = a => a.reduce((s, x) => s + x, 0) / (a.length || 1);
  const o = avg(pts.slice(0, half));
  const r = avg(pts.slice(half));
  if (o === 0) return { dir: r > 0 ? 'up' : 'down', val: r > 0 ? 'neu' : 'stabil', pct: 0 };
  const pct = Math.round(((r - o) / o) * 100);
  if (Math.abs(pct) < 8) return { dir: 'down', val: 'stabil', pct };
  return { dir: pct > 0 ? 'up' : 'down', val: `${pct > 0 ? '+' : ''}${pct}%`, pct };
}

function etappeName(e) {
  if (e.startort && e.zielort) return `${e.startort} → ${e.zielort}`;
  return e.tagesueberschrift || `Etappe ${e.tag_nr || e.etappen_nr || '?'}`;
}

function routeLabel(id) {
  const m = {
    via_de_la_plata:  'Via de la Plata',
    camino_frances:   'Camino Francés',
    camino_aleman:    'Camino Alemán',
    via_francigena:   'Via Francigena',
    camino_del_norte: 'Camino del Norte',
    camino_portugues: 'Camino Portugués',
  };
  return m[id] || (id ? id.replace(/_/g, ' ') : '–');
}

function statusMap(s) {
  if (s === 'publiziert') return 'success';
  if (s === 'fehler' || s === 'error' || s === 'fehlgeschlagen') return 'error';
  return 'partial';
}

function transformData(rows, routeMap = {}) {
  if (!rows || !rows.length) return null;

  const valid = rows.filter(e => e.datum);
  if (!valid.length) return null;

  // Letzte verarbeitete Etappe (by run_at), nicht die mit dem neuesten Datum
  const withRunAt = valid.filter(e => e.run_at);
  const latest = withRunAt.length
    ? withRunAt.reduce((a, b) => (a.run_at > b.run_at ? a : b))
    : valid[0];
  const chronological = [...valid].reverse();

  const etappenList = chronological.map(e => ({
    id:        e.id,
    n:         e.tag_nr || 0,
    name:      etappeName(e),
    datum:     e.datum || '',
    route:     e.route_id || '',
    kuerzel:   routeMap[e.route_id]?.kuerzel || '',
    routeName: routeMap[e.route_id]?.name || '',
    stimmung:  e.erzaehl_stimmung || '',
    headline: e.tagesueberschrift || '',
    status:   statusMap(e.pipeline_status),
    run_at:   e.run_at || null,
    cost:     e.cost_total_eur    || 0,
    llm:      e.cost_llm_eur      || 0,
    imagegen: e.cost_imagegen_eur || 0,
    video:    e.cost_video_eur    || 0,
    tts:      e.cost_tts_eur      || 0,
    wavespeed: platformCosts(e).wavespeed,
    atlas:     platformCosts(e).atlas,
    dur:      e.duration_total_s  || 0,
    timings:  e.agent_timings_s   || {},
    photos_input:    e.photos_input    || 0,
    photos_selected: e.photos_selected || 0,
    t2i:      e.t2i_count   || 0,
    clips:    e.video_count || 0,
    retries:  Object.values(e.retries || {}).reduce((a, b) => a + b, 0),
    retriesByAgent: e.retries || {},
    errors:   e.errors || [],
    publishedPlatforms: e.published_platforms || [],
  }));

  const trend28 = valid.slice(0, 28).map(e => e.cost_total_eur || 0).reverse();
  const retryHistory = valid.slice(0, 12).map(e =>
    Object.values(e.retries || {}).reduce((a, b) => a + b, 0)
  ).reverse();

  const timings = latest.agent_timings_s || {};
  const latestRouteId = latest.route_id || null;
  const routeEtappen  = latestRouteId ? valid.filter(e => e.route_id === latestRouteId) : valid;
  const tripTotal     = Math.round(routeEtappen.reduce((s, e) => s + (e.cost_total_eur || 0), 0) * 100) / 100;
  const tripKuerzel   = routeMap[latestRouteId]?.kuerzel || '';
  const tripEtappenCount = routeEtappen.filter(e => e.cost_total_eur > 0).length;
  const runTime = latest.run_at ? latest.run_at.slice(11, 16) : '–';

  return {
    etappe:          latest.tag_nr || 0,
    name:            etappeName(latest),
    date:            latest.datum || '–',
    time:            runTime,
    status:          statusMap(latest.pipeline_status),
    coreTheme:       latest.tagesueberschrift || '',
    erzaehlStimmung: latest.erzaehl_stimmung || '',
    costs: {
      total:     latest.cost_total_eur    || 0,
      llm:       latest.cost_llm_eur      || 0,
      imagegen:  latest.cost_imagegen_eur || 0,
      video:     latest.cost_video_eur    || 0,
      tts:       latest.cost_tts_eur      || 0,
      wavespeed: platformCosts(latest).wavespeed,
      atlas:     platformCosts(latest).atlas,
    },
    tripTotal,
    tripKuerzel,
    tripEtappenCount,
    duration: {
      total:    latest.duration_total_s || 0,
      analyst:  timings.analyst   || 0,
      narrator: timings.narrator  || 0,
      imagegen: timings.imagegen  || 0,
      animator: timings.animator  || 0,
      tts:      timings.tts       || 0,
    },
    latestId:     latest.id,
    retries:      latest.retries || {},
    retriesTotal: Object.values(latest.retries || {}).reduce((a, b) => a + b, 0),
    errors:       latest.errors  || [],
    photos: {
      input:    latest.photos_input    || 0,
      selected: latest.photos_selected || 0,
    },
    publishedPlatforms: latest.published_platforms || [],
    trend28,
    retryHistory,
    durationHistory: {
      imagegen: valid.slice(0, 12).map(e => (e.agent_timings_s || {}).imagegen || 0).reverse(),
    },
    etappenList,
  };
}

// ─── Reliability aus Echtdaten ────────────────────────────────────────────────
// Aggregiert Retries/Fehler aus den geladenen Etappen. Keine Platzhalterwerte:
// Wo nichts vorliegt, liefert die Funktion leere Listen → UI zeigt sauberen Zustand.
function reliabilityStats(data) {
  const list = data.etappenList || [];
  const recent = list.slice(-12);
  const n = recent.length;
  const avg = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;

  const byAgent = {};
  recent.forEach(e => Object.entries(e.retriesByAgent || {}).forEach(([k, v]) => {
    byAgent[k] = (byAgent[k] || 0) + (v || 0);
  }));
  const agentRows = Object.entries(byAgent)
    .map(([name, retries]) => ({ name, retries, total: n }))
    .sort((a, b) => b.retries - a.retries);

  const recentRetries = recent.reduce((s, e) => s + e.retries, 0);
  const tripRetries   = list.reduce((s, e) => s + e.retries, 0);
  const ran           = list.filter(e => e.cost > 0 || e.dur > 0);
  const runsWithError = ran.filter(e => (e.errors?.length || 0) > 0).length;
  const successRate   = ran.length ? Math.round(((ran.length - runsWithError) / ran.length) * 100) : 100;

  const imgSeries = recent.map(e => e.retriesByAgent?.imagegen || 0);
  const imgTrend  = trendInfo(imgSeries);
  const half      = Math.floor(imgSeries.length / 2) || 1;
  const imgStart  = avg(imgSeries.slice(0, half));
  const imgEnd    = avg(imgSeries.slice(half));

  // Echte Ereignisse: Fehler aus allen Etappen + ggf. eine berechnete Frühwarnung
  const events = [];
  list.forEach(e => (e.errors || []).forEach(err => events.push({
    kind: 'error', etappe: e,
    title: err.agent ? `${err.agent} · Fehler` : 'Fehler',
    detail: err.msg || (typeof err === 'string' ? err : JSON.stringify(err)),
  })));
  if (imgTrend.dir === 'up' && n >= 4) {
    events.unshift({
      kind: 'warn', etappe: null,
      title: 'imagegen: Retry-Rate erhöht',
      detail: `Über die letzten ${n} Runs steigt die imagegen-Retry-Rate von Ø ${imgStart.toFixed(1)} auf ${imgEnd.toFixed(1)} (${imgTrend.val}).`,
    });
  }

  return { agentRows, recentRetries, tripRetries, successRate, runsWithError,
    ranCount: ran.length, imgSeries, imgTrend, imgStart, imgEnd, events,
    warnings: events.length, recentCount: n };
}

function AreaChart({ points, h = 60, accent, id }) {
  const col = accent || T.accent;
  const gid = `g-${id || Math.random().toString(36).slice(2)}`;
  const max = Math.max(...points);
  const min = Math.min(...points);
  const range = max - min || 1;
  const w = 300;
  const step = points.length > 1 ? w / (points.length - 1) : w;
  const toY = v => 6 + (1 - (v - min) / range) * (h - 12);
  const line = points.map((p, i) => `${i === 0 ? 'M' : 'L'}${(i * step).toFixed(1)},${toY(p).toFixed(1)}`).join(' ');
  const area = `${line} L${w},${h} L0,${h} Z`;
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: '100%', height: h, display: 'block' }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={col} stopOpacity="0.28" />
          <stop offset="100%" stopColor={col} stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${gid})`} />
      <path d={line} fill="none" stroke={col} strokeWidth="2" vectorEffect="non-scaling-stroke" />
      <circle cx={(points.length - 1) * step} cy={toY(points[points.length - 1])} r="3.5" fill={col} stroke={T.surface} strokeWidth="2" />
    </svg>
  );
}

function BarChart({ values, h = 90, colorFn }) {
  const max = Math.max(...values, 1);
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', gap: 6, height: h }}>
      {values.map((v, i) => (
        <div key={i} style={{ flex: 1, height: `${Math.max((v / max) * 100, 4)}%`,
          background: colorFn ? colorFn(v, i) : T.accent,
          borderRadius: '4px 4px 2px 2px' }} />
      ))}
    </div>
  );
}

function TabKosten({ data, selectedEtappe }) {
  const mobile = useMobile();
  const [sortBy, setSortBy] = React.useState('datum');
  const [sortDir, setSortDir] = React.useState('asc');
  const [selected, setSelected] = React.useState(null);

  const curE = selectedEtappe || data.etappenList.find(e => e.id === data.latestId);
  const ct = curE?.cost || 1;
  const costPct = k => ct > 0 ? Math.round(((curE?.[k] || 0) / ct) * 100) : 0;
  const withCost = data.etappenList.filter(e => e.cost > 0);
  const teuerste = withCost.length ? withCost.reduce((max, e) => e.cost > max.cost ? e : max) : null;
  const maxCost = Math.max(...data.etappenList.map(x => x.cost), 0.01);
  const costTrend = trendInfo(data.trend28);

  const toggleSort = (col) => {
    if (sortBy === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortBy(col); setSortDir(col === 'datum' || col === 'n' ? 'asc' : 'desc'); }
  };

  const sorted = [...data.etappenList].sort((a, b) => {
    let v;
    if      (sortBy === 'datum')   v = a.datum.localeCompare(b.datum);
    else if (sortBy === 'n')       v = a.n - b.n;
    else if (sortBy === 'cost')    v = a.cost - b.cost;
    else if (sortBy === 'llm')     v = a.llm - b.llm;
    else if (sortBy === 'imagegen')v = a.imagegen - b.imagegen;
    else if (sortBy === 'video')   v = a.video - b.video;
    else if (sortBy === 'tts')     v = a.tts - b.tts;
    else if (sortBy === 'route')   v = (a.kuerzel || a.route).localeCompare(b.kuerzel || b.route);
    else v = 0;
    return sortDir === 'asc' ? v : -v;
  });

  const SortTh = ({ col, children }) => {
    const active = sortBy === col;
    return (
      <th onClick={() => toggleSort(col)} style={{ textAlign: 'left', padding: '8px 10px', cursor: 'pointer',
        fontFamily: T.mono, fontSize: 10, color: active ? T.accent : T.muted,
        fontWeight: active ? 700 : 500, textTransform: 'uppercase', letterSpacing: 0.5,
        userSelect: 'none', whiteSpace: 'nowrap' }}>
        {children} {active ? (sortDir === 'asc' ? '↑' : '↓') : <span style={{ opacity: 0.3 }}>↕</span>}
      </th>
    );
  };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)', gap: 14 }}>

        <KPI icon={IEuro} label={`Kosten${data.tripKuerzel ? ' ' + data.tripKuerzel : ' Reise'}`} value={`€${data.tripTotal.toFixed(2)}`} sub={`${data.tripEtappenCount} Runs · Ø €${data.tripEtappenCount ? (data.tripTotal / data.tripEtappenCount).toFixed(2) : '–'}`} />
        <KPI icon={IEuro} label="Teuerste Etappe" value={teuerste ? `€${teuerste.cost.toFixed(2)}` : '–'} sub={teuerste ? `${teuerste.kuerzel || ''} T${teuerste.n} · ${teuerste.name}`.trim() : 'Keine Daten'} />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : '1.4fr 1fr', gap: 14 }}>
        <Panel>
          <PanelHeader icon={ICoins} label="Kosten-Trend" serif={`${data.trend28.length} Runs Verlauf`}
            right={<TrendBadge dir={costTrend.dir} val={costTrend.val} />} />
          <AreaChart points={data.trend28} h={120} id="k-trend" />
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontFamily: T.mono, fontSize: 10, color: T.mutedSoft }}>

          </div>
        </Panel>

        <Panel>
          <PanelHeader icon={ICoins} label="Breakdown heute" serif="Pro Kategorie" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
            <CostBar name="LLM"      value={`€${(curE?.llm || 0).toFixed(2)}`}      pct={costPct('llm')}      color={T.accent} />
            <CostBar name="ImageGen" value={`€${(curE?.imagegen || 0).toFixed(2)}`} pct={costPct('imagegen')} color="#9F6BF5" />
            <CostBar name="Video"    value={`€${(curE?.video || 0).toFixed(2)}`}     pct={costPct('video')}    color="#C2A4F8" />
            <CostBar name="TTS"      value={`€${(curE?.tts || 0).toFixed(2)}`}       pct={costPct('tts')}      color="#DFCEFA" />
          </div>
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.border}` }}>
            <div style={{ fontSize: 11, color: T.muted, fontWeight: 500, marginBottom: 10 }}>Anteil pro Kategorie</div>
            <div style={{ display: 'flex', height: 12, borderRadius: 6, overflow: 'hidden', gap: 2 }}>
              {[{ k: 'llm', c: T.accent }, { k: 'imagegen', c: '#9F6BF5' }, { k: 'video', c: '#C2A4F8' }, { k: 'tts', c: '#DFCEFA' }].map((s, i) => (
                <div key={i} style={{ width: `${costPct(s.k) || 1}%`, background: s.c, borderRadius: i === 0 ? '6px 0 0 6px' : i === 3 ? '0 6px 6px 0' : 0 }} />
              ))}
            </div>
          </div>
        </Panel>
      </div>

      <Panel>
        <PanelHeader icon={ICoins} label="Kosten pro Etappe" serif="Alle Etappen im Vergleich" />
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: T.sans, fontSize: 12 }}>

                <SortTh col="cost">Kosten</SortTh>
                <SortTh col="llm">LLM</SortTh>
                <SortTh col="imagegen">ImageGen</SortTh>
                <SortTh col="video">Video</SortTh>
                <SortTh col="tts">TTS</SortTh>

            <tbody>
              {sorted.map(e => {
                return (

                    style={{ borderBottom: `1px solid ${T.border}`,

}

function TabPerformance({ data, selectedEtappe }) {
  const mobile = useMobile();
  const curE = selectedEtappe || data.etappenList.find(e => e.id === data.latestId);
  const dur = {
    total:    curE?.dur                  || 0,
    analyst:  curE?.timings?.analyst  || 0,
    narrator: curE?.timings?.narrator || 0,
    imagegen: curE?.timings?.imagegen || 0,
    animator: curE?.timings?.animator || 0,
    tts:      curE?.timings?.tts      || 0,
  };
  const totalSec = dur.total || 1;
  const withDur = data.etappenList.filter(e => e.dur > 0);
  const avgDur = withDur.length ? Math.round(withDur.reduce((s, e) => s + e.dur, 0) / withDur.length) : 0;
  const agentKeys = ['analyst', 'narrator', 'imagegen', 'animator', 'tts'];
  const slowest = agentKeys.reduce((max, k) => dur[k] > dur[max] ? k : max, agentKeys[0]);
  const agents = agentKeys.map(k => ({ name: k, seconds: dur[k] || 0 }));

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)', gap: 14 }}>
        <KPI icon={IClock} label="Gesamtdauer" value={dur.total ? fmtDur(dur.total) : '–'} sub={dur.total ? `${dur.total}s` : 'Keine Daten'} />
        <KPI icon={IClock} label="Ø über Reise" value={avgDur ? fmtDur(avgDur) : '–'} sub={`${withDur.length} Etappen mit Daten`} />
        <KPI icon={IClock} label="Langsamster Agent" value={dur[slowest] ? slowest : '–'} sub={dur[slowest] ? `${fmtDur(dur[slowest])} · ${Math.round((dur[slowest] / totalSec) * 100)}% der Laufzeit` : 'Keine Daten'} />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : '1fr 1fr', gap: 14 }}>
        <Panel>
          <PanelHeader icon={IGauge} label="Dauer pro Agent" serif="Dieser Run"
            right={<div style={{ textAlign: 'right' }}>
              <div style={{ fontFamily: T.serif, fontSize: 24, fontWeight: 400, letterSpacing: -0.3 }}>{dur.total ? fmtDur(dur.total) : '–'}</div>
              <div style={{ fontSize: 10, color: T.muted, fontFamily: T.mono }}>Σ Gesamtdauer</div>
            </div>} />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 13 }}>
            {agents.map(a => <AgentBar key={a.name} name={a.name} seconds={a.seconds} maxSec={Math.max(...agents.map(x => x.seconds), 1)} />)}
          </div>
        </Panel>

        <Panel>
          <PanelHeader icon={IGauge} label="Zeitanteil pro Agent" serif="Verteilung" />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
            {agents.map(a => {
              const pct = Math.round((a.seconds / totalSec) * 100);
              return (
                <div key={a.name} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <div style={{ width: 70, fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 500 }}>{a.name}</div>
                  <div style={{ flex: 1, height: 14, background: T.surfaceAlt, borderRadius: 4, overflow: 'hidden' }}>
                    <div style={{ height: '100%', width: `${pct}%`, background: pct > 50 ? `linear-gradient(90deg, ${T.accent}, ${T.accentDeep})` : T.accent, borderRadius: 4 }} />
                  </div>
                  <div style={{ width: 36, fontFamily: T.mono, fontSize: 11, color: T.muted, textAlign: 'right' }}>{pct}%</div>
                </div>
              );
            })}
          </div>
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.border}` }}>
            <div style={{ fontSize: 11, color: T.muted, fontWeight: 500, marginBottom: 8 }}>Zeitverteilung</div>
            <div style={{ display: 'flex', height: 14, borderRadius: 6, overflow: 'hidden', gap: 2 }}>
              {agents.map((a, i) => {
                const pct = (a.seconds / totalSec) * 100;
                const colors = [T.accent, '#9F6BF5', '#C2A4F8', '#DFCEFA', T.accentDeep];
                return <div key={i} style={{ width: `${Math.max(pct, 1)}%`, background: colors[i] }} />;
              })}
            </div>
          </div>
        </Panel>
      </div>

      <Panel>
        <PanelHeader icon={IGauge} label="Agent-Übersicht" serif="Letzter Run — alle Agenten" />
        <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(3, 1fr)' : 'repeat(5, 1fr)', gap: 14 }}>
          {agents.map(a => {
            const pct = Math.round((a.seconds / totalSec) * 100);
            const colors = { analyst: T.accent, narrator: '#9F6BF5', imagegen: '#C2A4F8', animator: '#DFCEFA', tts: T.accentDeep };
            return (
              <div key={a.name} style={{ background: T.surfaceAlt, borderRadius: 8, padding: 12 }}>
                <div style={{ fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 600, marginBottom: 8 }}>{a.name}</div>
                <div style={{ fontFamily: T.serif, fontSize: 28, fontWeight: 400, color: T.ink, lineHeight: 1, marginBottom: 6 }}>
                  {a.seconds > 0 ? fmtDur(a.seconds) : '–'}
                </div>
                <div style={{ height: 5, background: T.border, borderRadius: 3, overflow: 'hidden', marginBottom: 6 }}>
                  <div style={{ height: '100%', width: `${pct || 2}%`, background: colors[a.name] || T.accent, borderRadius: 3 }} />
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 10, color: T.muted }}>{pct}% der Laufzeit</div>
              </div>
            );
          })}
        </div>
      </Panel>

      <Panel>
        <PanelHeader icon={IGauge} label="Laufzeit pro Etappe" serif="Alle Etappen" />
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: T.sans, fontSize: 12 }}>
            <thead>
              <tr style={{ borderBottom: `1px solid ${T.border}` }}>
                {['#', 'Etappe', 'Gesamt', 'Status', ''].map(h => (
                  <th key={h} style={{ textAlign: 'left', padding: '8px 10px', fontFamily: T.mono, fontSize: 10, color: T.muted, fontWeight: 500, textTransform: 'uppercase', letterSpacing: 0.5 }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {data.etappenList.map(e => (
                <tr key={e.id} style={{ borderBottom: `1px solid ${T.border}`, background: e.id === (selectedEtappe?.id ?? data.latestId) ? T.accentSoft : 'transparent' }}>
                  <td style={{ padding: '10px', fontFamily: T.mono, fontSize: 11, color: T.mutedSoft }}>T{e.n} · {e.datum?.slice(5)}</td>
                  <td style={{ padding: '10px', color: T.ink, fontWeight: e.id === (selectedEtappe?.id ?? data.latestId) ? 600 : 400 }}>{e.name}</td>
                  <td style={{ padding: '10px', fontFamily: T.mono, fontSize: 12, color: T.ink, fontWeight: 600 }}>{e.dur ? fmtDur(e.dur) : '–'}</td>
                  <td style={{ padding: '10px' }}><Pill state={e.status} label={e.status} /></td>
                  <td style={{ padding: '10px' }}>
                    <div style={{ width: 80, height: 6, background: T.surfaceAlt, borderRadius: 3, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${(e.dur / 850) * 100}%`, background: e.dur > 800 ? T.warn : T.accent, borderRadius: 3 }} />
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Panel>
    </div>
  );
}

function TabReliability({ data, selectedEtappe }) {
  const mobile = useMobile();
  const rel = reliabilityStats(data);
  const curE = selectedEtappe || data.etappenList.find(e => e.id === data.latestId);
  const retryTrend = trendInfo(data.retryHistory);
  const avgRetry = rel.recentCount ? rel.recentRetries / rel.recentCount : 0;
  const curByAgent = curE?.retriesByAgent || {};
  const curTopAgent = Object.entries(curByAgent).sort((a, b) => b[1] - a[1])[0];
  const retryEtappen = data.etappenList.filter(e => e.retries > 0);
  const showImgTrend = rel.imgSeries.some(v => v > 0);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)', gap: 14 }}>
        <KPI icon={IShield} label="Retries (gewählter Run)"
          value={String(curE?.retries ?? 0)}
          sub={curE?.retries
            ? `${curTopAgent ? curTopAgent[0] + ' · ' : ''}${(curE?.errors?.length || 0) ? curE.errors.length + ' Fehler' : 'alle resolved'}`
            : 'keine Retries'} />
        <KPI icon={IShield} label="Retries Reise Σ"
          value={String(rel.tripRetries)}
          sub={`${rel.recentCount} Runs · Ø ${avgRetry.toFixed(1)} / Run`}
          trend={retryTrend.val !== 'stabil' ? { dir: retryTrend.dir, v: retryTrend.val } : undefined} />
        <KPI icon={IShield} label="Erfolgsrate"
          value={`${rel.successRate}%`}
          sub={rel.runsWithError ? `${rel.runsWithError} Run${rel.runsWithError === 1 ? '' : 's'} mit Fehler` : '0 Fehler'} />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : '1.2fr 1fr', gap: 14 }}>
        <Panel>
          <PanelHeader icon={IShield} label="Retry-Verlauf" serif={`Letzte ${data.retryHistory.length} Runs`} />
          <BarChart values={data.retryHistory} h={120}
            colorFn={(v) => v > 1 ? `linear-gradient(180deg, ${T.warn}, ${T.warn}cc)` : v > 0 ? T.accent : T.surfaceAlt} />
          <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 8, fontFamily: T.mono, fontSize: 10, color: T.mutedSoft }}>
            {data.etappenList.slice(-data.retryHistory.length).map(e => <span key={e.id} style={{ flex: 1, textAlign: 'center' }}>{e.n}</span>)}
          </div>
          <div style={{ marginTop: 14, paddingTop: 14, borderTop: `1px solid ${T.border}`, display: 'flex', gap: 16 }}>
            {[{ color: T.accent, label: '1 Retry' }, { color: T.warn, label: '2+ Retries' }, { color: T.surfaceAlt, label: 'Kein Retry' }].map(l => (
              <div key={l.label} style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                <div style={{ width: 10, height: 10, borderRadius: 2, background: l.color, border: `1px solid ${T.border}` }} />
                <span style={{ fontSize: 11, color: T.muted, fontFamily: T.sans }}>{l.label}</span>
              </div>
            ))}
          </div>
        </Panel>

        <Panel>
          <PanelHeader icon={IShield} label="Retries pro Agent" serif="Häufigkeit" />
          {rel.agentRows.length > 0 ? (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
              {rel.agentRows.map(a => {
                const pct = a.total ? (a.retries / a.total) * 100 : 0;
                return (
                  <div key={a.name}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                      <span style={{ fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 500 }}>{a.name}</span>
                      <span style={{ fontFamily: T.mono, fontSize: 11, color: a.retries > 0 ? T.warn : T.mutedSoft }}>
                        {a.retries} / {a.total}
                      </span>
                    </div>
                    <div style={{ height: 8, background: T.surfaceAlt, borderRadius: 4, overflow: 'hidden' }}>
                      <div style={{ height: '100%', width: `${pct || 2}%`, background: a.retries > 1 ? T.warn : a.retries > 0 ? T.accent : T.surfaceAlt, borderRadius: 4 }} />
                    </div>
                  </div>
                );
              })}
            </div>
          ) : (
            <div style={{ fontSize: 12, color: T.mutedSoft, fontStyle: 'italic' }}>Keine Retries in den letzten {rel.recentCount} Runs.</div>
          )}
          {showImgTrend && (
            <div style={{ marginTop: 16, paddingTop: 14, borderTop: `1px solid ${T.border}` }}>
              <div style={{ fontSize: 11, color: T.muted, fontWeight: 500, marginBottom: 4 }}>Trend imagegen</div>
              <AreaChart points={rel.imgSeries} h={36} accent={T.warn} id="rel-img-trend" />
              <div style={{ marginTop: 6, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <span style={{ fontFamily: T.mono, fontSize: 10, color: T.muted }}>Ø {rel.imgStart.toFixed(1)} → {rel.imgEnd.toFixed(1)}</span>
                <TrendBadge dir={rel.imgTrend.dir} val={rel.imgTrend.val} />
              </div>
            </div>
          )}
        </Panel>
      </div>

      <Panel>
        <PanelHeader icon={IAlert} label="Ereignisse" serif="Alle Fehler & Warnungen" />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {rel.events.length > 0
            ? rel.events.map((ev, i) => <EventCard key={i} ev={ev} />)
            : <AllClearCard text="Keine Fehler oder Warnungen" />}

          {retryEtappen.length > 0 && (
            <div style={{ fontSize: 11, color: T.mutedSoft, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5, marginTop: 4 }}>
              Retries (resolved)
            </div>
          )}
          {retryEtappen.map(e => (
            <div key={e.id} style={{ padding: 14, background: T.surface, border: `1px solid ${T.border}`, borderRadius: 8 }}>
              <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
                <div style={{ width: 28, height: 28, borderRadius: 6, background: T.surfaceAlt, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, fontFamily: T.mono, fontSize: 11, color: T.muted, fontWeight: 600 }}>T{e.n}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 12.5, color: T.ink, fontWeight: 500 }}>{e.name}</div>
                  <div style={{ fontSize: 11, color: T.muted, marginTop: 2 }}>{e.retries} Retr{e.retries === 1 ? 'y' : 'ies'} · alle resolved</div>
                </div>
                <Pill state={e.retries > 1 ? 'warn' : 'ok'} label={`${e.retries} Retr${e.retries === 1 ? 'y' : 'ies'}`} />
              </div>
            </div>
          ))}
        </div>
      </Panel>
    </div>
  );
}

// ─── Etappe Detail Modal ──────────────────────────────────────────────────────
function EtappeDetailModal({ etappe, onClose }) {
  const mobile = useMobile();
  const [steps, setSteps] = React.useState([]);
  React.useEffect(() => {
    if (etappe?.id) fetchSteps(etappe.id).then(setSteps);
  }, [etappe?.id]);
  React.useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  if (!etappe) return null;

  const maxCost = Math.max(etappe.llm, etappe.imagegen, etappe.video, etappe.tts, 0.01);
  const costRows = [
    { label: 'LLM',      val: etappe.llm,      color: T.accent },
    { label: 'ImageGen', val: etappe.imagegen,  color: '#9F6BF5' },
    { label: 'Video',    val: etappe.video,     color: '#C2A4F8' },
    { label: 'TTS',      val: etappe.tts,       color: '#DFCEFA' },
  ];
  const maxTiming = Math.max(...Object.values(etappe.timings), 1);
  const runTime = etappe.run_at ? new Date(etappe.run_at).toLocaleString('de-AT', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }) : '–';

  // latest step per agent (same logic as TabProgress)
  const grouped = {};
  steps.forEach(s => { if (!grouped[s.step]) grouped[s.step] = []; grouped[s.step].push(s); });

const PROGRESS_UNIT = {
  analyst:  (c, t) => `Foto ${c} von ${t}`,
  selektor: (c, t) => `Foto ${c} von ${t}`,
  imagegen: (c, t) => `Bild ${c} von ${t}`,
  animator: (c, t) => `Clip ${c} von ${t}`,
  audio:    (c, t) => `Spur ${c} von ${t}`,
};

function parsePhotoProgress(detail) {
  if (!detail) return null;
  const m = detail.match(/(\d+)\s*\/\s*(\d+)/);
  if (!m) return null;
  const current = parseInt(m[1], 10);
  const total   = parseInt(m[2], 10);
  if (total === 0 || current > total + 1) return null;
  return { current, total };
}

function StepRow({ step, isLast }) {
  const statusStyle = {
    running: { dot: T.accent, label: 'läuft…', bg: T.accentSoft, fg: T.accentInk },
    done:    { dot: T.ok,     label: 'fertig',  bg: T.okSoft,     fg: T.ok },
    error:   { dot: T.err,    label: 'Fehler',  bg: T.errSoft,    fg: T.err },
    skipped: { dot: T.mutedSoft, label: 'übersprungen', bg: T.surfaceAlt, fg: T.muted },
  }[step.status] || { dot: T.muted, label: step.status, bg: T.surfaceAlt, fg: T.muted };

  const ts       = step.ts ? new Date(step.ts).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) : '';
  const desc     = STEP_DESCRIPTIONS[step.step];
  const progress = parsePhotoProgress(step.detail);
  const showDesc = desc && (step.status === 'running' || step.status === 'done');
  const unitFn   = PROGRESS_UNIT[step.step];
  const progressLabel = progress && unitFn ? unitFn(progress.current, progress.total) : progress ? `${progress.current} von ${progress.total}` : null;

  return (
    <div style={{ display: 'flex', gap: 16, position: 'relative' }}>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', flexShrink: 0, width: 20 }}>
        <div style={{
          width: 12, height: 12, borderRadius: '50%', background: statusStyle.dot,
          flexShrink: 0, marginTop: 4,
          boxShadow: step.status === 'running' ? `0 0 0 4px ${T.accentSoft}` : 'none',
        }} />
        {!isLast && <div style={{ width: 2, flex: 1, background: T.border, marginTop: 4 }} />}
      </div>
      <div style={{ flex: 1, paddingBottom: isLast ? 0 : 22 }}>
        {/* Name + badge + timestamp */}
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: showDesc || step.detail ? 6 : 0 }}>
          <span style={{ fontSize: 13, fontWeight: 600, color: T.ink }}>
            {STEP_LABELS[step.step] || step.step}
          </span>
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, padding: '2px 8px',
            background: statusStyle.bg, color: statusStyle.fg,
            fontFamily: T.mono, fontSize: 10, fontWeight: 600, borderRadius: 4 }}>
            {statusStyle.label}
          </span>
          <span style={{ fontFamily: T.mono, fontSize: 10, color: T.mutedSoft, marginLeft: 'auto' }}>{ts}</span>
        </div>

        {/* 1-2 sentence description */}
        {showDesc && (
          <div style={{ fontSize: 12, color: T.mutedSoft, lineHeight: 1.55, marginBottom: step.detail ? 8 : 0 }}>
            {desc}
          </div>
        )}

        {/* Photo / image progress */}
        {step.detail && progress ? (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 5 }}>
              <span style={{ fontFamily: T.mono, fontSize: 11.5, color: T.ink, fontWeight: 500 }}>
                {progressLabel}
              </span>
              <span style={{ fontFamily: T.mono, fontSize: 10, color: T.mutedSoft }}>
                {Math.round((progress.current / progress.total) * 100)}%
              </span>
            </div>
            <div style={{ height: 5, background: T.surfaceAlt, borderRadius: 3, overflow: 'hidden' }}>
              <div style={{ height: '100%', width: `${(progress.current / progress.total) * 100}%`,
                background: step.status === 'done' ? T.ok : T.accent,
                borderRadius: 3, transition: 'width 0.4s ease' }} />
            </div>
            {/* raw detail as subtitle */}
            <div style={{ fontSize: 11, color: T.mutedSoft, fontFamily: T.mono, marginTop: 4 }}>{step.detail}</div>
          </div>
        ) : step.detail ? (
          <div style={{ fontSize: 12, color: T.muted, fontFamily: T.mono }}>{step.detail}</div>
        ) : null}
      </div>
    </div>
  );
}

function TabProgress({ steps, onRefresh, latestEtappe }) {
  const { useState: useS, useEffect: useE } = React;
  const [tick, setTick] = useS(0);
  const [detailOpen, setDetailOpen] = useS(false);

  // A run is only "live" if there's a 'running' step updated within the last 30 minutes
  const LIVE_MS = 30 * 60 * 1000;
  const now = Date.now();
  const isRunning = steps.some(s =>
    s.status === 'running' && s.ts && (now - new Date(s.ts).getTime()) < LIVE_MS
  );

  useE(() => {
    if (!isRunning) return;
    const iv = setInterval(() => setTick(t => t + 1), 1000);
    return () => clearInterval(iv);
  }, [isRunning]);

  const grouped = {};
  steps.forEach(s => {
    if (!grouped[s.step]) grouped[s.step] = [];
    grouped[s.step].push(s);
  });

  // Letzte Zeile pro Step (done überschreibt running etc.)
  const latest = Object.values(grouped).map(arr => arr[arr.length - 1]);

  if (!isRunning) return (
    <Panel style={{ textAlign: 'center', padding: 48 }}>
      <IActivity size={32} style={{ color: T.mutedSoft, marginBottom: 12 }} sw={1.5} />
      <div style={{ fontFamily: T.serif, fontSize: 20, color: T.muted, marginBottom: 8 }}>Kein aktiver Run</div>
      <div style={{ fontSize: 13, color: T.mutedSoft, marginBottom: latestEtappe ? 20 : 0 }}>
        Sobald die Pipeline startet, erscheinen hier die Schritte live.
      </div>
      {latestEtappe && (
        <button onClick={() => setDetailOpen(true)} style={{
          display: 'inline-flex', alignItems: 'center', gap: 7,
          padding: '8px 16px', background: T.accentSoft, border: `1px solid ${T.border}`,
          borderRadius: 8, cursor: 'pointer', fontFamily: T.sans, fontSize: 12,
          color: T.accentInk, fontWeight: 600
        }}>
          <IDash size={13} sw={2} /> Letzte Etappe · T{latestEtappe.n} {latestEtappe.name}
        </button>
      )}
      {detailOpen && latestEtappe && (
        <EtappeDetailModal etappe={latestEtappe} onClose={() => setDetailOpen(false)} />
      )}
    </Panel>
  );

  const lastStep = latest[latest.length - 1];
  const doneCount = latest.filter(s => s.status === 'done').length;
  const total = latest.length;
  const pct = total ? Math.round((doneCount / total) * 100) : 0;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <Panel>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 16 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <IActivity size={15} style={{ color: T.accent }} sw={2} />
            <span style={{ fontSize: 13, fontWeight: 600, color: T.ink }}>Laufender Run</span>
            {isRunning && (
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, padding: '3px 9px',
                background: T.accentSoft, color: T.accentInk,
                fontFamily: T.mono, fontSize: 10, fontWeight: 700, borderRadius: 4, letterSpacing: 0.4 }}>
                ● LIVE
              </span>
            )}
          </div>
          <button onClick={onRefresh} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '6px 12px',
            background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 7, cursor: 'pointer',
            fontFamily: T.sans, fontSize: 12, color: T.muted, fontWeight: 500 }}>
            <IRefresh size={12} sw={2} /> Aktualisieren
          </button>
        </div>

        <div style={{ marginBottom: 20 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
            <span style={{ fontSize: 12, color: T.muted, fontWeight: 500 }}>{doneCount} / {total} Schritte</span>
            <span style={{ fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 600 }}>{pct}%</span>
          </div>
          <div style={{ height: 8, background: T.surfaceAlt, borderRadius: 4, overflow: 'hidden' }}>
            <div style={{ height: '100%', width: `${pct}%`,
              background: `linear-gradient(90deg, ${T.accent}, ${T.accentDeep})`,
              borderRadius: 4, transition: 'width 0.4s ease' }} />
          </div>
        </div>

        <div>
          {latest.map((s, i) => (
            <StepRow key={`${s.step}-${i}`} step={s} isLast={i === latest.length - 1} />
          ))}
        </div>
      </Panel>
    </div>
  );
}

// ─── Lightbox ────────────────────────────────────────────────────────────────
function Lightbox({ fotos, startIdx, onClose }) {
  const [idx, setIdx] = React.useState(startIdx);
  const touchX = React.useRef(null);

  const prev = () => setIdx(i => (i - 1 + fotos.length) % fotos.length);
  const next = () => setIdx(i => (i + 1) % fotos.length);

  React.useEffect(() => {
    const onKey = e => {
      if (e.key === 'ArrowLeft')  prev();
      if (e.key === 'ArrowRight') next();
      if (e.key === 'Escape')     onClose();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const onTouchStart = e => { touchX.current = e.touches[0].clientX; };
  const onTouchEnd   = e => {
    if (touchX.current === null) return;
    const dx = e.changedTouches[0].clientX - touchX.current;
    if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
    touchX.current = null;
  };

  const foto = fotos[idx];

  return (
    <div onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
      style={{ position: 'fixed', inset: 0, zIndex: 2000, background: '#000',
        display: 'flex', flexDirection: 'column' }}>

      {/* Bild — füllt den ganzen Screen */}
      <img src={foto.bildgen_url} alt={foto.foto_nr}
        style={{ flex: 1, width: '100%', objectFit: 'contain', display: 'block', minHeight: 0 }} />

      {/* X-Button oben rechts */}
      <button onClick={onClose}
        style={{ position: 'absolute', top: 14, right: 14,
          background: 'rgba(0,0,0,0.5)', border: 'none', borderRadius: 20,
          color: '#fff', fontSize: 16, lineHeight: 1,
          width: 36, height: 36, cursor: 'pointer',
          display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>

      {/* Prev/Next Desktop */}
      {fotos.length > 1 && <>
        <button onClick={prev}
          style={{ position: 'absolute', left: 10, top: '40%',
            background: 'rgba(0,0,0,0.4)', border: 'none', borderRadius: 8,
            color: '#fff', fontSize: 22, padding: '8px 13px', cursor: 'pointer' }}>‹</button>
        <button onClick={next}
          style={{ position: 'absolute', right: 10, top: '40%',
            background: 'rgba(0,0,0,0.4)', border: 'none', borderRadius: 8,
            color: '#fff', fontSize: 22, padding: '8px 13px', cursor: 'pointer' }}>›</button>
      </>}

    </div>
  );
}

  const [rating, setRating]     = React.useState(null);
  const [saving, setSaving]     = React.useState(false);
  const [saveMsg, setSaveMsg]   = React.useState(null);
  const [lightbox, setLightbox] = React.useState(null);
  const [stilInfo, setStilInfo] = React.useState(null);

  React.useEffect(() => {
    if (!curE?.id) return;
    setLoading(true); setFotos([]); setRating(null); setSaveMsg(null); setStilInfo(null);
    const h = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/etappen?id=eq.${curE.id}&select=id,stil_bewertung&limit=1`, { headers: h }).then(r => r.json()).then(rows => rows[0] || null),
      fetch(`${SUPABASE_URL}/rest/v1/fotos?etappe_id=eq.${curE.id}&bildgen_url=not.is.null&select=foto_nr,bildgen_url,tagesstil&order=foto_nr.asc`, { headers: h }).then(r => r.json()),
    ]).then(([det, f]) => {
      setFotos(f);
      if (det?.stil_bewertung != null) setRating(det.stil_bewertung);
      const tagesstil = f.length > 0 ? f[0].tagesstil : null;
      if (tagesstil) {
        fetch(`${SUPABASE_URL}/rest/v1/stile?name=eq.${encodeURIComponent(tagesstil)}&select=name,bewertung,aktiv,mal_benutzt&limit=1`, { headers: h })
          .then(r => r.json()).then(rows => setStilInfo(rows[0] || null));
      }
    }).finally(() => setLoading(false));
  }, [curE?.id]);

  async function handleRate(r) {
    if (!curE || saving) return;
    setRating(r.value); setSaving(true); setSaveMsg(null);
    const h = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=minimal' };
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/etappen?id=eq.${curE.id}`, {
        method: 'PATCH', headers: h,
        body: JSON.stringify({ stil_bewertung: r.value, stil_notiz: null }),
      });
      const tagesstil = fotos.length > 0 ? fotos[0].tagesstil : null;
      if (tagesstil) {
        await fetch(`${SUPABASE_URL}/rest/v1/stile?name=eq.${encodeURIComponent(tagesstil)}`, {
          method: 'PATCH', headers: h, body: JSON.stringify(r.stilUpdate),
        });
        setStilInfo(prev => prev ? { ...prev, ...r.stilUpdate } : prev);
      }
      setSaveMsg({ text: `✓ ${r.emoji} ${r.label}`, type: 'ok' });
      setTimeout(() => setSaveMsg(null), 3000);
    } catch (err) {
      setSaveMsg({ text: `Fehler: ${err.message}`, type: 'error' });
    } finally { setSaving(false); }
  }

  if (!curE) return null;
  const stilName = fotos.length > 0 ? (fotos[0].tagesstil || '–') : '–';

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>

      {/* Stil-Header */}
      <Panel>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
          <div style={{ width: 4, height: 44, background: T.accent, borderRadius: 2, flexShrink: 0 }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontFamily: T.mono, fontSize: 10, color: T.muted, fontWeight: 500,
              textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 2 }}>Stil</div>
            <div style={{ fontFamily: T.serif, fontSize: mobile ? 24 : 32, color: T.ink, lineHeight: 1 }}>
              {loading ? '…' : stilName}
            </div>
          </div>
          {/* Bewertet-Badge */}
          {!loading && (() => {
            if (stilInfo?.aktiv === false) return (
              <div style={{ fontFamily: T.mono, fontSize: 11, fontWeight: 600,
                background: '#fee2e2', color: '#dc2626', borderRadius: 20,
                padding: '4px 12px', whiteSpace: 'nowrap' }}>❌ Deaktiviert</div>
            );
            if (stilInfo?.bewertung != null) return (
              <div style={{ fontFamily: T.mono, fontSize: 11, fontWeight: 600,
                background: '#dcfce7', color: '#16a34a', borderRadius: 20,
                padding: '4px 12px', whiteSpace: 'nowrap' }}>✓ Bewertet</div>
            );
            return (
              <div style={{ fontFamily: T.mono, fontSize: 11, fontWeight: 600,
                background: '#fff7ed', color: '#ea580c', borderRadius: 20,
                padding: '4px 12px', whiteSpace: 'nowrap' }}>Nicht bewertet</div>
            );
          })()}
        </div>
        <div style={{ marginLeft: 18, marginTop: 10, fontFamily: T.mono, fontSize: 11, color: T.mutedSoft }}>
          {stilInfo != null ? `${stilInfo.mal_benutzt ?? 0}× benutzt` : (loading ? '' : '–')}
        </div>
      </Panel>

      {/* Bildergalerie (Swipeable Carousel) */}
      {fotos.length > 0 ? (
        <div className="no-scrollbar" style={{
          display: 'flex',
          gap: 12,
          overflowX: 'auto',
          scrollSnapType: 'x mandatory',
          paddingBottom: 8,
        }}>
          {fotos.map((foto, i) => (
            <div key={foto.foto_nr} onClick={() => setLightbox(i)}
              style={{
                scrollSnapAlign: 'center',
                flexShrink: 0,
                width: mobile ? '85vw' : '280px',
                maxWidth: '400px',
                cursor: 'pointer',
              }}>
              <ImageCardInline foto={foto} />
            </div>
          ))}
        </div>
      ) : !loading ? (
        <Panel style={{ textAlign: 'center', padding: 48 }}>
          <IImage size={32} style={{ color: T.mutedSoft, marginBottom: 12 }} sw={1.5} />
          <div style={{ fontFamily: T.serif, fontSize: 18, color: T.muted, marginBottom: 6 }}>Keine generierten Bilder</div>
          <div style={{ fontSize: 13, color: T.mutedSoft }}>für diese Etappe verfügbar</div>
        </Panel>
      ) : null}

      {/* Bewertung */}
      <Panel>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
          <PanelHeader icon={ISparkles} label="Bewertung" serif="Wie war der Stil?" />
          {saveMsg && (
            <div style={{ padding: '6px 12px', borderRadius: 8, fontFamily: T.sans, fontSize: 12, fontWeight: 500,
              background: saveMsg.type === 'ok' ? T.okSoft : T.errSoft,
              color: saveMsg.type === 'ok' ? T.ok : T.err }}>
              {saveMsg.text}
            </div>
          )}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, maxWidth: 360, opacity: saving ? 0.6 : 1, transition: 'opacity 0.15s' }}>
          {STYLE_RATINGS.map(r => (
            <button key={r.value} onClick={() => handleRate(r)}
              className={`sk-rate-btn${rating === r.value ? ' ' + r.cls : ''}`}
              style={{ padding: '12px 8px' }}>
              <span style={{ fontSize: '1.6rem', lineHeight: 1 }}>{r.emoji}</span>
              <span style={{ fontFamily: T.sans, fontSize: '0.7rem', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', color: T.muted }}>{r.label}</span>
            </button>
          ))}
        </div>
      </Panel>

      {lightbox !== null && (
        <Lightbox fotos={fotos} startIdx={lightbox}
          onClose={() => setLightbox(null)} />
      )}
    </div>
  );
}

// ─── Stil-Katalog ─────────────────────────────────────────────────────────────
const SK_RATINGS = {
  top:    { emoji: '🔥', label: 'Top',    db: { bewertung: 4, aktiv: true },    weight: '4×', cls: 'on-top' },
  gut:    { emoji: '👍', label: 'Gut',    db: { bewertung: 2, aktiv: true },    weight: '2×', cls: 'on-gut' },
  mittel: { emoji: '🟡', label: 'Mittel', db: { bewertung: 1, aktiv: true },    weight: '1×', cls: 'on-mittel' },
  raus:   { emoji: '❌', label: 'Raus',   db: { bewertung: null, aktiv: false }, weight: '0×', cls: 'on-raus' },
};
const SK_ORDER = ['top', 'gut', 'mittel', 'raus'];
const SK_RANK  = { top: 0, gut: 1, mittel: 2, unbewertet: 3, raus: 4 };
let _skCache = null;

function skStateOf(s) {
  if (s.aktiv === false) return 'raus';
  if (s.bewertung === 4) return 'top';
  if (s.bewertung === 2) return 'gut';
  if (s.bewertung === 1) return 'mittel';
  return 'unbewertet';
}
function skPickSpread(arr, n) {
  if (arr.length <= n) return arr.map((u, i) => ({ u, i }));
  const out = [];
  for (let k = 0; k < n; k++) {
    const i = Math.round(k * (arr.length - 1) / (n - 1));
    if (!out.some(o => o.i === i)) out.push({ u: arr[i], i });
  }
  return out;
}
function skFileUrl(p) {
  return 'file://' + p.split('/').map(encodeURIComponent).join('/');
}

function TabStilKatalog() {
  const [stile, setStile]           = React.useState(_skCache ? _skCache.stile : []);
  const [images, setImages]         = React.useState(_skCache ? _skCache.images : {});
  const [loading, setLoading]       = React.useState(!_skCache);
  const [error, setError]           = React.useState(null);
  const [activeStatus, setActiveStatus] = React.useState('alle');
  const [activeCat, setActiveCat]   = React.useState('alle');
  const [sort, setSort]             = React.useState('rating');
  const [toast, setToast]           = React.useState(null);
  const [lb, setLb]                 = React.useState(null);   // { list, idx }
  const [gallery, setGallery]       = React.useState(null);   // { styleId }
  const [expandedDescs, setExpandedDescs] = React.useState({});
  const toastTimer = React.useRef(null);

  React.useEffect(() => {
    if (_skCache) return;
    const h = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };
    Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/stile?select=*&order=name`, { headers: h }).then(r => r.json()),
      fetch(`${SUPABASE_URL}/rest/v1/fotos?select=tagesstil,bildgen_url,foto_nr&bildgen_url=not.is.null&order=foto_nr&limit=3000`, { headers: h }).then(r => r.json()),
      fetch(`${SUPABASE_URL}/rest/v1/fotos?select=tagesstil,bildgen_datei,foto_nr&bildgen_datei=not.is.null&bildgen_url=is.null&order=foto_nr&limit=3000`, { headers: h }).then(r => r.json()),
    ]).then(([stileRows, urlRows, localRows]) => {
      const imgs = {};
      const add = (style, src) => {
        if (!style || !src) return;
        const list = (imgs[style] = imgs[style] || []);
        if (list.length < 150 && !list.includes(src)) list.push(src);
      };
      stileRows.forEach(s => { if (Array.isArray(s.review_bilder)) s.review_bilder.forEach(u => add(s.name, u)); });
      urlRows.forEach(r => add(r.tagesstil, r.bildgen_url));
      localRows.forEach(r => add(r.tagesstil, skFileUrl(r.bildgen_datei)));
      _skCache = { stile: stileRows, images: imgs };
      setStile(stileRows);
      setImages(imgs);
      setLoading(false);
    }).catch(e => { setError(e.message); setLoading(false); });
  }, []);

  const showToast = React.useCallback((msg, bg) => {
    setToast({ msg, bg: bg || '#fff' });
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(null), 2600);
  }, []);

  const skPatch = React.useCallback(async (id, body) => {
    const h = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' };
    const res = await fetch(`${SUPABASE_URL}/rest/v1/stile?id=eq.${id}`, { method: 'PATCH', headers: h, body: JSON.stringify(body) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
  }, []);

  const skRate = React.useCallback(async (id, key) => {
    const s = stile.find(x => x.id === id);
    if (!s) return;
    const body = key === 'reset' ? { bewertung: null, aktiv: true } : SK_RATINGS[key].db;
    try {
      await skPatch(id, body);
      const updated = stile.map(x => x.id === id ? { ...x, ...body } : x);
      setStile(updated);
      if (_skCache) _skCache.stile = updated;
      showToast(`✓ ${s.name} → ${key === 'reset' ? 'Reset' : SK_RATINGS[key].label}`, T.okSoft);
    } catch (e) { showToast(`❌ Fehler: ${e.message}`, T.errSoft); }
  }, [stile, skPatch, showToast]);

  const skToggleFav = React.useCallback(async (id) => {
    const s = stile.find(x => x.id === id);
    if (!s) return;
    const next = !s.favorit;
    try {
      await skPatch(id, { favorit: next });
      const updated = stile.map(x => x.id === id ? { ...x, favorit: next } : x);
      setStile(updated);
      if (_skCache) _skCache.stile = updated;
      showToast(`${next ? '★' : '☆'} ${s.name} → Favorit ${next ? 'an' : 'aus'}`, '#fdeef5');
    } catch (e) { showToast(`❌ Fehler: ${e.message}`, T.errSoft); }
  }, [stile, skPatch, showToast]);

  React.useEffect(() => {
    const handler = e => {
      if (lb) {
        if (e.key === 'ArrowLeft')  setLb(p => ({ ...p, idx: (p.idx - 1 + p.list.length) % p.list.length }));
        if (e.key === 'ArrowRight') setLb(p => ({ ...p, idx: (p.idx + 1) % p.list.length }));
        if (e.key === 'Escape')     setLb(null);
      } else if (gallery) {
        if (e.key === 'Escape') setGallery(null);
      }
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [lb, gallery]);

  const counts = React.useMemo(() => {
    const c = { alle: stile.length, unbewertet: 0, top: 0, gut: 0, mittel: 0, raus: 0, fav: 0 };
    stile.forEach(s => { c[skStateOf(s)]++; if (s.favorit) c.fav++; });
    return c;
  }, [stile]);

  const catCounts = React.useMemo(() => {
    const c = {};
    stile.forEach(s => { const k = s.kategorie || '—'; c[k] = (c[k] || 0) + 1; });
    return c;
  }, [stile]);

  const visible = React.useMemo(() => {
    const filtered = stile.filter(s => {
      if (activeCat !== 'alle' && (s.kategorie || '—') !== activeCat) return false;
      if (activeStatus === 'alle')  return true;
      if (activeStatus === 'fav')   return !!s.favorit;
      return skStateOf(s) === activeStatus;
    });
    const arr = [...filtered];
    if (sort === 'name')   arr.sort((a, b) => a.name.localeCompare(b.name));
    else if (sort === 'used')   arr.sort((a, b) => (b.mal_benutzt || 0) - (a.mal_benutzt || 0));
    else if (sort === 'recent') arr.sort((a, b) => (b.zuletzt_benutzt || '').localeCompare(a.zuletzt_benutzt || ''));
    else arr.sort((a, b) => SK_RANK[skStateOf(a)] - SK_RANK[skStateOf(b)] || a.name.localeCompare(b.name));
    return arr;
  }, [stile, activeStatus, activeCat, sort]);

  const STATUS_DEFS = [
    ['alle','Alle'],['unbewertet','⚪ Unbewertet'],['top','🔥 Top'],
    ['gut','👍 Gut'],['mittel','🟡 Mittel'],['raus','❌ Raus'],['fav','⭐ Favoriten'],
  ];
  const cats = Object.keys(catCounts).sort();
  const galleryStyle = gallery ? stile.find(s => s.id === gallery.styleId) : null;
  const galleryImgs  = galleryStyle ? (images[galleryStyle.name] || []) : [];

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100%', overflow: 'hidden' }}>
      {/* Filter bar */}
      <div style={{ padding: '10px 28px', borderBottom: `1px solid ${T.border}`, background: T.surface, flexShrink: 0 }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4 }}>
          <div>
            <select value={sort} onChange={e => setSort(e.target.value)}
              style={{ fontFamily: T.sans, fontSize: 12, padding: '4px 8px', border: `1px solid ${T.border}`, borderRadius: 7, background: T.surface, color: T.ink, cursor: 'pointer' }}>
              <option value="rating">Bewertung</option>
              <option value="name">Name A–Z</option>
              <option value="used">Meist genutzt</option>
              <option value="recent">Zuletzt genutzt</option>
            </select>
          </div>
          <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
            {STATUS_DEFS.map(([k, lbl]) => (
              <div key={k} className={`sk-chip${activeStatus === k ? ' active' : ''}`} onClick={() => setActiveStatus(k)}>
                {lbl}<span style={{ opacity: activeStatus === k ? 0.85 : 0.6, marginLeft: 3, fontVariantNumeric: 'tabular-nums' }}>{counts[k] ?? 0}</span>
              </div>
            ))}
          </div>
          <div style={{ display: 'flex', gap: 4, flexWrap: 'wrap' }}>
            <div className={`sk-chip${activeCat === 'alle' ? ' active' : ''}`} onClick={() => setActiveCat('alle')}>Alle Kategorien</div>
            {cats.map(k => (
              <div key={k} className={`sk-chip${activeCat === k ? ' active' : ''}`} onClick={() => setActiveCat(k)}>
                {k}<span style={{ opacity: activeCat === k ? 0.85 : 0.6, marginLeft: 3, fontVariantNumeric: 'tabular-nums' }}>{catCounts[k]}</span>
              </div>
            ))}
          </div>
          <span style={{ fontFamily: T.sans, fontSize: 11, color: T.muted, paddingTop: 2 }}>
            {loading ? 'Lade …' : `${stile.length} Stile · ${counts.top + counts.gut + counts.mittel} bewertet · ${counts.unbewertet} offen · ${counts.raus} raus`}
          </span>
        </div>
      </div>

      {/* List */}
      <div style={{ flex: 1, overflow: 'auto', padding: '8px 28px 80px' }}>
        {loading && <div style={{ padding: 60, textAlign: 'center', color: T.muted, fontFamily: T.sans }}>Lade Styles aus Supabase …</div>}
        {error   && <div style={{ padding: 60, textAlign: 'center', color: T.err,  fontFamily: T.sans }}>❌ {error}</div>}
        {!loading && !error && !visible.length && <div style={{ padding: 60, textAlign: 'center', color: T.muted, fontFamily: T.sans }}>Keine Styles in diesem Filter.</div>}
        {visible.map(s => {
          const st = skStateOf(s);
          const imgs = images[s.name] || [];
          const preview = skPickSpread(imgs, 9);
          const used = s.mal_benutzt
            ? `${s.mal_benutzt}× genutzt${s.zuletzt_benutzt ? ' · ' + s.zuletzt_benutzt : ''}`
            : 'nie genutzt';
          return (
            <div key={s.id} className="sk-row">
              {/* Info */}
              <div style={{ width: 250, flexShrink: 0 }}>
                <div className="sk-name" onClick={() => setGallery({ styleId: s.id })} title="Alle Bilder ansehen">{s.name}</div>
                <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginBottom: 9 }}>
                  {s.kategorie && <span style={{ fontFamily: T.mono, fontSize: '0.68rem', padding: '2px 7px', borderRadius: 5, background: T.accentSoft, color: T.accentInk, fontWeight: 600 }}>{s.kategorie}</span>}
                  <span style={{ fontFamily: T.mono, fontSize: '0.68rem', padding: '2px 7px', borderRadius: 5, background: T.okSoft, color: T.ok, fontWeight: 600 }}>{used}</span>
                </div>
                <div style={{ fontFamily: T.sans, fontSize: '0.8rem', color: T.muted, lineHeight: 1.55,
                  ...(expandedDescs[s.id] ? {} : { display: '-webkit-box', WebkitBoxOrient: 'vertical', WebkitLineClamp: 3, overflow: 'hidden' }) }}>
                  {s.beschreibung || 'Keine Beschreibung.'}
                </div>
                {(s.beschreibung || '').length > 120 && (
                  <button className="sk-desc-more" onClick={() => setExpandedDescs(p => ({ ...p, [s.id]: !p[s.id] }))}>
                    {expandedDescs[s.id] ? 'Weniger ↑' : 'Mehr ↓'}
                  </button>
                )}
              </div>
              {/* Images */}
              <div style={{ display: 'flex', gap: 8, flexGrow: 1, overflowX: 'auto', background: T.surfaceAlt, borderRadius: 9, padding: 8, alignItems: 'center', minHeight: 160 }}>
                {imgs.length === 0
                  ? <div style={{ color: T.mutedSoft, fontStyle: 'italic', fontSize: '0.82rem', width: '100%', textAlign: 'center', fontFamily: T.sans }}>Noch keine Bilder generiert</div>
                  : <>
                      {preview.map(p => (
                        <img key={p.i} loading="lazy" src={p.u} onError={e => e.target.style.display = 'none'}
                          style={{ height: 200, borderRadius: 6, boxShadow: '0 1px 5px rgba(0,0,0,0.1)', cursor: 'zoom-in', flexShrink: 0 }}
                          onClick={() => setLb({ list: imgs, idx: p.i })} />
                      ))}
                      {imgs.length > preview.length && (
                        <div className="sk-img-more" onClick={() => setGallery({ styleId: s.id })}>
                          +{imgs.length - preview.length} mehr
                        </div>
                      )}
                    </>
                }
              </div>
              {/* Rating */}
              <div style={{ width: 160, flexShrink: 0, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6, alignContent: 'start' }}>
                {SK_ORDER.map(k => {
                  const r = SK_RATINGS[k];
                  return (
                    <button key={k} className={`sk-rate-btn${st === k ? ' ' + r.cls : ''}`} onClick={() => skRate(s.id, k)}>
                      <span style={{ fontSize: '1.35rem', lineHeight: 1 }}>{r.emoji}</span>
                      <span style={{ fontFamily: T.sans, fontSize: '0.65rem', fontWeight: 600, textTransform: 'uppercase', letterSpacing: '0.04em', color: T.muted }}>{r.label}</span>
                      <span style={{ fontFamily: T.mono, fontSize: '0.6rem', color: T.mutedSoft }}>{r.weight}</span>
                    </button>
                  );
                })}
                <div style={{ display: 'flex', gap: 6, marginTop: 2, gridColumn: '1 / -1' }}>
                  <button className={`sk-mini-btn sk-fav-btn${s.favorit ? ' on' : ''}`} onClick={() => skToggleFav(s.id)}>
                    {s.favorit ? '★ Favorit' : '☆ Favorit'}
                  </button>
                  <button className="sk-mini-btn" onClick={() => skRate(s.id, 'reset')} title="Zurück auf unbewertet">↺ Reset</button>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Toast */}
      {toast && (
        <div style={{ position: 'fixed', bottom: 22, left: '50%', transform: 'translateX(-50%)',
          padding: '10px 18px', borderRadius: 9, fontFamily: T.sans, fontSize: '0.85rem', zIndex: 1000,
          boxShadow: '0 6px 22px rgba(124,58,237,0.16)', background: toast.bg, color: T.ink, pointerEvents: 'none' }}>
          {toast.msg}
        </div>
      )}

      {/* Gallery lightbox */}
      {gallery && galleryStyle && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(10,8,18,0.95)', zIndex: 3000, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}
          onClick={e => { if (e.target === e.currentTarget) setGallery(null); }}>
          <div style={{ flexShrink: 0, display: 'flex', alignItems: 'center', gap: 16, padding: '16px 28px 12px', borderBottom: '1px solid rgba(255,255,255,0.08)' }}>
            <span style={{ fontFamily: T.serif, fontSize: '1.6rem', color: '#fff', fontWeight: 400 }}>{galleryStyle.name}</span>
            <span style={{ fontFamily: T.mono, fontSize: '0.78rem', color: 'rgba(255,255,255,0.4)' }}>{galleryImgs.length ? `${galleryImgs.length} Bilder` : ''}</span>
            <button onClick={() => setGallery(null)}
              style={{ marginLeft: 'auto', background: 'rgba(255,255,255,0.1)', border: 'none', color: '#fff', fontSize: '1.4rem', width: 38, height: 38, borderRadius: 9, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>✕</button>
          </div>
          <div style={{ flex: 1, overflowY: 'auto', padding: '20px 28px 40px' }}>
            {galleryImgs.length === 0
              ? <div style={{ color: 'rgba(255,255,255,0.3)', fontStyle: 'italic', fontFamily: T.sans, padding: '60px 0' }}>Noch keine Bilder vorhanden.</div>
              : <div className="sk-gallery-grid" style={{ display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'flex-start' }}>
                  {galleryImgs.map((u, i) => (
                    <img key={i} loading="lazy" src={u} onError={e => e.target.style.display = 'none'}
                      title={`${galleryStyle.name} #${i + 1}`}
                      onClick={() => setLb({ list: galleryImgs, idx: i })} />
                  ))}
                </div>
            }
          </div>
        </div>
      )}

      {/* Single-image lightbox */}
      {lb && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.86)', zIndex: 4000, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'zoom-out' }}
          onClick={() => setLb(null)}>
          {lb.list.length > 1 && (
            <button onClick={e => { e.stopPropagation(); setLb(p => ({ ...p, idx: (p.idx - 1 + p.list.length) % p.list.length })); }}
              style={{ position: 'fixed', top: '50%', left: '3vw', transform: 'translateY(-50%)', zIndex: 4001, width: 54, height: 84, border: 'none', borderRadius: 10, background: 'rgba(255,255,255,0.12)', color: '#fff', fontSize: '2.2rem', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>‹</button>
          )}
          <img src={lb.list[lb.idx]} style={{ maxWidth: '86vw', maxHeight: '92vh', borderRadius: 8, cursor: 'default' }} onClick={e => e.stopPropagation()} />
          {lb.list.length > 1 && (
            <button onClick={e => { e.stopPropagation(); setLb(p => ({ ...p, idx: (p.idx + 1) % p.list.length })); }}
              style={{ position: 'fixed', top: '50%', right: '3vw', transform: 'translateY(-50%)', zIndex: 4001, width: 54, height: 84, border: 'none', borderRadius: 10, background: 'rgba(255,255,255,0.12)', color: '#fff', fontSize: '2.2rem', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>›</button>
          )}
          {lb.list.length > 1 && (
            <div style={{ position: 'fixed', bottom: '4vh', left: '50%', transform: 'translateX(-50%)', zIndex: 4001, color: '#fff', fontSize: '0.9rem', background: 'rgba(0,0,0,0.45)', padding: '5px 14px', borderRadius: 20, fontVariantNumeric: 'tabular-nums' }}>
              {lb.idx + 1} / {lb.list.length}
            </div>
          )}
        </div>
      )}
    </div>
  );
}
