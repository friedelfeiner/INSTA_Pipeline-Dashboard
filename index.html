  return (
    <div>
      {etappen.map(e => (
        <Hitl2Veto key={e.id} etappe={e} onVeto={laden} />
      ))}
    </div>
  );
}

// ─── Tab: Reels (Reichweite der veröffentlichten Varianten) ───────────────────
// Nicht zu verwechseln mit dem Performance-Tab: der misst die Laufzeit der
// Pipeline, dieser die Wirkung dessen, was sie ausgeliefert hat.

// Je Reel zählt der jüngste Snapshot — '24h' und 'final' nebeneinander zu mitteln
// würde Reels unterschiedlichen Alters gegeneinander verrechnen.
// 'final' steht bewusst ÜBER '90d': ein Reel mit 'final'-Snapshot von vor der
// 30d/90d-Einführung (D5) ist trotzdem der spätere Stand als ein frisches 90d.
const HORIZON_RANG = { '24h': 1, '72h': 2, '7d': 3, '30d': 4, '90d': 5, 'final': 6 };

function juengsteSnapshots(rows) {
  const beste = new Map();
  for (const r of rows) {
    const key = `${r.etappe_id}|${r.variante}|${r.platform}`;
    const alt = beste.get(key);
    if (!alt || (HORIZON_RANG[r.horizon] || 0) > (HORIZON_RANG[alt.horizon] || 0)) beste.set(key, r);
  }
  return [...beste.values()];
}

const mittel = (arr, feld) => {
  const werte = arr.map(a => a[feld]).filter(v => v !== null && v !== undefined).map(Number);
  return werte.length ? werte.reduce((s, v) => s + v, 0) / werte.length : null;
};

// Auf welchem Stand verglichen wird: dem mit den meisten Reels. Views wachsen mit
// dem Alter — '72h' gegen 'final' zu mitteln misst mit, welcher Stil zufällig die
// älteren Posts hat. Bei Gleichstand gewinnt der spätere Horizont.
function vergleichsHorizont(rows) {
  const zaehler = {};
  for (const r of rows) if (r.platform === 'instagram') zaehler[r.horizon] = (zaehler[r.horizon] || 0) + 1;
  const kandidaten = Object.keys(zaehler);
  if (!kandidaten.length) return null;
  return kandidaten.sort((a, b) =>
    (zaehler[b] - zaehler[a]) || ((HORIZON_RANG[b] || 0) - (HORIZON_RANG[a] || 0)))[0];
}

// Ein Balken zeigt Größe, nicht Identität — deshalb durchgängig der Akzent-Ton
// und der Name als Text daneben. Fünf Stil-Farben würden Zugehörigkeit behaupten,
// wo nur "mehr oder weniger Views" gemeint ist.
function ReelBar({ label, sub, value, maxValue, detail }) {
  const pct = maxValue > 0 ? Math.min(100, (value / maxValue) * 100) : 0;
  return (
    <div title={detail || ''}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6, gap: 10 }}>
        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.ink, fontWeight: 500,
          overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{label}</span>
        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted, flexShrink: 0 }}>{sub}</span>
      </div>
      <div style={{ height: 8, background: T.surfaceAlt, borderRadius: 4, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${pct}%`, background: T.accent, borderRadius: 4 }} />
      </div>
    </div>
  );
}

// E2b/c/d/e: eine Zeile pro Variante mit allen Kennzahlen (Views, Reach, Retention,
// Watch-Time Ø + Σ, Likes, Kommentare, Saves, Shares) statt nur einem Balken mit
// dem Rest im Hover-Tooltip. YouTube liefert laut insights_poller.py (videos.list)
// nur views/likes/comments — die übrigen Felder zeigen "liefert die API nicht"
// statt einer irreführenden 0 (E2c). Der Horizont-Verlauf (E2e) steht darunter.
function ReelVarianteRow({ r, feld, maxWert, historie }) {
  const yt = r.platform !== 'instagram';
  const fmtNum = v => v != null ? Math.round(Number(v)).toLocaleString('de-DE') : (yt ? 'liefert die API nicht' : '–');
  const fmtPct = v => v != null ? `${Number(v).toFixed(1)}%` : (yt ? 'liefert die API nicht' : '–');
  const fmtWatch = v => v != null ? `${Math.round(Number(v))}s` : (yt ? 'liefert die API nicht' : '–');
  const felder = [
    { label: 'Views',        val: fmtNum(r.views) },
    { label: 'Reach',        val: fmtNum(r.reach) },
    { label: 'Retention',    val: fmtPct(r.retention_pct) },
    { label: 'Watch-Time Ø', val: fmtWatch(r.watch_time_avg_sec) },
    // E2d: watch_time_total_sec als zweite Leitgröße neben Retention — bisher
    // gar nicht abgefragt, obwohl reel_metrics die Spalte längst führt.
    { label: 'Watch-Time Σ', val: r.watch_time_total_sec != null ? fmtDur(Number(r.watch_time_total_sec)) : (yt ? 'liefert die API nicht' : '–') },
    { label: 'Likes',        val: fmtNum(r.likes) },
    { label: 'Kommentare',   val: fmtNum(r.comments) },
    { label: 'Saves',        val: fmtNum(r.saves) },
    { label: 'Shares',       val: fmtNum(r.shares) },
  ];
  const value = Number(r[feld]) || 0;
  const sub = feld === 'retention_pct'
    ? `${fmtPct(r.retention_pct)}${r.dauer_s ? ` · ${Math.round(r.dauer_s)}s` : ''} · ${r.horizon}`
    : `${fmtNum(r.views)} Views · ${r.horizon}`;
  return (
    <div style={{ padding: 14, background: T.surfaceAlt, borderRadius: 10 }}>
      <ReelBar label={`${r.variante || '?'}${yt ? ` · ${r.platform}` : ''}`} value={value} maxValue={maxWert} sub={sub} />
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(100px, 1fr))', gap: 10, marginTop: 12 }}>
        {felder.map(f => (
          <div key={f.label}>
            <div style={{ fontSize: 10, color: T.mutedSoft, marginBottom: 2 }}>{f.label}</div>
            <div style={{ fontFamily: T.mono, fontSize: 11.5, color: T.ink, fontWeight: 500 }}>{f.val}</div>
          </div>
        ))}
      </div>
      {historie.length > 1 && (
        <div style={{ marginTop: 12, paddingTop: 10, borderTop: `1px solid ${T.border}`, display: 'flex', gap: 16, flexWrap: 'wrap' }}>
          {historie.map(h => (
            <div key={h.horizon}>
              <div style={{ fontFamily: T.mono, fontSize: 9, fontWeight: h.horizon === r.horizon ? 700 : 500,
                color: h.horizon === r.horizon ? T.accentInk : T.mutedSoft, textTransform: 'uppercase' }}>{h.horizon}</div>
              <div style={{ fontFamily: T.mono, fontSize: 11, color: T.ink }}>{h.views ?? '–'}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ─── Tab: Reels (Reichweite der Varianten der gewählten Etappe) ───────────────
// E2a: TabReels() nahm bis zum Umbau keine Props entgegen und ignorierte damit
// selectedEtappe komplett — der Tab zeigte immer den globalen Schnitt über alle
// Etappen. Jetzt zeigt er die gewählte Etappe, der globale Stil-Schnitt bleibt als
// Einordnungszeile (E2f).
function TabReels({ data, selectedEtappe }) {
  const mobile = useMobile();
  const [rows, setRows] = useState(null);
  const [fehler, setFehler] = useState(null);
  const [tage, setTage] = useState(30);
  const [mass, setMass] = useState('retention');
  // I1: Account-Basislinie (Follower/Reach/Views), unabhängig von den Reel-Snapshots.
  const [accountInsights, setAccountInsights] = useState(null);

  React.useEffect(() => {
    fetchReelMetrics().then(setRows).catch(e => setFehler(e.message));
    fetchAccountInsights().then(setAccountInsights).catch(() => setAccountInsights([]));
  }, []);

  if (fehler) return <Panel><div style={{ color: T.err, fontSize: 13 }}>Fehler beim Laden: {fehler}</div></Panel>;
  if (!rows) return <Panel><div style={{ color: T.muted, fontSize: 13 }}>Lade Reel-Zahlen…</div></Panel>;

  const curE = selectedEtappe || data.etappenList.find(e => e.id === data.latestId);
  const ZEITRAEUME = [[7, '7 Tage'], [30, '30 Tage'], [90, '90 Tage'], [0, 'Alles']];
  const feld = mass === 'retention' ? 'retention_pct' : 'views';

  // E2f: der globale Stil-Schnitt (früher das Hauptpanel des Tabs) ist jetzt nur
  // noch Kontext — eine Einordnungszeile statt eigenem Balken-Panel pro Stil.
  const grenze = Date.now() - tage * 864e5;
  const imZeitraum = rows.filter(r => r.etappe && (tage === 0 || new Date(r.posted_at).getTime() >= grenze));
  const horizont = vergleichsHorizont(imZeitraum);
  const wertung = imZeitraum.filter(r => r.platform === 'instagram' && r.horizon === horizont);
  const stile = {};
  for (const r of wertung) (stile[r.variante || '?'] ||= []).push(r);
  const stilRanking = Object.entries(stile)
    .map(([stil, gruppe]) => ({ stil, n: gruppe.length,
      views: mittel(gruppe, 'views') || 0, retention: mittel(gruppe, 'retention_pct') || 0 }))
    .filter(s => s.n >= 5)
    .sort((a, b) => b[mass] - a[mass]);
  const zeitraumLabel = tage ? `letzte ${tage} Tage` : 'gesamter Zeitraum';
  const einordnung = stilRanking.length
    ? `Stil-Schnitt über alle Etappen (${zeitraumLabel}, nur Instagram, Stand ${horizont}, n≥5 pro Stil): `
      + stilRanking.map(s => `${s.stil} ${mass === 'retention' ? s.retention.toFixed(1) + '%' : Math.round(s.views) + ' Views'} (n=${s.n})`).join(' · ')
    : `Noch keine Stichprobe ab n=5 pro Stil (${zeitraumLabel}).`;

  // E2b/c/e: alle Snapshots der gewählten Etappe, nach Variante+Plattform
  // gruppiert. Der jüngste Snapshot je Kombination trägt die Kennzahlen, alle
  // Snapshots zusammen den Horizont-Verlauf darunter.
  const etappeSnapshots = curE ? rows.filter(r => r.etappe_id === curE.id) : [];
  const aktuellEtappe = juengsteSnapshots(etappeSnapshots);
  const historieFuer = r => etappeSnapshots
    .filter(x => x.variante === r.variante && x.platform === r.platform)
    .sort((a, b) => (HORIZON_RANG[a.horizon] || 0) - (HORIZON_RANG[b.horizon] || 0));
  const sortNachMass = (a, b) => (Number(b[feld]) || 0) - (Number(a[feld]) || 0);
  const igVarianten = aktuellEtappe.filter(r => r.platform === 'instagram').sort(sortNachMass);
  const ytVarianten = aktuellEtappe.filter(r => r.platform !== 'instagram').sort(sortNachMass);
  const maxWert = Math.max(...aktuellEtappe.map(r => Number(r[feld]) || 0), 1);

  // Audit 02.08.: fünf Stile pro Etappe (original_images, selfie_first,
  // ki_narrator, impact, song) — aber nur 5 von 12 jüngeren Etappen haben alle
  // fünf erfasst. E2a: den dünnen Zustand ehrlich als "n von 5" zeigen statt eine
  // vollständige Erhebung vorzutäuschen.
  const REEL_STILE_SOLL = 5;

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', justifyContent: 'space-between' }}>
        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {ZEITRAEUME.map(([t, label]) => (
            <button key={t} onClick={() => setTage(t)}
              className={`sk-chip${tage === t ? ' active' : ''}`}>{label}</button>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 6 }}>
          {[['retention', 'Retention'], ['views', 'Views']].map(([m, label]) => (
            <button key={m} onClick={() => setMass(m)}
              className={`sk-chip${mass === m ? ' active' : ''}`}>{label}</button>
          ))}
        </div>
      </div>

      {/* I1: Account-Basislinie — letzter Tages-Snapshot aus account_insights,
          reiner Kontext (nicht etappenbezogen). */}
      {accountInsights && accountInsights.length > 0 && (() => {
        const neuester = accountInsights[0];
        return (
          <div style={{ fontSize: 11, color: T.mutedSoft, fontFamily: T.mono, padding: '2px 4px' }}>
            Account {neuester.tag}: {neuester.followers_count ?? '–'} Follower ·
            {' '}{neuester.reach ?? '–'} Reach · {neuester.views ?? '–'} Views
          </div>
        );
      })()}

      {!curE ? (
        <Panel><div style={{ color: T.muted, fontSize: 13 }}>Keine Etappe gewählt.</div></Panel>
      ) : (
        <>
          <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(2, 1fr)' : 'repeat(3, 1fr)', gap: 14 }}>
            <KPI icon={IImage} label="Varianten erfasst"
              value={`${igVarianten.length} / ${REEL_STILE_SOLL}`}
              sub={igVarianten.length < REEL_STILE_SOLL ? 'noch nicht alle Stile mit Snapshot' : 'alle Stile erfasst'} />
            <KPI icon={ITrendUp} label="Ø Views (Etappe)"
              value={igVarianten.length ? Math.round(mittel(igVarianten, 'views') || 0) : '–'}
              sub={`${igVarianten.length} Instagram-Variante${igVarianten.length === 1 ? '' : 'n'}`} />
            <KPI icon={IClock} label="Ø Retention (Etappe)"
              value={igVarianten.length ? `${(mittel(igVarianten, 'retention_pct') || 0).toFixed(1)}%` : '–'}
              sub="Watch-Time ÷ Reel-Länge" />
          </div>

          <Panel>
            <PanelHeader icon={IImage} label="Varianten dieser Etappe" serif={`T${curE.n} · ${curE.name}`} />
            {igVarianten.length === 0 ? (
              <div style={{ color: T.muted, fontSize: 13 }}>Noch keine Instagram-Snapshots für diese Etappe.</div>
            ) : (
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                {igVarianten.map(r => (
                  <ReelVarianteRow key={`${r.variante}|${r.platform}`} r={r} feld={feld} maxWert={maxWert} historie={historieFuer(r)} />
                ))}
              </div>
            )}
            {/* E2c: Instagram und YouTube getrennt ausweisen statt gemeinsam zu mitteln —
                die Plattformen unterscheiden sich fast 100:1 in den Views (siehe
                Einordnungszeile unten), ein gemeinsamer Schnitt wäre IG-dominiert. */}
            {ytVarianten.length > 0 && (
              <div style={{ marginTop: 18, paddingTop: 16, borderTop: `1px solid ${T.border}` }}>
                <div style={{ fontSize: 11, color: T.muted, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5, marginBottom: 10 }}>YouTube</div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
                  {ytVarianten.map(r => (
                    <ReelVarianteRow key={`${r.variante}|${r.platform}`} r={r} feld={feld} maxWert={maxWert} historie={historieFuer(r)} />
                  ))}
                </div>
              </div>
            )}
          </Panel>

          <div style={{ fontSize: 11, color: T.mutedSoft, fontFamily: T.sans, lineHeight: 1.55, padding: '2px 4px' }}>
            {einordnung} Views und Retention laufen bei diesem Account gegeneinander: weite
            Explore-Ausspielung bringt viele Views und niedrige Retention — beide Maße einzeln
            lesen, nicht addieren. PUBLISH_BELEGUNG bindet jeden Stil an feste Slots
            (original_images immer 5, selfie_first fast immer 1/2) — ein Stil-Unterschied kann
            ein Uhrzeit-Unterschied sein.
          </div>
        </>
      )}
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
// ─── Ist-Kosten Gesamtprojekt ──────────────────────────────────────────────
// Quelle: costs_data.json im Repo-Root, erzeugt von `python3 tools/costs_report.py --json`
// aus den Anbieter-Exports unter costs/<anbieter>/. Hier wird nur gezeichnet, nicht
// gerechnet — sonst könnten Report und Dashboard unterschiedliche Zahlen zeigen.
// Monatsritual: neue CSVs droppen → Report mit --json laufen lassen → committen.
const KOSTEN_PROVIDER_COLOR = { anthropic: '#C15F3C', atlas: '#3B6EA5', fal: '#7A5CC7', minimax: '#C2478A', sunoapi: '#D6A419', wavespeed: '#4C9A5B', google: '#1AA6B7', bfl: '#55606E' };
const KOSTEN_PROVIDER_LABEL = { anthropic: 'Anthropic', atlas: 'Atlas', fal: 'fal', minimax: 'MiniMax', sunoapi: 'Suno-API', wavespeed: 'WaveSpeed', google: 'Google', bfl: 'Black Forest Labs' };
const providerLabel = p => KOSTEN_PROVIDER_LABEL[p] || p;
const providerColor = p => KOSTEN_PROVIDER_COLOR[p] || '#8A8594';
const KOSTEN_MONTH_NAMES = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const KOSTEN_MONTH_NAMES_FULL = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const monthLabel = (monat, full) => {
  const [mm, yyyy] = monat.split('-');
  const idx = parseInt(mm, 10) - 1;
  return `${full ? KOSTEN_MONTH_NAMES_FULL[idx] : KOSTEN_MONTH_NAMES[idx]}${full ? ' ' + yyyy : ''}`;
};

// Telemetrie-Summe pro Monat (EUR) — die Kosten, die die Pipeline einer Etappe
// beim Lauf selbst zugerechnet hat. Bewusst ein Näherungswert: Alt-Etappen werden
// nie nachgerechnet, und was außerhalb eines Etappen-Laufs anfällt (Entwicklung,
// Tests, verworfene Renders) taucht hier gar nicht auf.
//
// Zusätzlich wird gezählt, wie viele Etappen GAR KEINE Telemetrie haben (Läufe von
// vor dem Telemetrie-Einbau). Ohne diese Zahl liest sich die Differenz zum Beleg wie
// reine Entwicklungskosten — tatsächlich stecken darin auch fertig publizierte Reels,
// deren Kosten nur nie erfasst wurden. Sie werden nach created_at gebucht: run_at ist
// bei ihnen leer, und datum ist der Wandertag (oft Jahre vor dem Lauf), taugt also nicht.
async function fetchTelemetrieKosten() {
  let rows;
  try {
    rows = await fetchAll('etappen?select=run_at,datum,created_at,cost_total_eur,pipeline_status&order=created_at.asc');
  } catch {
    return { kosten: {}, ohne: {}, ohneGesamt: 0, ohnePubliziert: 0 };
  }
  const kosten = {}, ohne = {};
  let ohneGesamt = 0, ohnePubliziert = 0;
  const bucket = iso => iso ? iso.slice(5, 7) + '-' + iso.slice(0, 4) : null;
  rows.forEach(r => {
    if (r.cost_total_eur == null) {
      const monat = bucket(r.created_at);
      if (!monat) return;
      ohne[monat] = (ohne[monat] || 0) + 1;
      ohneGesamt += 1;
      if (r.pipeline_status === 'publiziert') ohnePubliziert += 1;
      return;
    }
    const monat = bucket(r.run_at || r.datum);
    if (!monat) return;
    kosten[monat] = (kosten[monat] || 0) + (r.cost_total_eur || 0);
  });
  return { kosten, ohne, ohneGesamt, ohnePubliziert };
}

function TabKostenGesamt() {
  const mobile = useMobile();
  const [kosten, setKosten] = React.useState(null);
  const [telemetrie, setTelemetrie] = React.useState({ kosten: {}, ohne: {}, ohneGesamt: 0, ohnePubliziert: 0 });
  const [fehler, setFehler] = React.useState(null);

  React.useEffect(() => {
    fetch('costs_data.json', { cache: 'no-store' })
      .then(r => { if (!r.ok) throw new Error(`costs_data.json — HTTP ${r.status}`); return r.json(); })
      .then(setKosten)
      .catch(e => setFehler(String(e.message || e)));
    fetchTelemetrieKosten().then(setTelemetrie).catch(() => setTelemetrie({ kosten: {}, ohne: {}, ohneGesamt: 0, ohnePubliziert: 0 }));
  }, []);

  const KB = '#2F5FA3', KBSoft = '#EAF1FB', KBBorder = '#CFE0F5', KBTrack = '#D9E6F7', KBInk = '#5A7BA3';

  const Section = ({ label, children }) => (
    <div style={{ marginBottom: 10 }}>
      <div style={{ fontSize: 11, fontWeight: 600, letterSpacing: '.04em', textTransform: 'uppercase', color: KBInk, marginBottom: 10 }}>{label}</div>
      {children}
    </div>
  );

  if (fehler) return (
    <div style={{ flex: 1, overflow: 'auto', padding: mobile ? '14px' : '24px 28px' }}>
      <Panel style={{ padding: 20, maxWidth: 620 }}>
        <div style={{ fontSize: 14, fontWeight: 600, color: T.err, marginBottom: 8 }}>Kostendaten nicht ladbar</div>
        <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.6 }}>
          {fehler}<br />
          Im Pipeline-Repo <span style={{ fontFamily: T.mono, fontSize: 12 }}>python3 tools/costs_report.py --json</span> laufen lassen —
          das schreibt <span style={{ fontFamily: T.mono, fontSize: 12 }}>costs_data.json</span> hierher.
        </div>
      </Panel>
    </div>
  );

  if (!kosten) return (
    <div style={{ flex: 1, padding: mobile ? '14px' : '24px 28px', fontSize: 13, color: T.muted }}>Kostendaten werden geladen …</div>
  );

  const meta = kosten.meta || {};
  const kurs = meta.kurs_usd_eur || 0.8765;
  const proEurMonat = meta.anthropic_pro_eur_monat || 0;
  const months = kosten.months || [];
  const providerOrder = kosten.provider_order || [];
  const fmtUsd = n => '$' + n.toFixed(2);
  const fmtEur = n => '€' + n.toFixed(2);

  if (months.length === 0) return (
    <div style={{ flex: 1, overflow: 'auto', padding: mobile ? '14px' : '24px 28px' }}>
      <Panel style={{ padding: 20, maxWidth: 620 }}>
        <div style={{ fontSize: 14, fontWeight: 600, color: T.ink, marginBottom: 8 }}>Noch keine Kostendaten</div>
        <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.6 }}>
          <span style={{ fontFamily: T.mono, fontSize: 12 }}>costs_data.json</span> enthält keine Monate.
        </div>
      </Panel>
    </div>
  );

  const grandUsd = months.reduce((a, m) => a + m.usd, 0);
  const grandEur = months.reduce((a, m) => a + m.eur, 0);
  // Das Pro-Abo steckt in keinem Anbieter-Export (months[].eur sind reine Belege),
  // wird aber unten in den Anbieter-Zeilen aufgeschlagen. Ohne diesen Posten zeigte
  // die Kopfzahl weniger an, als die Aufschlüsselung direkt darunter aufsummiert.
  const proAboGesamt = proEurMonat * months.length;
  const grandEurGesamt = grandEur + proAboGesamt;
  const totalCalls = (kosten.models || []).reduce((a, r) => a + r[1], 0);
  const lastMonth = [...months].filter(m => m.complete).slice(-1)[0] || months[months.length - 1];
  const lastIdx = months.findIndex(m => m.monat === lastMonth.monat);
  const costPerCall = totalCalls ? grandUsd / totalCalls : 0;

  let running = 0;
  const cumMonths = months.map(m => { running += m.usd; return { ...m, cum: running, cumPct: grandUsd ? running / grandUsd * 100 : 0 }; });

  // null in provider_monthly heißt "für diesen Monat liegt gar kein Export vor" —
  // etwas anderes als "nichts ausgegeben". Fürs Rechnen wird daraus 0, fürs Anzeigen
  // ein "—". Ohne die Trennung wird ein fehlender Export zu einer glaubwürdigen Null
  // (genau das ließ im Juli die Telemetrie über dem Beleg landen).
  const providerMonthly = {};
  providerOrder.forEach(p => { providerMonthly[p] = months.map(m => (kosten.provider_monthly?.[m.monat] || {})[p] || 0); });
  const fehlendeAnbieter = m => m.fehlende_anbieter || [];
  const unvollstaendig = months.filter(m => fehlendeAnbieter(m).length > 0);
  const anbieterUnvollstaendig = p => months.some(m => fehlendeAnbieter(m).includes(p));
  const unvollstaendigGrund = m => [
    fehlendeAnbieter(m).length ? `Kein Export von: ${fehlendeAnbieter(m).map(providerLabel).join(', ')}` : '',
    m.laufend ? 'Monat läuft noch' : '',
  ].filter(Boolean).join(' · ');

  // Das Claude-Pro-Abo läuft über keinen API-Export — es steckt in keiner CSV und
  // kommt hier als Schätzwert aus der meta dazu, sichtbar als eigene Unterzeile.
  const anthropicRow = (usd, monate) => {
    const eur = usd * kurs;
    const proEur = proEurMonat * monate;
    if (!proEur) return { eur, sub: null };
    return { eur: eur + proEur, sub: [{ label: 'API (Export)', eur }, { label: 'Pro-Abo', eur: proEur, placeholder: true }] };
  };
  const buildProviderRows = (werteProProvider, monate) => providerOrder
    .map(p => {
      const usd = werteProProvider(p);
      const base = p === 'anthropic' ? anthropicRow(usd, monate) : { eur: usd * kurs, sub: null };
      return { name: p, color: providerColor(p), usd, luecke: anbieterUnvollstaendig(p), ...base };
    })
    .filter(p => p.eur > 0.001)
    .sort((a, b) => b.eur - a.eur);

  const providerRows = buildProviderRows(p => providerMonthly[p].reduce((a, v) => a + v, 0), months.length);
  const providerRowMax = Math.max(...providerRows.map(p => p.eur), 0.01);
  const providerRowsLastMonth = buildProviderRows(p => providerMonthly[p][lastIdx] || 0, 1);
  const providerRowLastMax = Math.max(...providerRowsLastMonth.map(p => p.eur), 0.01);

  const splitModel = model => {
    const provider = model.split('/')[0];
    return { provider, color: providerColor(provider), rest: model.slice(provider.length + 1) };
  };
  const modelsAll = (kosten.models || []).map(r => {
    const [model, calls, ...vals] = r;
    return { model, calls, ...splitModel(model), total: vals.reduce((a, v) => a + v, 0) };
  }).filter(r => r.total > 0.001).sort((a, b) => b.total - a.total);
  const modelMax = modelsAll[0]?.total || 1;
  const modelTop = modelsAll.slice(0, 15);
  const modelRestList = modelsAll.slice(15);
  const modelRest = { count: modelRestList.length, calls: modelRestList.reduce((a, r) => a + r.calls, 0), total: modelRestList.reduce((a, r) => a + r.total, 0) };

  const lastModelsAll = (kosten.models || [])
    .map(r => ({ model: r[0], calls: r[1], val: r[2 + lastIdx] || 0 }))
    .filter(r => r.val > 0.001)
    .map(r => ({ ...r, ...splitModel(r.model) }))
    .sort((a, b) => b.val - a.val);
  const lastMax = lastModelsAll[0]?.val || 1;
  const lastTop = lastModelsAll.slice(0, 12);
  const lastRestList = lastModelsAll.slice(12);
  const lastRest = { count: lastRestList.length, total: lastRestList.reduce((a, r) => a + r.val, 0) };

  // Näherung gegen Beleg: was die Telemetrie den Etappen zugerechnet hat vs. was
  // tatsächlich abgerechnet wurde. Die Lücke ist kein Fehler — aber auch nicht rein
  // Entwicklung: solange Etappen ohne Telemetrie mitlaufen, steckt in ihr auch
  // fertige Produktion, deren Kosten nur nie erfasst wurden. Darum wird sie nur dann
  // als Entwicklungskosten beschriftet, wenn es keine solchen Etappen (mehr) gibt.
  const telemetrieMonate = months.map(m => telemetrie.kosten?.[m.monat] || 0);
  const telemetrieGesamt = telemetrieMonate.reduce((a, v) => a + v, 0);
  const ohneTelemetrieMonate = months.map(m => telemetrie.ohne?.[m.monat] || 0);
  const ohneTelemetrieSichtbar = ohneTelemetrieMonate.reduce((a, v) => a + v, 0);
  const lueckeGesamt = Math.max(0, grandEurGesamt - telemetrieGesamt);

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: mobile ? '14px 14px' : '24px 28px' }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 22, maxWidth: 1080 }}>
        <div>
          <h1 style={{ fontFamily: T.serif, fontSize: mobile ? 24 : 30, fontWeight: 400, margin: 0, color: T.ink }}>Ist-Kosten — Gesamtprojekt</h1>
          <div style={{ fontSize: 12, color: T.muted, marginTop: 4 }}>
            Abgerechnet laut Anbieter-Belegen · Stand {meta.stand} · 1 USD = {kurs.toFixed(4)} EUR · alle Etappen zusammen
          </div>
        </div>

        <div style={{ display: 'grid', gridTemplateColumns: mobile ? 'repeat(2,1fr)' : 'repeat(5,1fr)', gap: 12 }}>
          <KPI icon={IEuro} label={monthLabel(lastMonth.monat, true)} value={fmtEur(months[lastIdx].eur)} sub="letzter vollständiger Monat" />
          <KPI icon={IEuro} label="Gesamt EUR" value={fmtEur(grandEurGesamt)}
               sub={proAboGesamt ? `${fmtEur(grandEur)} Belege + ${fmtEur(proAboGesamt)} Pro-Abo` : `${months.length} Monate · ${fmtUsd(grandUsd)}`} />
          <KPI icon={ICoins} label="Calls gesamt" value={totalCalls.toLocaleString('de-DE')} sub={`${modelsAll.length} Modelle`} />
          <KPI icon={IDash} label="Ø / Monat" value={fmtEur(grandEurGesamt / (months.length || 1))} sub={proAboGesamt ? 'über alle Monate · inkl. Pro-Abo' : 'über alle Monate'} />
          <KPI icon={IActivity} label="Kosten / Call" value={'$' + costPerCall.toFixed(3)} sub="Ø gesamtes Projekt" />
        </div>

        {unvollstaendig.length > 0 && (
          <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}33`, borderLeft: `3px solid ${T.warn}`, borderRadius: 8, padding: '12px 16px' }}>
            <div style={{ fontSize: 12.5, fontWeight: 600, color: T.ink, marginBottom: 6 }}>
              Unvollständige Monate — hier fehlen Anbieter-Exports
            </div>
            {unvollstaendig.map(m => (
              <div key={m.monat} style={{ fontSize: 12, color: T.muted, lineHeight: 1.6 }}>
                <span style={{ fontFamily: T.mono }}>{monthLabel(m.monat, true)}</span>
                {m.laufend && <span style={{ color: T.mutedSoft }}> · Monat läuft noch</span>}
                {' — kein Export von '}
                <span style={{ color: T.ink }}>{fehlendeAnbieter(m).map(providerLabel).join(', ')}</span>
              </div>
            ))}
            <div style={{ fontSize: 10.5, color: T.mutedSoft, marginTop: 7, lineHeight: 1.5 }}>
              Diese Monate sind nach unten verzerrt. Alle Zahlen, die sie einschließen — Gesamt, Ø/Monat,
              Kosten/Call — sind entsprechend zu niedrig.
            </div>
          </div>
        )}

        <Section label="Beleg gegen Telemetrie">
          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: 18 }}>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: mobile ? 16 : 34, marginBottom: 16 }}>
              <div>
                <div style={{ fontSize: 11, color: T.muted, marginBottom: 3 }}>Belege gesamt</div>
                <div style={{ fontFamily: T.mono, fontSize: 20, fontWeight: 700, color: T.ink }}>{fmtEur(grandEurGesamt)}</div>
              </div>
              <div>
                <div style={{ fontSize: 11, color: T.muted, marginBottom: 3 }}>davon Etappen zugerechnet</div>
                <div style={{ fontFamily: T.mono, fontSize: 20, fontWeight: 700, color: KB }}>{fmtEur(telemetrieGesamt)}</div>
              </div>
              <div>
                <div style={{ fontSize: 11, color: T.muted, marginBottom: 3 }}>
                  {telemetrie.ohneGesamt > 0 ? 'Nicht zugerechnet' : 'Entwicklung, Tests, Verworfenes'}
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 20, fontWeight: 700, color: T.mutedSoft }}>{fmtEur(lueckeGesamt)}</div>
                {telemetrie.ohneGesamt > 0 && (
                  <div style={{ fontSize: 10.5, color: T.warn, marginTop: 2 }}>
                    enthält {telemetrie.ohneGesamt} Etappen ohne Telemetrie
                    {telemetrie.ohnePubliziert > 0 && `, davon ${telemetrie.ohnePubliziert} publiziert`}
                  </div>
                )}
              </div>
            </div>
            {months.map((m, i) => {
              const ist = m.eur, tel = telemetrieMonate[i];
              const maxEur = Math.max(...months.map(x => x.eur), 0.01);
              // Telemetrie über Beleg heißt nicht "mehr ausgegeben", sondern: der Beleg
              // ist unvollständig. Früher klemmte hier ein Math.min() den Balken und
              // ließ die Zahl daneben stehen — der Widerspruch war unsichtbar.
              const ueberhang = tel > ist + 0.005;
              const fehlt = fehlendeAnbieter(m);
              // Etappen ohne Telemetrie erklären, warum der dunkle Balken kurz bleibt,
              // obwohl in dem Monat produziert wurde — sonst liest sich die Differenz
              // wie Entwicklungsaufwand.
              const ohneTel = ohneTelemetrieMonate[i];
              return (
                <div key={m.monat} style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '5px 0' }}>
                  <div style={{ width: mobile ? 34 : 58, fontFamily: T.mono, fontSize: 11, color: T.muted }}>
                    {monthLabel(m.monat)}
                    {fehlt.length > 0 && <span title={`Kein Export von: ${fehlt.map(providerLabel).join(', ')}`} style={{ color: T.warn }}> •</span>}
                    {ohneTel > 0 && <span title={`${ohneTel} Etappe(n) ohne Telemetrie — Kosten stecken im Beleg, nicht im dunklen Balken`} style={{ color: T.mutedSoft }}> ○</span>}
                  </div>
                  <div style={{ flex: 1, height: 14, background: KBTrack, borderRadius: 4, overflow: 'hidden', position: 'relative' }}>
                    <div style={{ position: 'absolute', inset: 0, width: `${ist / maxEur * 100}%`, background: KBSoft, borderRight: `1px solid ${KBBorder}` }} />
                    <div style={{ position: 'absolute', inset: 0, width: `${Math.min(tel, ist) / maxEur * 100}%`, background: KB }} />
                    {ueberhang && <div style={{ position: 'absolute', top: 0, bottom: 0, left: `${ist / maxEur * 100}%`, width: `${(tel - ist) / maxEur * 100}%`, background: `repeating-linear-gradient(45deg, ${T.warn}, ${T.warn} 3px, transparent 3px, transparent 6px)` }} />}
                  </div>
                  <div style={{ width: 66, textAlign: 'right', fontFamily: T.mono, fontSize: 11.5, color: ueberhang ? T.warn : KB, fontWeight: 600 }}>{tel ? fmtEur(tel) : '–'}</div>
                  <div style={{ width: 70, textAlign: 'right', fontFamily: T.mono, fontSize: 12, fontWeight: 700, color: T.ink }}>{fmtEur(ist)}</div>
                </div>
              );
            })}
            <div style={{ fontSize: 10.5, color: T.mutedSoft, marginTop: 10, lineHeight: 1.5 }}>
              Dunkel = was die Pipeline einzelnen Etappen beim Lauf zugerechnet hat (Näherung aus Einheitspreisen,
              wird für alte Etappen nie nachgerechnet). Hell = tatsächlich abgerechnet.
              {unvollstaendig.length > 0 && <> Schraffiert = Telemetrie über Beleg — dort fehlen Anbieter-Exports, nicht Geld.</>}
              {ohneTelemetrieSichtbar > 0 && <> ○ = Etappen ohne Telemetrie: real produziert und bezahlt, aber nie erfasst — ihre Kosten sitzen im hellen Balken, nicht im dunklen.</>}
            </div>
          </div>
        </Section>

        <Section label={`Ausgaben pro Anbieter — ${monthLabel(lastMonth.monat, true)}`}>
          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: 18, display: 'flex', flexDirection: 'column', gap: 14 }}>
            {providerRowsLastMonth.map(p => (
              <ProviderRow key={p.name} p={p} max={providerRowLastMax} fmtEur={fmtEur} track={KBTrack} />
            ))}
            {proEurMonat > 0 && (
              <div style={{ fontSize: 10.5, color: T.mutedSoft, marginTop: 4 }}>
                † Claude-Pro-Abo — Schätzwert (ANTHROPIC_PRO_EUR_MONAT in tools/costs_report.py), taucht in keinem API-Export auf.
              </div>
            )}
          </div>
        </Section>

        <Section label="Ausgaben pro Anbieter — insgesamt">
          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: 18, display: 'flex', flexDirection: 'column', gap: 14 }}>
            {providerRows.map(p => (
              <ProviderRow key={p.name} p={p} max={providerRowMax} fmtEur={fmtEur} track={KBTrack} />
            ))}
          </div>
        </Section>

        <Section label="Verlauf pro Monat">
          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: 18, display: 'flex', alignItems: 'flex-end', gap: 14, height: 190, overflowX: 'auto' }}>
            {months.map((m, i) => {
              const prev = i > 0 ? months[i - 1].usd : null;
              const mom = !prev ? null : (m.usd - prev) / prev * 100;
              const maxUsd = Math.max(...months.map(x => x.usd), 0.01);
              return (
                <div key={m.monat} style={{ flex: '1 0 54px', minWidth: 54, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, height: '100%', justifyContent: 'flex-end' }}>
                  <div style={{ fontFamily: T.mono, fontSize: 11.5, fontWeight: 600, color: T.ink, whiteSpace: 'nowrap' }}>{fmtUsd(m.usd)}</div>
                  <div style={{ width: 42, textAlign: 'center', fontSize: 10, fontWeight: 700, borderRadius: 10, padding: '2px 0',
                    background: mom == null ? '#E5E7EB' : (mom <= 0 ? '#DCF3E4' : '#FBE2E2'),
                    color: mom == null ? '#6B7280' : (mom <= 0 ? '#1F8A4C' : '#C1392B') }}>
                    {mom == null ? '—' : (mom >= 0 ? '+' : '−') + Math.abs(mom).toFixed(0) + '%'}
                  </div>
                  <div style={{ width: '100%', background: KB, borderRadius: '4px 4px 0 0', height: `${m.usd / maxUsd * 100}%` }} />
                  <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{m.monat}{!m.complete && <span title={unvollstaendigGrund(m)} style={{ color: T.warn }}> •</span>}</div>
                </div>
              );
            })}
          </div>
        </Section>

        <Section label="Kumulierte Kosten">
          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: 18, display: 'flex', alignItems: 'flex-end', gap: 8, height: 130, overflowX: 'auto' }}>
            {cumMonths.map(m => (
              <div key={m.monat} style={{ flex: '1 0 32px', minWidth: 32, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, height: '100%', justifyContent: 'flex-end' }}>
                <div style={{ fontFamily: T.mono, fontSize: 9.5, color: KB, fontWeight: 700, whiteSpace: 'nowrap' }}>{fmtUsd(m.cum)}</div>
                <div style={{ width: '100%', background: m.complete ? KB : KBTrack, border: m.complete ? 'none' : `1px dashed ${KB}`, borderRadius: '3px 3px 0 0', height: `${Math.max(2, m.cumPct)}%` }} />
                <div style={{ fontFamily: T.mono, fontSize: 9.5, color: T.muted }}>{m.monat.slice(0, 2)}</div>
              </div>
            ))}
          </div>
        </Section>

        <Section label="Aufschlüsselung nach Anbieter über Zeit">
          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: 18, overflowX: 'auto' }}>
            <div style={{ display: 'flex', gap: 12, flexWrap: 'wrap', marginBottom: 18 }}>
              {providerRows.map(p => (
                <div key={p.name} style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11, color: KBInk, whiteSpace: 'nowrap' }}>
                  <div style={{ width: 7, height: 7, borderRadius: '50%', background: p.color }} />{providerLabel(p.name)}
                </div>
              ))}
            </div>
            <div style={{ display: 'flex', alignItems: 'flex-end', gap: 14, height: 200, minWidth: months.length * 60 }}>
              {months.map((m, mi) => {
                const total = m.usd;
                const maxMonthTotal = Math.max(...months.map(x => x.usd), 0.01);
                return (
                  <div key={m.monat} style={{ flex: '1 0 54px', minWidth: 54, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, height: '100%', justifyContent: 'flex-end' }}>
                    <div style={{ fontFamily: T.mono, fontSize: 10.5, fontWeight: 700, color: T.ink, whiteSpace: 'nowrap' }}>{fmtEur(m.eur)}</div>
                    <div style={{ width: '100%', display: 'flex', flexDirection: 'column-reverse', borderRadius: '4px 4px 0 0', overflow: 'hidden', height: `${total / maxMonthTotal * 100}%` }}>
                      {providerOrder.map(p => {
                        const v = providerMonthly[p][mi] || 0;
                        if (v <= 0 || !total) return null;
                        return <div key={p} title={`${providerLabel(p)}: ${fmtEur(v * kurs)}`} style={{ width: '100%', height: `${v / total * 100}%`, background: providerColor(p) }} />;
                      })}
                    </div>
                    <div style={{ fontFamily: T.mono, fontSize: 10, color: T.muted }}>{monthLabel(m.monat)}{!m.complete && <span title={unvollstaendigGrund(m)} style={{ color: T.warn }}> •</span>}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </Section>

        <Section label={`Pro Modell — letzter vollständiger Monat (${monthLabel(lastMonth.monat, true)})`}>
          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: '4px 18px' }}>
            {lastTop.map(item => (
              <div key={item.model} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 0', borderBottom: `1px solid ${T.border}` }}>
                <div style={{ width: 7, height: 7, borderRadius: '50%', background: item.color, flex: 'none' }} />
                <div style={{ flex: 1, fontSize: 12.5, color: T.ink, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  <span style={{ fontWeight: 700 }}>{providerLabel(item.provider)}</span><span style={{ color: T.muted }}> / {item.rest}</span>
                </div>
                <div style={{ width: 68, textAlign: 'right', fontFamily: T.mono, fontSize: 12.5, fontWeight: 700, color: KB }}>{fmtUsd(item.val)}</div>
                <div style={{ width: 70, height: 4, background: KBTrack, borderRadius: 2, overflow: 'hidden' }}>
                  <div style={{ height: '100%', background: KB, width: `${item.val / lastMax * 100}%` }} />
                </div>
              </div>
            ))}
            {lastRest.count > 0 && (
              <div style={{ display: 'flex', justifyContent: 'space-between', padding: '9px 0', fontSize: 12, color: T.muted }}>
                <div>+ {lastRest.count} weitere Modelle</div>
                <div style={{ fontFamily: T.mono }}>{fmtUsd(lastRest.total)}</div>
              </div>
            )}
          </div>
        </Section>

        <Section label="Pro Modell — gesamtes Projekt">
          <div style={{ background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, padding: '4px 18px' }}>
            {modelTop.map(item => (
              <div key={item.model} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 0', borderBottom: `1px solid ${T.border}` }}>
                <div style={{ width: 7, height: 7, borderRadius: '50%', background: item.color, flex: 'none' }} />
                <div style={{ flex: 1, fontSize: 12.5, color: T.ink, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                  <span style={{ fontWeight: 700 }}>{providerLabel(item.provider)}</span><span style={{ color: T.muted }}> / {item.rest}</span>
                </div>
                <div style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{item.calls} Calls</div>
                <div style={{ width: 68, textAlign: 'right', fontFamily: T.mono, fontSize: 12.5, fontWeight: 700, color: KB }}>{fmtUsd(item.total)}</div>
                <div style={{ width: 70, height: 4, background: KBTrack, borderRadius: 2, overflow: 'hidden' }}>
                  <div style={{ height: '100%', background: KB, width: `${item.total / modelMax * 100}%` }} />
                </div>
              </div>
            ))}
            {modelRest.count > 0 && (
              <div style={{ display: 'flex', justifyContent: 'space-between', padding: '9px 0', fontSize: 12, color: T.muted }}>
                <div>+ {modelRest.count} weitere Modelle · {modelRest.calls} Calls</div>
                <div style={{ fontFamily: T.mono }}>{fmtUsd(modelRest.total)}</div>
              </div>
            )}
          </div>
        </Section>

        <div style={{ fontSize: 11, lineHeight: 1.5, color: T.mutedSoft, padding: '12px 0', borderTop: `1px solid ${T.border}` }}>{meta.hinweis}</div>
      </div>
    </div>
  );
}

function ProviderRow({ p, max, fmtEur, track }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
        <div style={{ width: 9, height: 9, borderRadius: '50%', background: p.color, flex: 'none' }} />
        <div style={{ width: 90, fontSize: 13, fontWeight: 600, color: T.ink }}>
          {providerLabel(p.name)}
          {p.luecke && <span title="In mindestens einem Monat fehlt der Export — Wert ist zu niedrig" style={{ color: T.warn, fontWeight: 700 }}> •</span>}
        </div>
        <div style={{ flex: 1, height: 10, background: track, borderRadius: 5, overflow: 'hidden' }}>
          <div style={{ height: '100%', background: p.color, width: `${p.eur / max * 100}%`, borderRadius: 5 }} />
        </div>
        <div style={{ width: 92, textAlign: 'right', fontFamily: T.mono, fontSize: 13, fontWeight: 700, color: T.ink }}>{fmtEur(p.eur)}</div>
      </div>
      {p.sub && p.sub.map(s => (
        <div key={s.label} style={{ display: 'flex', alignItems: 'center', gap: 14, paddingLeft: 23 }}>
          <div style={{ width: 90, fontSize: 11.5, color: T.muted }}>{s.label}{s.placeholder && '†'}</div>
          <div style={{ flex: 1 }} />
          <div style={{ width: 92, textAlign: 'right', fontFamily: T.mono, fontSize: 11.5, color: T.muted }}>{fmtEur(s.eur)}</div>
        </div>
      ))}
    </div>
  );
}

const ARCHIV_TABS = [
  { id: 'uebersicht',  label: 'Übersicht',   Icon: IDash,      Content: TabUebersicht },
  { id: 'kosten',      label: 'Kosten',      Icon: ICoins,     Content: TabKosten },
  { id: 'stylereview', label: 'Style',        Icon: ISparkles,  Content: TabStyleReview },
  { id: 'reels',       label: 'Reels',       Icon: ITrendUp,   Content: TabReels },
  { id: 'performance', label: 'Performance', Icon: IGauge,     Content: TabPerformance },
  { id: 'reliability', label: 'Reliability', Icon: IShield,    Content: TabReliability },
];

const PIPELINE_TABS = [
  { id: 'monolog', label: 'Monolog',  Icon: ISend,      Content: () => <MonologPanel /> },
  { id: 'hitl1',   label: 'HITL #1', Icon: ISparkles,  Content: TabHitl1 },
  { id: 'hitl2',   label: 'Veto',    Icon: IAlert,     Content: TabHitl2 },
  { id: 'liverun', label: 'Live Run',Icon: IActivity,  Content: null },
];

function App() {
  const mobile = useMobile();
  const [tab, setTab]         = useState('uebersicht');
  const [mode, setMode] = useState('archiv');      // 'archiv' | 'pipeline' | 'stil-katalog'
  const [pipelineTab, setPipelineTab] = useState('monolog');
  const [data, setData]       = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  // B9: Auswahl hängt an der Etappen-id, nicht am Listenindex — sonst zeigt jeder
  // Filter- oder Sortierwechsel plötzlich eine andere Etappe.
  const [selectedId, setSelectedId] = useState(null);
  const [routeFilter, setRouteFilter] = useState('');       // '' = alle Routen
  const [sortMode, setSortMode] = useState('wandertag');    // 'wandertag' | 'rechendatum'
  const [steps, setSteps]     = useState([]);
  const [runEtappeId, setRunEtappeId] = useState(null);
  const [routeDropdownOpen, setRouteDropdownOpen] = useState(false);

  React.useEffect(() => {
    // costs_data.json zuerst (best effort) — setKostenPreise() muss laufen, bevor
    // transformData() platformCosts() aufruft, sonst rechnet der erste Render mit
    // dem eingebauten Fallback statt den aktuellen Preisen aus dem Beleg (C1/C2).
    fetch('costs_data.json', { cache: 'no-store' })
      .then(r => r.ok ? r.json() : null)
      .then(j => setKostenPreise(j?.meta))
      .catch(() => {})
      .then(() => Promise.all([fetchEtappen(), fetchRouten()]))
      .then(([rows, routeMap]) => setData(transformData(rows, routeMap)))
      .catch(e  => setLoadError(e.message))
      .finally(() => setLoading(false));
  }, []);

  const loadSteps = React.useCallback((eid) => {
    fetchSteps(eid).then(setSteps);
  }, []);

  React.useEffect(() => {
    fetchLatestRun().then(eid => {
      if (eid) { setRunEtappeId(eid); loadSteps(eid); }
    });
  }, []);

  const LIVE_MS = 30 * 60 * 1000;
  const isRunning = steps.some(s =>
    s.status === 'running' && s.ts && (Date.now() - new Date(s.ts).getTime()) < LIVE_MS
  );
  React.useEffect(() => {
    if (!isRunning || !runEtappeId) return;
    const iv = setInterval(() => loadSteps(runEtappeId), 5000);
    return () => clearInterval(iv);
  }, [isRunning, runEtappeId]);

  // B1/B2/B8 — die Ansicht arbeitet ab hier auf der gefilterten und sortierten
  // Liste. Die Nebenreihen werden aus genau dieser Liste neu gerechnet, damit die
  // Übersicht nicht weiter routen-gemischte Kurven zeigt.
  const viewData = React.useMemo(() => {
    if (!data) return null;
    const liste = viewListe(data.etappenList, routeFilter, sortMode);
    // Der Kosten-Tab zeigt weiter jeden Run einzeln (A3), folgt aber demselben
    // Routenfilter und derselben Sortierachse.
    const alleRuns = viewListe(data.etappenListAlleRuns || data.etappenList, routeFilter, sortMode);
    return {
      ...data,
      etappenList: liste,
      etappenListAlleRuns: alleRuns,
      ...nebenreihen(liste, {}, data.etappenList.find(e => e.id === data.latestId)?.route || null),
    };
  }, [data, routeFilter, sortMode]);

  const viewList = viewData?.etappenList ?? [];

  // Auswahl über die id auflösen (B9). Fällt die gewählte Etappe aus dem Filter,
  // greift der Default: die zuletzt gelaufene Etappe der sichtbaren Liste.
  const curIdx = React.useMemo(() => {
    if (!viewList.length) return -1;
    const byId = selectedId ? viewList.findIndex(e => e.id === selectedId) : -1;
    if (byId >= 0) return byId;
    const latestIdx = viewList.findIndex(e => e.id === data?.latestId);
    return latestIdx >= 0 ? latestIdx : viewList.length - 1;
  }, [viewList, selectedId, data]);

  const gotoIdx = React.useCallback(i => {
    const ziel = viewList[i];
    if (ziel) setSelectedId(ziel.id);
  }, [viewList]);

  React.useEffect(() => {
    const handler = e => {
      if (mode !== 'archiv') return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
      if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
      // B4: die Pfeile laufen über die gefilterte Liste, nicht über alle Etappen.
      const next = e.key === 'ArrowLeft'
        ? Math.max(0, curIdx - 1)
        : Math.min(viewList.length - 1, curIdx + 1);
      gotoIdx(next);
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [mode, curIdx, viewList, gotoIdx]);

  // Routenliste immer aus der *ungefilterten* Menge — sonst könnte man einen
  // gesetzten Filter nicht mehr verlassen.
  const routes = React.useMemo(() => {
    if (!data) return [];
    const seen = new Set();
    return data.etappenList
      .filter(e => { if (!e.route || seen.has(e.route)) return false; seen.add(e.route); return true; })
      .map(e => ({
        route:     e.route,
        kuerzel:   e.kuerzel || '–',
        routeName: e.routeName || e.kuerzel || '–',
        count:     data.etappenList.filter(x => x.route === e.route).length,
      }));
  }, [data]);

  if (loading) return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', fontFamily: T.sans, color: T.muted, fontSize: 14 }}>
      Lade Pipeline-Daten…
    </div>
  );
  if (loadError || !data) return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', fontFamily: T.sans, color: T.err, fontSize: 14 }}>
      Fehler: {loadError || 'Keine Etappen gefunden'}
    </div>
  );

  const lastIdx = viewList.length - 1;
  const curEtappe = viewList[curIdx];
  const canGoLeft = curIdx > 0;
  const canGoRight = curIdx >= 0 && curIdx < lastIdx;

  const tabs       = mode === 'archiv' ? ARCHIV_TABS : PIPELINE_TABS;
  const activeTab  = mode === 'archiv' ? tab : pipelineTab;
  const setActiveTab = mode === 'archiv' ? setTab : setPipelineTab;
  const activeContent = tabs.find(t => t.id === activeTab);

  const navArrows = (
    <div style={{ display: 'flex', gap: 4 }}>
      <button onClick={() => gotoIdx(curIdx - 1)} disabled={!canGoLeft}
        style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
          width: 30, height: 30, borderRadius: 8,
          background: canGoLeft ? T.accentSoft : T.surfaceAlt,
          border: `1px solid ${T.border}`,
          color: canGoLeft ? T.accentInk : T.mutedSoft,
          cursor: canGoLeft ? 'pointer' : 'default',
          fontSize: 18, fontWeight: 600, lineHeight: 1, padding: 0 }}>{'‹'}</button>
      <button onClick={() => gotoIdx(curIdx + 1)} disabled={!canGoRight}
        style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
          width: 30, height: 30, borderRadius: 8,
          background: canGoRight ? T.accentSoft : T.surfaceAlt,
          border: `1px solid ${T.border}`,
          color: canGoRight ? T.accentInk : T.mutedSoft,
          cursor: canGoRight ? 'pointer' : 'default',
          fontSize: 18, fontWeight: 600, lineHeight: 1, padding: 0 }}>{'›'}</button>
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', background: T.bg, color: T.ink, fontFamily: T.sans }}>
      {/* Header */}
      <div style={{ background: T.surface, borderBottom: `1px solid ${T.border}`, padding: mobile ? '12px 16px' : '14px 28px', flexShrink: 0 }}>
        {/* Top row */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          {/* Logo block */}
          <div style={{ display: 'flex', alignItems: 'center', gap: mobile ? 9 : 12, minWidth: 0 }}>
            <div style={{ width: 30, height: 30, flexShrink: 0, borderRadius: 9, background: `linear-gradient(135deg, ${T.accent}, ${T.accentDeep})`, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <ISparkles size={15} sw={2} />
            </div>
            {mobile ? (
              <div style={{ fontSize: 15, fontWeight: 600, letterSpacing: -0.2, whiteSpace: 'nowrap' }}>Floppy Trail</div>
            ) : (
              <div>
                <div style={{ fontSize: 14, fontWeight: 600, letterSpacing: -0.2 }}>INSTA Pipeline v2.0 <span style={{ fontWeight: 400, color: T.muted }}>| Floppy Trail</span></div>
                <div style={{ fontSize: 11, color: T.muted, marginTop: 1 }}>Operations</div>
              </div>
            )}
          </div>
          {/* Mode-Switcher — desktop only */}
          {!mobile && (
          <div style={{ display: 'flex', background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8, padding: 2, gap: 1 }}>
            {[['archiv', 'Etappen'], ['pipeline', 'Pipeline']].map(([m, label]) => (
              <button key={m} onClick={() => setMode(m)}
                style={{ fontFamily: T.sans, fontSize: 12, fontWeight: mode === m ? 600 : 500, padding: '5px 12px', borderRadius: 6, border: 'none', cursor: 'pointer', transition: 'all 0.1s',
                  background: mode === m ? T.surface : 'transparent',
                  color: mode === m ? T.ink : T.muted,
                  boxShadow: mode === m ? '0 1px 2px rgba(20,16,28,0.06)' : 'none' }}>
                {label}
              </button>
            ))}
            <button onClick={() => setMode('stil-katalog')}
              style={{ fontFamily: T.sans, fontSize: 12, fontWeight: mode === 'stil-katalog' ? 600 : 500, padding: '5px 12px', borderRadius: 6, border: 'none', cursor: 'pointer', transition: 'all 0.1s',
                background: mode === 'stil-katalog' ? T.surface : 'transparent',
                color: mode === 'stil-katalog' ? T.ink : T.muted,
                boxShadow: mode === 'stil-katalog' ? '0 1px 2px rgba(20,16,28,0.06)' : 'none' }}>
              Style-Katalog
            </button>
            <button onClick={() => setMode('kosten-gesamt')}
              style={{ fontFamily: T.sans, fontSize: 12, fontWeight: mode === 'kosten-gesamt' ? 600 : 500, padding: '5px 12px', borderRadius: 6, border: 'none', cursor: 'pointer', transition: 'all 0.1s',
                background: mode === 'kosten-gesamt' ? T.surface : 'transparent',
                color: mode === 'kosten-gesamt' ? T.ink : T.muted,
                boxShadow: mode === 'kosten-gesamt' ? '0 1px 2px rgba(20,16,28,0.06)' : 'none' }}>
              Ist-Kosten
            </button>
          </div>
          )}
          {/* Right button group */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            {mobile && (
              <button
                onClick={() => { setMode('pipeline'); setPipelineTab('liverun'); }}
                style={{
                  display: 'inline-flex', alignItems: 'center', gap: 5,
                  padding: '5px 11px',
                  background: isRunning
                    ? `linear-gradient(135deg, ${T.accent}, ${T.accentDeep})`
                    : activeTab === 'liverun' ? T.accentSoft : T.surfaceAlt,
                  border: `1px solid ${isRunning ? T.accentDeep : activeTab === 'liverun' ? T.accent : T.border}`,
                  borderRadius: 8, cursor: 'pointer',
                  fontFamily: T.sans, fontSize: 11, fontWeight: 700,
                  color: isRunning ? '#fff' : activeTab === 'liverun' ? T.accentInk : T.muted,
                  letterSpacing: 0.2,
                  boxShadow: isRunning ? `0 2px 8px ${T.accent}55` : 'none',
                }}
              >
                <IActivity size={11} sw={isRunning ? 2.2 : 1.8} />
                {isRunning ? '\u25cf LIVE RUN' : 'Live Run'}
              </button>
            )}
            {!mobile && mode === 'archiv' && navArrows}
          </div>
        </div>

        {/* Mobile mode switcher — full width */}
        {mobile && (
          <div style={{ display: 'flex', background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8, padding: 2, gap: 1, marginTop: 10 }}>
            {[['archiv', 'Etappen'], ['pipeline', 'Pipeline'], ['stil-katalog', 'Style'], ['kosten-gesamt', 'Ist-Kosten']].map(([m, label]) => (
              <button key={m} onClick={() => setMode(m)}
                style={{ flex: 1, fontFamily: T.sans, fontSize: 13, fontWeight: mode === m ? 600 : 500, padding: '8px 0', borderRadius: 6, border: 'none', cursor: 'pointer', transition: 'all 0.1s',
                  background: mode === m ? T.surface : 'transparent',
                  color: mode === m ? T.ink : T.muted,
                  boxShadow: mode === m ? '0 1px 2px rgba(20,16,28,0.06)' : 'none' }}>
                {label}
              </button>
            ))}
          </div>
        )}

        {/* Title row */}
        {mode === 'archiv' && curEtappe && (() => {
          // B10: das Dropdown ist der Filter-Einstieg und wird immer gerendert —
          // auch wenn die aktuelle Etappe kein Kürzel hat.
          const routenChip = (
            <div style={{ position: 'relative', flexShrink: 0 }}>
              <button onClick={() => setRouteDropdownOpen(o => !o)}
                style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 700, color: T.accentInk,
                  background: T.accentSoft, borderRadius: 5, padding: mobile ? '6px 11px' : '2px 8px',
                  whiteSpace: 'nowrap', border: `1px solid ${routeFilter ? T.accent : T.border}`,
                  cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                {routeFilter ? (routes.find(r => r.route === routeFilter)?.kuerzel || '–') : 'Alle Routen'}
                <span style={{ fontSize: 8, opacity: 0.6 }}>▾</span>
              </button>
              {routeDropdownOpen && (
                <>
                  <div style={{ position: 'fixed', inset: 0, zIndex: 99 }} onClick={() => setRouteDropdownOpen(false)} />
                  <div style={{ position: 'absolute', top: 'calc(100% + 6px)', left: 0, zIndex: 100,
                    background: T.surface, border: `1px solid ${T.border}`, borderRadius: 10,
                    boxShadow: '0 8px 24px rgba(20,16,28,0.12)', minWidth: 220, overflow: 'hidden' }}>
                    <button onClick={() => { setRouteFilter(''); setRouteDropdownOpen(false); }}
                      style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%',
                        padding: '10px 14px', border: 'none', cursor: 'pointer', textAlign: 'left',
                        background: routeFilter === '' ? T.accentSoft : 'transparent',
                        borderBottom: `1px solid ${T.border}` }}>
                      <span style={{ fontFamily: T.sans, fontSize: 12, color: T.ink, fontWeight: routeFilter === '' ? 600 : 400 }}>
                        Alle Routen
                      </span>
                      <span style={{ fontFamily: T.mono, fontSize: 10, color: T.muted, marginLeft: 'auto' }}>
                        {data.etappenList.length} Etappen
                      </span>
                    </button>
                    {routes.map(r => (
                      <button key={r.route}
                        onClick={() => { setRouteFilter(r.route); setRouteDropdownOpen(false); }}
                        style={{ display: 'flex', alignItems: 'center', gap: 10, width: '100%',
                          padding: '10px 14px', border: 'none', cursor: 'pointer', textAlign: 'left',
                          background: r.route === routeFilter ? T.accentSoft : 'transparent',
                          borderBottom: `1px solid ${T.border}` }}>
                        <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 700,
                          color: T.accentInk, background: T.accentSoft, borderRadius: 4,
                          padding: '1px 6px', border: `1px solid ${T.border}`, whiteSpace: 'nowrap' }}>
                          {r.kuerzel}
                        </span>
                        <span style={{ fontFamily: T.sans, fontSize: 12, color: T.ink, fontWeight: r.route === routeFilter ? 600 : 400 }}>
                          {r.routeName}
                        </span>
                        <span style={{ fontFamily: T.mono, fontSize: 10, color: T.muted, marginLeft: 'auto' }}>
                          {r.count} Etappen
                        </span>
                      </button>
                    ))}
                  </div>
                </>
              )}
            </div>
          );

          // B3: Wandertag ↔ Rechendatum — gilt für Liste, Pfeile und Tabellen.
          const sortChip = (
            <div style={{ display: 'flex', flexShrink: 0, background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 6, padding: 1, gap: 1 }}>
              {[['wandertag', 'Wandertag'], ['rechendatum', 'Rechendatum']].map(([m, label]) => (
                <button key={m} onClick={() => setSortMode(m)}
                  title={m === 'wandertag' ? 'Nach Tag der Wanderung sortieren' : 'Nach Zeitpunkt des Pipeline-Laufs sortieren'}
                  style={{ fontFamily: T.mono, fontSize: 9.5, letterSpacing: 0.4, textTransform: 'uppercase',
                    fontWeight: sortMode === m ? 700 : 500, padding: mobile ? '5px 10px' : '3px 8px', borderRadius: 5,
                    border: 'none', cursor: 'pointer', whiteSpace: 'nowrap',
                    background: sortMode === m ? T.surface : 'transparent',
                    color: sortMode === m ? T.ink : T.muted }}>
                  {label}
                </button>
              ))}
            </div>
          );

          // B6: Wandertag und Rechendatum stehen nebeneinander — die Kopfzeile
          // zeigt nicht mehr nur die eine der beiden Zeitachsen.
          const datumZeile = (
            <span style={{ fontFamily: T.mono, fontSize: 11, letterSpacing: 0.6, textTransform: 'uppercase', fontWeight: 500, color: T.accent, minWidth: 0 }}>
              Tag {curEtappe.n} · {curEtappe.datum || data.date}
              {curEtappe.run_at
                ? <span style={{ color: T.muted, textTransform: 'none', letterSpacing: 0 }}> · gerechnet {curEtappe.run_at.slice(0, 10)} {curEtappe.run_at.slice(11, 16)}</span>
                : <span style={{ color: T.warn, textTransform: 'none', letterSpacing: 0 }}> · nie gelaufen</span>}
              {curEtappe.run > 1 && <span style={{ color: T.muted, textTransform: 'none', letterSpacing: 0 }}> · Run {curEtappe.run}</span>}
            </span>
          );

          return (
          <div style={{ marginTop: mobile ? 12 : 20 }}>
            {/* B7: mobil trägt die Metazeile nur Datum + Pfeile; Routenfilter und
                Sortierschalter stehen als Chip-Leiste unter dem Titel. */}
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              {!mobile && routenChip}
              {!mobile && sortChip}
              {datumZeile}
              {mobile && <div style={{ marginLeft: 'auto', flexShrink: 0 }}>{navArrows}</div>}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
              <h1 style={{ fontFamily: T.serif, fontSize: mobile ? 22 : 34, fontWeight: 400, margin: 0, letterSpacing: -0.5, lineHeight: 1.1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: mobile ? 'normal' : 'nowrap' }}>
                {curEtappe.name.split('→')[0].trim()} <span style={{ color: T.accent, fontStyle: 'italic' }}>→</span> {curEtappe.name.split('→')[1]?.trim()}
              </h1>
              <Pill state={curEtappe?.status || data.status} label={curEtappe?.status || data.status} />
              {curEtappe?.blogUrl && (
                <a href={curEtappe.blogUrl} target="_blank" rel="noopener noreferrer"
                  style={{ fontSize: 12, color: T.accent, textDecoration: 'none', whiteSpace: 'nowrap' }}>
                  Blog-Beitrag ↗
                </a>
              )}
            </div>
            {/* Kein overflow-Container: das Routen-Dropdown klappt hier auf und
                würde sonst am Rand abgeschnitten. */}
            {mobile && (
              <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginTop: 10, flexWrap: 'wrap' }}>
                {routenChip}
                {sortChip}
              </div>
            )}
          </div>
          );
        })()}

        {/* Pipeline title row */}
        {mode === 'pipeline' && (() => {
          const pe = isRunning ? (data.etappenList.find(e => e.id === runEtappeId) || null) : null;
          return (
          <div style={{ marginTop: mobile ? 12 : 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              {pe?.kuerzel && <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 700, color: T.accentInk, background: T.accentSoft, borderRadius: 5, padding: '2px 8px', whiteSpace: 'nowrap', border: `1px solid ${T.border}` }}>{pe.kuerzel}</span>}
              <span style={{ fontFamily: T.mono, fontSize: 11, letterSpacing: 0.6, textTransform: 'uppercase', fontWeight: 500, color: T.accent }}>
                {pe ? `Tag ${pe.n} · ${pe.datum}` : `Pipeline · ${new Date().toISOString().slice(0, 10)}`}
              </span>
              {isRunning && <Pill state="running" label="läuft" />}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
              <h1 style={{ fontFamily: T.serif, fontSize: mobile ? 22 : 34, fontWeight: 400, margin: 0, letterSpacing: -0.5, lineHeight: 1.1, color: pe?.name ? T.ink : T.mutedSoft }}>
                {pe?.name
                  ? <>{pe.name.split('→')[0].trim()} <span style={{ color: T.accent, fontStyle: 'italic' }}>→</span> {pe.name.split('→')[1]?.trim()}</>
                  : <span style={{ fontStyle: 'italic' }}>Startort → Zielort</span>
                }
              </h1>
              {pe && <Pill state={pe.status} label={pe.status} />}
            </div>
          </div>
          );
        })()}

        {/* Tabs — hidden in Stil-Katalog & Ist-Kosten mode */}
        {mode !== 'stil-katalog' && mode !== 'kosten-gesamt' && (
        <div className="tab-scroll" style={{ marginTop: mobile ? 12 : 18 }}>
          {tabs.map(t => (
            <div key={t.id} onClick={() => t.id !== 'liverun' ? setActiveTab(t.id) : setActiveTab('liverun')}
              style={{ display: 'flex', alignItems: 'center', gap: 6, padding: mobile ? '8px 12px' : '9px 14px', borderRadius: 8, cursor: 'pointer', flexShrink: 0,
                background: activeTab === t.id ? T.accentSoft : (t.id === 'liverun' && isRunning ? `linear-gradient(135deg, ${T.accent}22, ${T.accentDeep}18)` : 'transparent'),
                border: t.id === 'liverun' && isRunning ? `1px solid ${T.accent}55` : '1px solid transparent',
                color: activeTab === t.id ? T.accentInk : (t.id === 'liverun' && isRunning ? T.accentInk : T.muted),
                fontFamily: T.sans, fontSize: mobile ? 12 : 13, fontWeight: activeTab === t.id ? 600 : 500,
                transition: 'background 0.12s, color 0.12s' }}>
              <t.Icon size={14} sw={activeTab === t.id || (t.id === 'liverun' && isRunning) ? 2 : 1.7} />
              {t.id === 'liverun' && isRunning ? '\u25cf Live Run' : t.label}
            </div>
          ))}
        </div>
        )}
      </div>

      {/* Content */}
      {mode === 'stil-katalog'
        ? <TabStilKatalog />
        : mode === 'kosten-gesamt'
        ? <TabKostenGesamt />
        : <div style={{ flex: 1, overflow: 'auto', padding: mobile ? '14px 14px' : '24px 28px' }}>
            {activeTab === 'liverun'
              ? <TabProgress steps={steps} onRefresh={() => runEtappeId && loadSteps(runEtappeId)} latestEtappe={data?.etappenList?.find(e => e.id === data.latestId) || data?.etappenList?.[data.etappenList.length - 1]} />
              : activeContent?.Content ? <activeContent.Content data={viewData} selectedEtappe={curEtappe} /> : null
            }
          </div>
      }
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(e) { return { err: e }; }
  render() {
    if (this.state.err) return (
      <div style={{ padding: 32, fontFamily: 'monospace', fontSize: 13, color: '#B91C1C', background: '#FFF1F1', minHeight: '100vh' }}>
        <strong>Render-Fehler (bitte screenshot):</strong><br/><br/>
        {this.state.err.message}<br/><br/>
        <pre style={{ fontSize: 11, color: '#666', whiteSpace: 'pre-wrap' }}>{this.state.err.stack}</pre>
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
