      {varianten.length === 0 ? (
        <div style={{ fontFamily: T.sans, fontSize: 13, color: T.muted, fontStyle: 'italic' }}>Keine Varianten-Texte gespeichert.</div>
      ) : varianten.map(v => (
        <div key={v.stil} style={{ border: `1.5px solid ${etappe.hitl_prio_stil === v.stil ? T.accent : T.border}`, borderRadius: 8, padding: 14, marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <span style={{ fontFamily: T.sans, fontSize: 13, fontWeight: 700, color: T.ink }}>{v.stil}</span>
            {etappe.hitl_prio_stil === v.stil && (
              <span style={{ fontFamily: T.sans, fontSize: 11, fontWeight: 700, color: T.accentInk }}>★ war Prio</span>
            )}
          </div>
          {v.erzaehler_lang ? (
            <div style={{ fontFamily: T.sans, fontSize: 13, lineHeight: 1.55, color: T.ink, whiteSpace: 'pre-wrap', background: T.accentSoft, borderRadius: 6, padding: '10px 12px' }}>
              {v.erzaehler_lang}
            </div>
          ) : (
            <div style={{ fontFamily: T.sans, fontSize: 13, color: T.muted, fontStyle: 'italic' }}>Kein Text gespeichert.</div>
          )}
          {v.kommentar && (
            <div style={{ fontFamily: T.sans, fontSize: 12, color: T.warn, marginTop: 8 }}>💬 {v.kommentar}</div>
          )}
        </div>
      ))}
    </div>
  );
}

function TabHitl1() {
  const mobile = useMobile();
  const [etappen, setEtappen] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [historie, setHistorie] = React.useState([]);
  const [historieLaden, setHistorieLaden] = React.useState(true);
  const [activeRoute, setActiveRoute] = React.useState(null);
  const [ausgewaehlt, setAusgewaehlt] = React.useState(null);

  async function laden() {
    setLoading(true);
    const rows = await fetchEtappenFuerHitl1();
    setEtappen(rows);
    setLoading(false);
  }
  async function ladeHistorie() {
    setHistorieLaden(true);
    const rows = await fetchEtappenHistorie();
    setHistorie(rows);
    setHistorieLaden(false);
  }

  React.useEffect(() => { laden(); ladeHistorie(); }, []);

  const routen = React.useMemo(() => {
    const m = new Map();
    historie.forEach(e => { const k = e.route?.kuerzel; if (k) m.set(k, e.route); });
    return Array.from(m.values()).sort((a, b) => (a.kuerzel || '').localeCompare(b.kuerzel || ''));
  }, [historie]);
  const gefiltert = activeRoute ? historie.filter(e => e.route?.kuerzel === activeRoute) : historie;

  function onFreigegeben() { laden(); ladeHistorie(); }

  const hauptinhalt = loading ? (
    <div style={{ padding: 24, fontFamily: T.sans, color: T.muted, fontSize: 14 }}>Lade…</div>
  ) : (
    <div>
      {!etappen.length ? (
        <React.Fragment>
          <div style={{ padding: '10px 16px', marginBottom: 16, background: T.surfaceAlt, border: `1px solid ${T.border}`,
            borderRadius: 8, fontSize: 13, color: T.muted, fontFamily: T.sans }}>
            Keine offenen Etappen — Vorschau:
          </div>
          <Hitl1Panel etappe={{ id: '__preview__', etappen_nr: '?', datum: '–', startort: '', zielort: '',
            reel_varianten: JSON.stringify([{ stil: 'ki_narrator', erzaehler_lang: '' }]),
            hitl_prio_stil: null, hitl1_entschieden_um: null }}
            onFreigegeben={onFreigegeben} />
        </React.Fragment>
      ) : (
        etappen.map(e => (
          <Hitl1Panel key={e.id} etappe={e} onFreigegeben={onFreigegeben} />
        ))
      )}
      {ausgewaehlt && (
        <Hitl1HistorieViewer etappe={ausgewaehlt} onClose={() => setAusgewaehlt(null)} />
      )}
    </div>
  );

  const sidebar = (
    <aside style={{ background: T.surfaceAlt, padding: 18, borderRadius: 12, border: `1px solid ${T.border}` }}>
      <div style={{ fontFamily: T.serif, fontSize: 16, fontWeight: 400, color: T.ink, marginBottom: 12 }}>Archiv</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, marginBottom: 14 }}>
        <span className={`sk-chip ${activeRoute === null ? 'active' : ''}`} onClick={() => setActiveRoute(null)}>Alle</span>
        {routen.map(r => (
          <span key={r.kuerzel} className={`sk-chip ${activeRoute === r.kuerzel ? 'active' : ''}`} onClick={() => setActiveRoute(r.kuerzel)}>{r.kuerzel}</span>
        ))}
      </div>
      {historieLaden && <div style={{ fontSize: 13, color: T.muted, fontFamily: T.sans }}>Lade…</div>}
      {!historieLaden && gefiltert.length === 0 && (
        <div style={{ fontSize: 13, color: T.muted, fontFamily: T.sans, lineHeight: 1.4 }}>
          Noch keine Tage mit Narrator-Texten.
        </div>
      )}
      <div style={{ maxHeight: mobile ? 'none' : 'calc(100dvh - 260px)', overflowY: 'auto', marginRight: mobile ? 0 : -6, paddingRight: mobile ? 0 : 6 }}>
        {gefiltert.map(e => (
          <MonologListeItem key={e.id} e={e} aktiv={ausgewaehlt?.id === e.id} hideKuerzel={activeRoute !== null} onPick={setAusgewaehlt} />
        ))}
      </div>
    </aside>
  );

  return mobile ? (
    <div>{hauptinhalt}{sidebar}</div>
  ) : (
    <div style={{ display: 'flex', gap: 20, alignItems: 'flex-start' }}>
      <div style={{ maxWidth: 680, minWidth: 0 }}>{hauptinhalt}</div>
      <div style={{ width: 320, flexShrink: 0 }}>{sidebar}</div>
    </div>
  );
}

// ─── HITL #2 ─────────────────────────────────────────────────────────────────
async function fetchEtappenFuerHitl2() {
  const cols = 'id,datum,etappen_nr,tag_nr,pipeline_status,post_geplant_um,veto,freigabe,reel_varianten,hitl_prio_stil';
  const url = `${SUPABASE_URL}/rest/v1/etappen_aktuell?select=${cols}&pipeline_status=eq.reel_freigabe&order=datum.desc&limit=10`;
  const res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!res.ok) return [];
  return res.json();
}

function Hitl2Veto({ etappe, onVeto }) {
  const ziel = etappe.post_geplant_um ? new Date(etappe.post_geplant_um) : null;
  const [now, setNow] = React.useState(new Date());
  const [saving, setSaving] = React.useState(false);
  const [fehler, setFehler] = React.useState(null);

  React.useEffect(() => {
    const iv = setInterval(() => setNow(new Date()), 10000);
    return () => clearInterval(iv);
  }, []);

  const offen = (!ziel || ziel > now) && !etappe.veto && !etappe.freigabe;
  const verbleibend = ziel ? Math.max(0, Math.round((ziel - now) / 60000)) : null;

  const varianten = parseReelVarianten(etappe.reel_varianten);
  const prioVariante = varianten.find(v => v.stil === etappe.hitl_prio_stil) || varianten[0];

  const isPreview = etappe.id === '__preview__';

  // Beide Pfade schreiben live auf einen Publish-Entscheid — ein verschluckter Fehler hieße hier,
  // dass ein Veto nur in der UI passiert ist und das Reel trotzdem rausgeht.
  async function patcheUndMelde(felder, was) {
    if (isPreview) return;
    setSaving(true); setFehler(null);
    try {
      const res = await patchEtappe(etappe.id, felder);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      onVeto?.();
    } catch (err) {
      setFehler(`${was} fehlgeschlagen: ${err.message}`);
    } finally { setSaving(false); }
  }

  const setzeVeto     = () => patcheUndMelde({ veto: true }, 'Veto');
  const setzeFreigabe = () => patcheUndMelde({ freigabe: true }, 'Freigabe');

  return (
    <div style={{ maxWidth: 540, background: T.surface, borderRadius: 12, border: `2px solid ${offen ? T.accent : T.border}`, padding: 24, marginBottom: 20, opacity: isPreview ? 0.6 : 1 }}>
      <h2 style={{ fontFamily: T.serif, fontSize: 20, fontWeight: 400, margin: '0 0 8px', color: T.ink }}>
        Prio-Reel bereit — Tag {etappe.tag_nr || etappe.etappen_nr} ({etappe.datum})
      </h2>

      {prioVariante && (
        <div style={{ fontSize: 13, fontFamily: T.mono, color: T.muted, marginBottom: 12 }}>
          Stil: <b style={{ color: T.ink }}>{prioVariante.stil}</b>
          {prioVariante.reel_datei && (
            <div style={{ marginTop: 8, padding: '8px 10px', background: T.accentSoft, borderRadius: 6, fontSize: 12, fontFamily: T.sans, color: T.accentInk }}>
              👀 Zum Anschauen: <b>Dropbox → 40_Finale_Reels</b><br/>
              <span style={{ fontFamily: T.mono, fontSize: 11 }}>{prioVariante.reel_datei.split('/').pop()}</span>
            </div>
          )}
          {prioVariante.instagram_caption && (
            <div style={{ marginTop: 6, fontFamily: T.sans, fontSize: 12, color: T.muted, fontStyle: 'italic', maxHeight: 60, overflow: 'hidden' }}>
              {prioVariante.instagram_caption.slice(0, 160)}…
            </div>
          )}
        </div>
      )}

      {etappe.veto ? (
        <div style={{ background: T.errSoft, border: `1px solid ${T.err}`, borderRadius: 8, padding: '10px 14px', fontSize: 13, fontFamily: T.sans, color: T.err, fontWeight: 600 }}>
          ⛔ Veto gesetzt — Prio-Reel wird NICHT gepostet. Origbilder + Overnight laufen weiter.
        </div>
      ) : etappe.freigabe ? (
        <div style={{ background: T.accentSoft, border: `1px solid ${T.accent}`, borderRadius: 8, padding: '10px 14px', fontSize: 13, fontFamily: T.sans, color: T.accentInk, fontWeight: 600 }}>
          ✅ Freigegeben — Reel geht sofort raus.
        </div>
      ) : offen ? (
        <div>
          <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, borderRadius: 8, padding: '10px 14px', marginBottom: 14, fontSize: 13, fontFamily: T.sans }}>
            {ziel ? (
              <React.Fragment>
                <b style={{ color: T.warn }}>Geht raus um {ziel.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</b>
                {verbleibend !== null && <span style={{ color: T.muted }}> — noch {verbleibend} Min</span>}
              </React.Fragment>
            ) : (
              <b style={{ color: T.warn }}>Kein Zieldatum gesetzt — wartet auf Freigabe oder Veto</b>
            )}
          </div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <button onClick={setzeFreigabe} disabled={saving || isPreview}
              style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 8, border: 'none', cursor: (saving || isPreview) ? 'not-allowed' : 'pointer', background: isPreview ? T.surfaceAlt : T.accent, color: isPreview ? T.mutedSoft : '#fff' }}>
              {saving ? '…' : '✅ Freigeben — sofort posten'}
            </button>
            <button onClick={setzeVeto} disabled={saving || isPreview}
              style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 8, border: 'none', cursor: (saving || isPreview) ? 'not-allowed' : 'pointer', background: isPreview ? T.surfaceAlt : T.err, color: isPreview ? T.mutedSoft : '#fff' }}>
              {saving ? '…' : '⛔ Veto — Prio verwerfen'}
            </button>
          </div>
          {fehler && (
            <div style={{ marginTop: 10, background: T.errSoft, border: `1px solid ${T.err}`, borderRadius: 8, padding: '10px 14px', fontSize: 13, fontFamily: T.sans, color: T.err, fontWeight: 600 }}>
              ❌ {fehler} — nichts gespeichert, bitte erneut versuchen.
            </div>
          )}
        </div>
      ) : (
        <div style={{ fontSize: 13, fontFamily: T.sans, color: T.muted }}>
          Fenster geschlossen / bereits gepostet.
        </div>
      )}
    </div>
  );
}
