function fmtDatumDE(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${d}.${m}.${y}`;
}

function MonologListeItem({ e, aktiv, hideKuerzel, onPick }) {
  const route = e.route || {};
  const kuerzel = route.kuerzel || '—';
  const routeName = route.name || '';
  const heading = e.tagesueberschrift || `Etappe ${e.tag_nr || e.etappen_nr || '?'}`;
  const tagLabel = e.tag_nr ? `Tag ${e.tag_nr}` : (e.etappen_nr ? `Etappe ${e.etappen_nr}` : '');

  return (
    <button onClick={() => onPick(e)} type="button"
      style={{
        textAlign: 'left', width: '100%', cursor: 'pointer', display: 'block',
        background: aktiv ? T.accentSoft : T.surface,
        border: `1px solid ${aktiv ? T.accent : T.border}`,
        borderRadius: 8, padding: '10px 12px', marginBottom: 8,
        fontFamily: T.sans, color: T.ink,
      }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 4, flexWrap: 'wrap' }}>
        {!hideKuerzel && (
          <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 600, color: T.accentInk, background: T.accentSoft, padding: '2px 6px', borderRadius: 4, letterSpacing: 0.3 }}>{kuerzel}</span>
        )}
        {tagLabel && <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{tagLabel}</span>}
        {tagLabel && <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>·</span>}
        <span style={{ fontFamily: T.mono, fontSize: 11, color: T.muted }}>{fmtDatumDE(e.datum)}</span>
        {aktiv && <span style={{ marginLeft: 'auto', fontSize: 10, fontWeight: 600, color: T.accent, fontFamily: T.mono }}>im Editor</span>}
      </div>
      <div style={{ fontFamily: T.serif, fontSize: 15, color: T.ink, lineHeight: 1.2, marginBottom: routeName ? 3 : 0 }}>
        {heading}
      </div>
      {routeName && !hideKuerzel && (
        <div style={{ fontFamily: T.sans, fontSize: 11, color: T.mutedSoft }}>
          {routeName}
        </div>
      )}
    </button>
  );
}

function MonologPanel() {
  const mobile = useMobile();
  const [datum, setDatum] = React.useState(new Date().toISOString().slice(0,10));
  const [text, setText] = React.useState('');
  const [status, setStatus] = React.useState(null);
  const [laden, setLaden] = React.useState(false);
  const [saving, setSaving] = React.useState(false);
  const [liste, setListe] = React.useState([]);
  const [listeLaden, setListeLaden] = React.useState(true);
  const [listeError, setListeError] = React.useState(null);
  const [activeRoute, setActiveRoute] = React.useState(null); // null = alle

  // Beim Datum-Wechsel den gespeicherten Monolog laden → korrigieren statt überschreiben.
  React.useEffect(() => {
    let abbruch = false;
    setLaden(true); setStatus(null);
    fetchMonolog(datum).then(t => { if (!abbruch) { setText(t); setLaden(false); } });
    return () => { abbruch = true; };
  }, [datum]);

  // Liste der bereits aufgezeichneten Monologe einmal laden.
  React.useEffect(() => {
    let abbruch = false;
    setListeLaden(true);
    fetchMonologListe()
      .then(rows => { if (!abbruch) { setListe(rows); setListeLaden(false); } })
      .catch(err => { if (!abbruch) { setListeError(err.message); setListeLaden(false); } });
    return () => { abbruch = true; };
  }, []);

  // Reines Speichern — kein KI-Schritt, sichert was gerade im Feld steht.
  async function speichern() {
    if (!text.trim()) return;
    setSaving(true); setStatus('…');
    const res = await sendMonolog(datum, text, true);
    setSaving(false);
    setStatus(res.ok ? '✓ Gespeichert' : 'Fehler: ' + (res.error || 'unbekannt'));
    if (res.ok) {
      // Liste lokal aktualisieren, damit der neue Eintrag sofort erscheint.
      setListe(prev => {
        const idx = prev.findIndex(p => p.datum === datum);
        const eintrag = {
          id: prev[idx]?.id || `local-${datum}`,
          datum, etappen_nr: null, tag_nr: null,
          tagesueberschrift: prev[idx]?.tagesueberschrift || null,
          tages_monolog: text.trim(),
          route: prev[idx]?.route || null,
        };
        return idx >= 0
          ? [eintrag, ...prev.filter((_, i) => i !== idx)]
          : [eintrag, ...prev];
      });
    }
  }

  // Säubern + Speichern in einem Schritt — der geputzte Text geht direkt in die DB.
  async function saeubern() {
    if (!text.trim()) return;
    setSaving(true); setStatus('… säubere & speichere');
    const res = await sendMonolog(datum, text, false);
    if (!res.gesaeubert) { setSaving(false); setStatus('Fehler: ' + (res.error || 'unbekannt')); return; }
    const save = await sendMonolog(datum, res.gesaeubert, true);
    setSaving(false);
    if (save.ok) {
      setText(res.gesaeubert);
      setStatus('✓ Gespeichert');
      setListe(prev => {
        const idx = prev.findIndex(p => p.datum === datum);
        const eintrag = {
          id: prev[idx]?.id || `local-${datum}`,
          datum, etappen_nr: null, tag_nr: null,
          tagesueberschrift: prev[idx]?.tagesueberschrift || null,
          tages_monolog: res.gesaeubert.trim(),
          route: prev[idx]?.route || null,
        };
        return idx >= 0
          ? [eintrag, ...prev.filter((_, i) => i !== idx)]
          : [eintrag, ...prev];
      });
    } else {
      setStatus('Fehler beim Speichern: ' + (save.error || 'unbekannt'));
    }
  }

  function pick(e) {
    setDatum(e.datum);
    setStatus(null);
    if (mobile && typeof window !== 'undefined') window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // Monolog direkt freigeben — schreibt den Text nach monolog_final (die Tonquelle, die der
  // Narrator bevorzugt liest) UND setzt hitl1_entschieden_um, damit der Lauf HITL #1 überspringt.
  // Die etappe_id kommt direkt aus der Speichern-Antwort der Edge-Function (kein separater,
  // fehleranfälliger Lookup, der den früheren Bug "monolog_final blieb leer" verursacht hat).
  async function freigeben() {
    if (!text.trim()) return;
    setSaving(true); setStatus('… freigeben');
    // 1. Sauber speichern — Edge-Function legt die Etappe an / aktualisiert tages_monolog
    //    und liefert die etappe_id zurück.
    const save = await sendMonolog(datum, text, true);
    if (!save.ok || !save.etappe_id) { setSaving(false); setStatus('Fehler beim Speichern: ' + (save.error || 'unbekannt')); return; }
    // 2. Als final + freigegeben markieren. return=representation + Status-Check, damit ein
    //    fehlgeschlagener PATCH nicht mehr still verschluckt wird.
    const h = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', Prefer: 'return=representation' };
    const patch = await fetch(`${SUPABASE_URL}/rest/v1/etappen?id=eq.${save.etappe_id}`, {
      method: 'PATCH', headers: h,
      body: JSON.stringify({
        monolog_final: text.trim(),
        hitl1_entschieden_um: new Date().toISOString(),
      }),
    });
    if (!patch.ok) { setSaving(false); setStatus('Fehler beim Freigeben: HTTP ' + patch.status); return; }
    setSaving(false);
    setStatus('✓ Freigegeben — Narrator nimmt den Text, HITL #1 entfällt');
  }

  // Wege aus den geladenen Monologen ableiten — nur die mit Inhalt tauchen als Chip auf.
  const routen = React.useMemo(() => {
    const m = new Map();
    liste.forEach(e => {
      const k = e.route?.kuerzel;
      if (k) m.set(k, e.route);
    });
    return Array.from(m.values()).sort((a, b) => (a.kuerzel || '').localeCompare(b.kuerzel || ''));
  }, [liste]);

  const gefiltert = activeRoute
    ? liste.filter(e => e.route?.kuerzel === activeRoute)
    : liste;

  const aktiv = text.trim() && !saving && !laden;

  return (
    <div style={{ display: 'grid', gridTemplateColumns: mobile ? '1fr' : 'minmax(0, 1fr) 320px', gap: 0, alignItems: 'start', background: T.surface, border: `1px solid ${T.border}`, borderRadius: 12, overflow: 'hidden', width: 'fit-content', maxWidth: '100%' }}>
      <div style={{ maxWidth: mobile ? '100%' : 640, padding: 24, borderRight: mobile ? 'none' : `1px solid ${T.border}`, borderBottom: mobile ? `1px solid ${T.border}` : 'none' }}>
        <h2 style={{ fontFamily: T.serif, fontSize: 22, fontWeight: 400, margin: '0 0 16px', color: T.ink }}>Tages-Monolog</h2>
        <div style={{ marginBottom: 12 }}>
          <label style={{ display: 'block', fontSize: 13, color: T.muted, marginBottom: 4 }}>Datum</label>
          <input type="date" value={datum} onChange={e => setDatum(e.target.value)}
            style={{ fontFamily: T.sans, fontSize: 14, padding: '8px 12px', border: `1px solid ${T.border}`, borderRadius: 8, background: T.bg, color: T.ink, width: '100%' }} />
        </div>
        <div style={{ marginBottom: 16 }}>
          <label style={{ display: 'block', fontSize: 13, color: T.muted, marginBottom: 4 }}>Monolog{laden ? ' — lade…' : ''}</label>
          <textarea rows={10} value={text} placeholder="Diktier deinen Monolog…" disabled={laden}
            onChange={e => setText(e.target.value)}
            style={{ width: '100%', fontFamily: T.sans, fontSize: 14, padding: '10px 12px', border: `1px solid ${T.border}`, borderRadius: 8, background: T.bg, color: T.ink, resize: 'vertical', opacity: laden ? 0.5 : 1 }} />
        </div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
          <button onClick={saeubern} disabled={!aktiv}
            style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 8, border: 'none', cursor: aktiv ? 'pointer' : 'not-allowed', background: aktiv ? T.accent : T.surfaceAlt, color: aktiv ? '#fff' : T.mutedSoft }}>
            {saving ? '…' : '✨ Säubern & Speichern'}
          </button>
          <button onClick={speichern} disabled={!aktiv}
            style={{ fontFamily: T.sans, fontSize: 12, fontWeight: 500, padding: '8px 14px', borderRadius: 8, border: `1px solid ${T.border}`, cursor: aktiv ? 'pointer' : 'not-allowed', background: 'transparent', color: T.muted }}>
            nur Speichern
          </button>
          <button onClick={freigeben} disabled={!aktiv} title="Speichert den Monolog und markiert die Etappe als freigegeben — der Narrator nimmt den Text dann direkt, HITL #1 entfällt."
            style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 8, border: 'none', cursor: aktiv ? 'pointer' : 'not-allowed', background: aktiv ? T.ok : T.surfaceAlt, color: aktiv ? '#fff' : T.mutedSoft }}>
            {saving ? '…' : '✓ Freigeben'}
          </button>
        </div>
        <p style={{ marginTop: 10, fontSize: 12, color: T.muted, fontFamily: T.sans }}>
          Diktieren → <b>Säubern & Speichern</b>. Roh reinschreiben, die KI glättet und legt ab.
          <br/><b>Freigeben</b> sichert den Text und markiert die Etappe als entschieden — der nächste Run nimmt ihn direkt, ohne nochmal in HITL #1 zu landen.
        </p>
        {status && (
          <p style={{ marginTop: 12, fontSize: 13, color: status.startsWith('✓') ? T.ok : T.err, fontFamily: T.mono }}>
            {status}
          </p>
        )}
      </div>

      <aside style={{ background: T.surfaceAlt, padding: 18 }}>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, marginBottom: 14 }}>
          <span className={`sk-chip ${activeRoute === null ? 'active' : ''}`} onClick={() => setActiveRoute(null)}>Alle</span>
          {routen.map(r => (
            <span key={r.kuerzel} className={`sk-chip ${activeRoute === r.kuerzel ? 'active' : ''}`} onClick={() => setActiveRoute(r.kuerzel)}>{r.kuerzel}</span>
          ))}
        </div>
        {listeLaden && <div style={{ fontSize: 13, color: T.muted, fontFamily: T.sans }}>Lade…</div>}
        {listeError && <div style={{ fontSize: 12, color: T.err, fontFamily: T.sans }}>{listeError}</div>}
        {!listeLaden && !listeError && liste.length === 0 && (
          <div style={{ fontSize: 13, color: T.muted, fontFamily: T.sans, lineHeight: 1.4 }}>
            Noch keine Monologe aufgezeichnet. Diktier oben deinen ersten — er erscheint dann hier.
          </div>
        )}
        {!listeLaden && !listeError && liste.length > 0 && gefiltert.length === 0 && (
          <div style={{ fontSize: 13, color: T.muted, fontFamily: T.sans, lineHeight: 1.4 }}>
            Keine Monologe auf {activeRoute}.
          </div>
        )}
        <div style={{ maxHeight: mobile ? 'none' : 'calc(100vh - 180px)', overflowY: 'auto', marginRight: mobile ? 0 : -6, paddingRight: mobile ? 0 : 6 }}>
          {gefiltert.map(e => (
            <MonologListeItem key={e.id || e.datum} e={e} aktiv={e.datum === datum} hideKuerzel={activeRoute !== null} onPick={pick} />
          ))}
        </div>
      </aside>
    </div>
  );
}

// ─── HITL #1 ─────────────────────────────────────────────────────────────────
async function fetchEtappenFuerHitl1() {
  const cols = 'id,datum,etappen_nr,tag_nr,pipeline_status,startort,zielort,reel_varianten,hitl_prio_stil,hitl1_benachrichtigt_um,hitl1_entschieden_um';
  const url = `${SUPABASE_URL}/rest/v1/etappen?select=${cols}&hitl1_benachrichtigt_um=not.is.null&hitl1_entschieden_um=is.null&order=datum.desc&limit=10`;
  const res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!res.ok) return [];
  return res.json();
}

async function fetchFotosForEtappe(etappeId) {
  const url = `${SUPABASE_URL}/rest/v1/fotos?etappe_id=eq.${etappeId}&select=foto_nr,bildgen_datei,story_text&order=aufnahmedatum.asc`;
  const res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!res.ok) return [];
  return res.json();
}

const HITL1_STILE = ['ki_narrator', 'impact', 'selfie_first', 'rap'];

function Hitl1Panel({ etappe, onFreigegeben }) {
  const [saving, setSaving] = React.useState(false);
  const [startort, setStartort] = React.useState(etappe.startort || '');
  const [zielort, setZielort] = React.useState(etappe.zielort || '');
  const [kommentar, setKommentar] = React.useState('');

  // Verfügbare Varianten aus reel_varianten (enthält Narrator-Texte beider Stile)
  const varianten = React.useMemo(() => {
    try { return JSON.parse(etappe.reel_varianten || '[]'); } catch { return []; }
  }, [etappe.reel_varianten]);

  // Prio-Stil-Picker: Default = was die Pipeline vorbelegt hat (hitl_prio_stil oder erster Stil aus varianten)
  const defaultStil = etappe.hitl_prio_stil || (varianten[0]?.stil) || '';
  const [prioStil, setPrioStil] = React.useState(defaultStil);

  // Text der aktuell gewählten Variante anzeigen
  const aktiveVariante = varianten.find(v => v.stil === prioStil) || varianten[0];
  const narratorText = aktiveVariante?.erzaehler_lang || '';

  const fieldInput = { width: '100%', boxSizing: 'border-box', fontFamily: T.sans, fontSize: 14, lineHeight: 1.5, padding: '10px 12px', border: `1px solid ${T.border}`, borderRadius: 6, background: T.bg, color: T.ink };
  const isPreview = etappe.id === '__preview__';

  async function freigeben() {
    if (isPreview) return;
    setSaving(true);
    const patch = {
      hitl1_entschieden_um: new Date().toISOString(),
      hitl_prio_stil: prioStil || null,
      hitl_kommentar: kommentar.trim() || null,
      startort: startort.trim() || null,
      zielort: zielort.trim() || null,
    };
    await patchEtappe(etappe.id, patch);
    setSaving(false);
    onFreigegeben?.();
  }

  const bereitsEntschieden = !!etappe.hitl1_entschieden_um;

  return (
    <div style={{ maxWidth: 680, background: T.surface, borderRadius: 12, border: `1px solid ${T.border}`, padding: 24, marginBottom: 20, opacity: isPreview ? 0.6 : 1 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 }}>
        <div>
          <h2 style={{ fontFamily: T.serif, fontSize: 20, fontWeight: 400, margin: 0, color: T.ink }}>
            Narrator-Check — Tag {etappe.etappen_nr} ({etappe.datum})
          </h2>
          {bereitsEntschieden && <span style={{ fontSize: 12, color: T.ok, fontFamily: T.mono }}>✓ Bereits freigegeben</span>}
        </div>
      </div>

      <div style={{ display: 'flex', gap: 12, marginBottom: 16 }}>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 12, color: T.muted, fontFamily: T.sans, marginBottom: 4, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 }}>Startort</div>
          <input value={startort} onChange={e => setStartort(e.target.value)} disabled={isPreview} style={fieldInput} />
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 12, color: T.muted, fontFamily: T.sans, marginBottom: 4, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 }}>Zielort</div>
          <input value={zielort} onChange={e => setZielort(e.target.value)} disabled={isPreview} style={fieldInput} />
        </div>
      </div>

      {/* Prio-Stil-Picker */}
      <div style={{ marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: T.muted, fontFamily: T.sans, marginBottom: 6, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 }}>Prio-Stil (geht als erstes raus)</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          {(varianten.length > 0 ? varianten.map(v => v.stil) : HITL1_STILE).map(stil => (
            <button key={stil} onClick={() => setPrioStil(stil)} disabled={isPreview}
              style={{ fontFamily: T.sans, fontSize: 13, fontWeight: prioStil === stil ? 700 : 400, padding: '6px 14px', borderRadius: 20, border: `1.5px solid ${prioStil === stil ? T.accent : T.border}`, cursor: isPreview ? 'not-allowed' : 'pointer', background: prioStil === stil ? T.accentSoft : 'transparent', color: prioStil === stil ? T.accentInk : T.muted }}>
              {stil}
            </button>
          ))}
        </div>
      </div>

      {/* Narrator-Text der gewählten Variante (read-only) */}
      <div style={{ background: T.accentSoft, borderRadius: 8, padding: '12px 14px', marginBottom: 16 }}>
        <div style={{ fontSize: 12, color: T.muted, fontFamily: T.sans, marginBottom: 8, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 }}>
          Narrator-Text · {aktiveVariante?.stil || '—'}
        </div>
        {narratorText ? (
          <div style={{ fontFamily: T.sans, fontSize: 14, lineHeight: 1.6, color: T.ink, whiteSpace: 'pre-wrap' }}>
            {narratorText}
          </div>
        ) : (

      {/* Kommentar / Korrektur-Anweisung */}

        <div style={{ fontSize: 12, color: T.muted, fontFamily: T.sans, marginBottom: 4, fontWeight: 600, textTransform: 'uppercase', letterSpacing: 0.5 }}>Kommentar / Korrektur (optional)</div>
        <textarea rows={3} value={kommentar} onChange={e => setKommentar(e.target.value)} disabled={isPreview}
          placeholder="z.B. »zu lang, Einleitung kürzen« oder »mehr Situationskomik reinbringen« — der Narrator läuft nochmal mit dieser Anweisung."
          style={{ ...fieldInput, resize: 'vertical' }} />
        {kommentar.trim() && (
          <div style={{ fontSize: 11, color: T.warn, fontFamily: T.sans, marginTop: 4 }}>

        )}
      </div>

      <button onClick={freigeben} disabled={saving || bereitsEntschieden || isPreview}
        style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 8, border: 'none', cursor: (saving || bereitsEntschieden || isPreview) ? 'not-allowed' : 'pointer', background: (bereitsEntschieden || isPreview) ? T.surfaceAlt : T.accent, color: (bereitsEntschieden || isPreview) ? T.mutedSoft : '#fff' }}>
        {bereitsEntschieden ? '✓ Freigegeben' : saving ? '…' : 'Freigeben →'}
      </button>
    </div>
  );
}

// ─── HITL #2 ─────────────────────────────────────────────────────────────────
async function fetchEtappenFuerHitl2() {
  const cols = 'id,datum,etappen_nr,tag_nr,pipeline_status,post_geplant_um,veto,freigabe,reel_varianten';
  const url = `${SUPABASE_URL}/rest/v1/etappen?select=${cols}&pipeline_status=eq.reel_freigabe&order=datum.desc&limit=10`;
  const res = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` } });
  if (!res.ok) return [];
  return res.json();
}

function Hitl2Veto({ etappe, onVeto }) {
  const ziel = etappe.post_geplant_um ? new Date(etappe.post_geplant_um) : null;
  const [now, setNow] = React.useState(new Date());
  const [saving, setSaving] = React.useState(false);

  React.useEffect(() => {
    const iv = setInterval(() => setNow(new Date()), 10000);
    return () => clearInterval(iv);
  }, []);

  const offen = ziel && ziel > now && !etappe.veto && !etappe.freigabe;
  const verbleibend = ziel ? Math.max(0, Math.round((ziel - now) / 60000)) : null;

  const varianten = (() => {
    try { return JSON.parse(etappe.reel_varianten || '[]'); } catch { return []; }
  })();
  const prioVariante = varianten[0];

  const isPreview = etappe.id === '__preview__';

  async function setzeVeto() {
    if (isPreview) return;
    setSaving(true);
    await patchEtappe(etappe.id, { veto: true });
    setSaving(false);
    onVeto?.();
  }

  async function setzeFreigabe() {
    if (isPreview) return;
    setSaving(true);
    await patchEtappe(etappe.id, { freigabe: true });
    setSaving(false);
    onVeto?.();
  }

  return (
    <div style={{ maxWidth: 540, background: T.surface, borderRadius: 12, border: `2px solid ${offen ? T.accent : T.border}`, padding: 24, marginBottom: 20, opacity: isPreview ? 0.6 : 1 }}>
      <h2 style={{ fontFamily: T.serif, fontSize: 20, fontWeight: 400, margin: '0 0 8px', color: T.ink }}>
        Prio-Reel bereit — Tag {etappe.etappen_nr} ({etappe.datum})
      </h2>

      {prioVariante && (
        <div style={{ fontSize: 13, fontFamily: T.mono, color: T.muted, marginBottom: 12 }}>
          Stil: <b style={{ color: T.ink }}>{prioVariante.stil}</b>
          {prioVariante.reel_datei && (
            <div style={{ marginTop: 8, padding: '8px 10px', background: T.accentSoft, borderRadius: 6, fontSize: 12, fontFamily: T.sans, color: T.accentInk }}>
              👀 Zum Anschauen: <b>Dropbox → 40_Finale_Reels</b><br/>
              <span style={{ fontFamily: T.mono, fontSize: 11 }}>{prioVariante.reel_datei.split('/').pop()}</span>
            </div>
          )}
          {prioVariante.instagram_caption && (
            <div style={{ marginTop: 6, fontFamily: T.sans, fontSize: 12, color: T.muted, fontStyle: 'italic', maxHeight: 60, overflow: 'hidden' }}>
              {prioVariante.instagram_caption.slice(0, 160)}…
            </div>
          )}
        </div>
      )}

      {etappe.veto ? (
        <div style={{ background: T.errSoft, border: `1px solid ${T.err}`, borderRadius: 8, padding: '10px 14px', fontSize: 13, fontFamily: T.sans, color: T.err, fontWeight: 600 }}>
          ⛔ Veto gesetzt — Prio-Reel wird NICHT gepostet. Origbilder + Overnight laufen weiter.
        </div>
      ) : etappe.freigabe ? (
        <div style={{ background: T.accentSoft, border: `1px solid ${T.accent}`, borderRadius: 8, padding: '10px 14px', fontSize: 13, fontFamily: T.sans, color: T.accentInk, fontWeight: 600 }}>
          ✅ Freigegeben — Reel geht sofort raus.
        </div>
      ) : offen ? (
        <div>
          <div style={{ background: T.warnSoft, border: `1px solid ${T.warn}`, borderRadius: 8, padding: '10px 14px', marginBottom: 14, fontSize: 13, fontFamily: T.sans }}>
            <b style={{ color: T.warn }}>Geht raus um {ziel.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })}</b>
            {verbleibend !== null && <span style={{ color: T.muted }}> — noch {verbleibend} Min</span>}
          </div>
          <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
            <button onClick={setzeFreigabe} disabled={saving || isPreview}
              style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 8, border: 'none', cursor: (saving || isPreview) ? 'not-allowed' : 'pointer', background: isPreview ? T.surfaceAlt : T.accent, color: isPreview ? T.mutedSoft : '#fff' }}>
              {saving ? '…' : '✅ Freigeben — sofort posten'}
            </button>
            <button onClick={setzeVeto} disabled={saving || isPreview}
              style={{ fontFamily: T.sans, fontSize: 14, fontWeight: 600, padding: '10px 20px', borderRadius: 8, border: 'none', cursor: (saving || isPreview) ? 'not-allowed' : 'pointer', background: isPreview ? T.surfaceAlt : T.err, color: isPreview ? T.mutedSoft : '#fff' }}>
              {saving ? '…' : '⛔ Veto — Prio verwerfen'}
            </button>
          </div>
        </div>
      ) : (
        <div style={{ fontSize: 13, fontFamily: T.sans, color: T.muted }}>
          Fenster geschlossen / bereits gepostet.
        </div>
      )}
    </div>
  );
}

const ARCHIV_TABS = [
  { id: 'uebersicht',  label: 'Übersicht',   Icon: IDash,      Content: TabUebersicht },
  { id: 'kosten',      label: 'Kosten',      Icon: ICoins,     Content: TabKosten },
  { id: 'stylereview', label: 'Style',        Icon: ISparkles,  Content: TabStyleReview },
  { id: 'performance', label: 'Performance', Icon: IGauge,     Content: TabPerformance },
  { id: 'reliability', label: 'Reliability', Icon: IShield,    Content: TabReliability },
];

const PIPELINE_TABS = [
  { id: 'monolog', label: 'Monolog',  Icon: ISend,      Content: () => <MonologPanel /> },
  { id: 'hitl1',   label: 'HITL #1', Icon: ISparkles,  Content: TabHitl1 },
  { id: 'hitl2',   label: 'Veto',    Icon: IAlert,     Content: TabHitl2 },
  { id: 'liverun', label: 'Live Run',Icon: IActivity,  Content: null },
];

function App() {
  const mobile = useMobile();
  const [tab, setTab]         = useState('uebersicht');
  const [mode, setMode] = useState('archiv');      // 'archiv' | 'pipeline' | 'stil-katalog'
  const [pipelineTab, setPipelineTab] = useState('monolog');
  const [data, setData]       = useState(null);
  const [loading, setLoading] = useState(true);
  const [loadError, setLoadError] = useState(null);
  const [selectedIdx, setSelectedIdx] = useState(null);
  const [steps, setSteps]     = useState([]);
  const [runEtappeId, setRunEtappeId] = useState(null);
  const [routeDropdownOpen, setRouteDropdownOpen] = useState(false);

  React.useEffect(() => {
    Promise.all([fetchEtappen(), fetchRouten()])
      .then(([rows, routeMap]) => setData(transformData(rows, routeMap)))
      .catch(e  => setLoadError(e.message))
      .finally(() => setLoading(false));
  }, []);

  const loadSteps = React.useCallback((eid) => {
    fetchSteps(eid).then(setSteps);
  }, []);

  React.useEffect(() => {
    fetchLatestRun().then(eid => {
      if (eid) { setRunEtappeId(eid); loadSteps(eid); }
    });
  }, []);

  const LIVE_MS = 30 * 60 * 1000;
  const isRunning = steps.some(s =>
    s.status === 'running' && s.ts && (Date.now() - new Date(s.ts).getTime()) < LIVE_MS
  );
  React.useEffect(() => {
    if (!isRunning || !runEtappeId) return;
    const iv = setInterval(() => loadSteps(runEtappeId), 5000);
    return () => clearInterval(iv);
  }, [isRunning, runEtappeId]);

  React.useEffect(() => {
    const handler = e => {
      if (mode !== 'archiv') return;
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable) return;
      const max = (data?.etappenList?.length ?? 1) - 1;
      setSelectedIdx(i => {
        const cur = i ?? max;
        if (e.key === 'ArrowLeft')  return Math.max(0, cur - 1);
        if (e.key === 'ArrowRight') return Math.min(max, cur + 1);
        return i;
      });
    };
    window.addEventListener('keydown', handler);
    return () => window.removeEventListener('keydown', handler);
  }, [mode, data]);

  const routes = React.useMemo(() => {
    if (!data) return [];
    const seen = new Set();
    return data.etappenList
      .filter(e => { if (!e.route || seen.has(e.route)) return false; seen.add(e.route); return true; })
      .map(e => ({
        route:     e.route,
        kuerzel:   e.kuerzel || '–',
        routeName: e.routeName || e.kuerzel || '–',
        count:     data.etappenList.filter(x => x.route === e.route).length,
        firstIdx:  data.etappenList.findIndex(x => x.route === e.route),
      }));
  }, [data]);

  if (loading) return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', fontFamily: T.sans, color: T.muted, fontSize: 14 }}>
      Lade Pipeline-Daten…
    </div>
  );
  if (loadError || !data) return (
    <div style={{ display:'flex', alignItems:'center', justifyContent:'center', height:'100vh', fontFamily: T.sans, color: T.err, fontSize: 14 }}>
      Fehler: {loadError || 'Keine Etappen gefunden'}
    </div>
  );

  const lastIdx = data.etappenList.length - 1;
  const latestRunIdx = data.etappenList.findIndex(e => e.id === data.latestId);
  const defaultIdx = latestRunIdx >= 0 ? latestRunIdx : lastIdx;
  const curIdx = selectedIdx !== null ? Math.max(0, Math.min(selectedIdx, lastIdx)) : defaultIdx;
  const curEtappe = data.etappenList[curIdx];
  const canGoLeft = curIdx > 0;
  const canGoRight = curIdx < lastIdx;

  const tabs       = mode === 'archiv' ? ARCHIV_TABS : PIPELINE_TABS;
  const activeTab  = mode === 'archiv' ? tab : pipelineTab;
  const setActiveTab = mode === 'archiv' ? setTab : setPipelineTab;
  const activeContent = tabs.find(t => t.id === activeTab);

  const navArrows = (
    <div style={{ display: 'flex', gap: 4 }}>
      <button onClick={() => setSelectedIdx(curIdx - 1)} disabled={!canGoLeft}
        style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
          width: 30, height: 30, borderRadius: 8,
          background: canGoLeft ? T.accentSoft : T.surfaceAlt,
          border: `1px solid ${T.border}`,
          color: canGoLeft ? T.accentInk : T.mutedSoft,
          cursor: canGoLeft ? 'pointer' : 'default',
          fontSize: 18, fontWeight: 600, lineHeight: 1, padding: 0 }}>{'‹'}</button>
      <button onClick={() => setSelectedIdx(curIdx + 1)} disabled={!canGoRight}
        style={{ display: 'flex', alignItems: 'center', justifyContent: 'center',
          width: 30, height: 30, borderRadius: 8,
          background: canGoRight ? T.accentSoft : T.surfaceAlt,
          border: `1px solid ${T.border}`,
          color: canGoRight ? T.accentInk : T.mutedSoft,
          cursor: canGoRight ? 'pointer' : 'default',
          fontSize: 18, fontWeight: 600, lineHeight: 1, padding: 0 }}>{'›'}</button>
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', background: T.bg, color: T.ink, fontFamily: T.sans }}>
      {/* Header */}
      <div style={{ background: T.surface, borderBottom: `1px solid ${T.border}`, padding: mobile ? '12px 16px' : '14px 28px', flexShrink: 0 }}>
        {/* Top row */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
          {/* Logo block */}
          <div style={{ display: 'flex', alignItems: 'center', gap: mobile ? 9 : 12, minWidth: 0 }}>
            <div style={{ width: 30, height: 30, flexShrink: 0, borderRadius: 9, background: `linear-gradient(135deg, ${T.accent}, ${T.accentDeep})`, color: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <ISparkles size={15} sw={2} />
            </div>
            {mobile ? (
              <div style={{ fontSize: 15, fontWeight: 600, letterSpacing: -0.2, whiteSpace: 'nowrap' }}>Floppy Trail</div>
            ) : (
              <div>
                <div style={{ fontSize: 14, fontWeight: 600, letterSpacing: -0.2 }}>INSTA Pipeline <span style={{ fontWeight: 400, color: T.muted }}>| Floppy Trail</span></div>
                <div style={{ fontSize: 11, color: T.muted, marginTop: 1 }}>Operations</div>
              </div>
            )}
          </div>
          {/* Mode-Switcher — desktop only */}
          {!mobile && (
          <div style={{ display: 'flex', background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8, padding: 2, gap: 1 }}>
            {[['archiv', 'Etappen'], ['pipeline', 'Pipeline']].map(([m, label]) => (
              <button key={m} onClick={() => setMode(m)}
                style={{ fontFamily: T.sans, fontSize: 12, fontWeight: mode === m ? 600 : 500, padding: '5px 12px', borderRadius: 6, border: 'none', cursor: 'pointer', transition: 'all 0.1s',
                  background: mode === m ? T.surface : 'transparent',
                  color: mode === m ? T.ink : T.muted,
                  boxShadow: mode === m ? '0 1px 2px rgba(20,16,28,0.06)' : 'none' }}>
                {label}
              </button>
            ))}
            <button onClick={() => setMode('stil-katalog')}
              style={{ fontFamily: T.sans, fontSize: 12, fontWeight: mode === 'stil-katalog' ? 600 : 500, padding: '5px 12px', borderRadius: 6, border: 'none', cursor: 'pointer', transition: 'all 0.1s',
                background: mode === 'stil-katalog' ? T.surface : 'transparent',
                color: mode === 'stil-katalog' ? T.ink : T.muted,
                boxShadow: mode === 'stil-katalog' ? '0 1px 2px rgba(20,16,28,0.06)' : 'none' }}>
              Style-Katalog
            </button>
          </div>
          )}
          {/* Right button group */}
          <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
            {mobile && (
              <button
                onClick={() => { setMode('pipeline'); setPipelineTab('liverun'); }}
                style={{
                  display: 'inline-flex', alignItems: 'center', gap: 5,
                  padding: '5px 11px',
                  background: isRunning
                    ? `linear-gradient(135deg, ${T.accent}, ${T.accentDeep})`
                    : activeTab === 'liverun' ? T.accentSoft : T.surfaceAlt,
                  border: `1px solid ${isRunning ? T.accentDeep : activeTab === 'liverun' ? T.accent : T.border}`,
                  borderRadius: 8, cursor: 'pointer',
                  fontFamily: T.sans, fontSize: 11, fontWeight: 700,
                  color: isRunning ? '#fff' : activeTab === 'liverun' ? T.accentInk : T.muted,
                  letterSpacing: 0.2,
                  boxShadow: isRunning ? `0 2px 8px ${T.accent}55` : 'none',
                }}
              >
                <IActivity size={11} sw={isRunning ? 2.2 : 1.8} />
                {isRunning ? '\u25cf LIVE RUN' : 'Live Run'}
              </button>
            )}
            {!mobile && mode === 'archiv' && navArrows}
          </div>
        </div>

        {/* Mobile mode switcher — full width */}
        {mobile && (
          <div style={{ display: 'flex', background: T.surfaceAlt, border: `1px solid ${T.border}`, borderRadius: 8, padding: 2, gap: 1, marginTop: 10 }}>
            {[['archiv', 'Etappen'], ['pipeline', 'Pipeline'], ['stil-katalog', 'Style']].map(([m, label]) => (
              <button key={m} onClick={() => setMode(m)}
                style={{ flex: 1, fontFamily: T.sans, fontSize: 13, fontWeight: mode === m ? 600 : 500, padding: '8px 0', borderRadius: 6, border: 'none', cursor: 'pointer', transition: 'all 0.1s',
                  background: mode === m ? T.surface : 'transparent',
                  color: mode === m ? T.ink : T.muted,
                  boxShadow: mode === m ? '0 1px 2px rgba(20,16,28,0.06)' : 'none' }}>
                {label}
              </button>
            ))}
          </div>
        )}

        {/* Title row */}
        {mode === 'archiv' && (
        <div style={{ marginTop: mobile ? 12 : 20 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
            {curEtappe.kuerzel && (
              <div style={{ position: 'relative' }}>
                <button onClick={() => setRouteDropdownOpen(o => !o)}
                  style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 700, color: T.accentInk,
                    background: T.accentSoft, borderRadius: 5, padding: '2px 8px',
                    whiteSpace: 'nowrap', border: `1px solid ${T.border}`,
                    cursor: routes.length > 1 ? 'pointer' : 'default',
                    display: 'inline-flex', alignItems: 'center', gap: 4 }}>
                  {curEtappe.kuerzel}
                  {routes.length > 1 && <span style={{ fontSize: 8, opacity: 0.6 }}>▾</span>}
                </button>
                {routeDropdownOpen && routes.length > 1 && (
                  <>
                    <div style={{ position: 'fixed', inset: 0, zIndex: 99 }} onClick={() => setRouteDropdownOpen(false)} />
                    <div style={{ position: 'absolute', top: 'calc(100% + 6px)', left: 0, zIndex: 100,
                      background: T.surface, border: `1px solid ${T.border}`, borderRadius: 10,
                      boxShadow: '0 8px 24px rgba(20,16,28,0.12)', minWidth: 220, overflow: 'hidden' }}>
                      {routes.map(r => (
                        <button key={r.route}

          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <h1 style={{ fontFamily: T.serif, fontSize: mobile ? 22 : 34, fontWeight: 400, margin: 0, letterSpacing: -0.5, lineHeight: 1.1, minWidth: 0, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: mobile ? 'normal' : 'nowrap' }}>
              {curEtappe.name.split('→')[0].trim()} <span style={{ color: T.accent, fontStyle: 'italic' }}>→</span> {curEtappe.name.split('→')[1]?.trim()}
            </h1>
            <Pill state={curEtappe?.status || data.status} label={curEtappe?.status || data.status} />
          </div>
        </div>
        )}

        {/* Pipeline title row */}
        {mode === 'pipeline' && (() => {
          const pe = isRunning ? (data.etappenList.find(e => e.id === runEtappeId) || null) : null;
          return (
          <div style={{ marginTop: mobile ? 12 : 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 8 }}>
              {pe?.kuerzel && <span style={{ fontFamily: T.mono, fontSize: 10, fontWeight: 700, color: T.accentInk, background: T.accentSoft, borderRadius: 5, padding: '2px 8px', whiteSpace: 'nowrap', border: `1px solid ${T.border}` }}>{pe.kuerzel}</span>}
              <span style={{ fontFamily: T.mono, fontSize: 11, letterSpacing: 0.6, textTransform: 'uppercase', fontWeight: 500, color: T.accent }}>
                {pe ? `Tag ${pe.n} \u00b7 ${pe.datum}` : `Pipeline \u00b7 ${new Date().toISOString().slice(0, 10)}`}
              </span>
              {isRunning && <Pill state="running" label="l\u00e4uft" />}
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
              <h1 style={{ fontFamily: T.serif, fontSize: mobile ? 22 : 34, fontWeight: 400, margin: 0, letterSpacing: -0.5, lineHeight: 1.1, color: pe?.name ? T.ink : T.mutedSoft }}>
                {pe?.name
                  ? <>{pe.name.split('\u2192')[0].trim()} <span style={{ color: T.accent, fontStyle: 'italic' }}>\u2192</span> {pe.name.split('\u2192')[1]?.trim()}</>
                  : <span style={{ fontStyle: 'italic' }}>Startort \u2192 Zielort</span>
                }
              </h1>
              {pe && <Pill state={pe.status} label={pe.status} />}
            </div>
          </div>
          );
        })()}

        {/* Tabs \u2014 hidden in Stil-Katalog mode */}
        {mode !== 'stil-katalog' && (
        <div className="tab-scroll" style={{ marginTop: mobile ? 12 : 18 }}>
          {tabs.map(t => (
            <div key={t.id} onClick={() => t.id !== 'liverun' ? setActiveTab(t.id) : setActiveTab('liverun')}
              style={{ display: 'flex', alignItems: 'center', gap: 6, padding: mobile ? '8px 12px' : '9px 14px', borderRadius: 8, cursor: 'pointer', flexShrink: 0,
                background: activeTab === t.id ? T.accentSoft : (t.id === 'liverun' && isRunning ? `linear-gradient(135deg, ${T.accent}22, ${T.accentDeep}18)` : 'transparent'),
                border: t.id === 'liverun' && isRunning ? `1px solid ${T.accent}55` : '1px solid transparent',
                color: activeTab === t.id ? T.accentInk : (t.id === 'liverun' && isRunning ? T.accentInk : T.muted),
                fontFamily: T.sans, fontSize: mobile ? 12 : 13, fontWeight: activeTab === t.id ? 600 : 500,
                transition: 'background 0.12s, color 0.12s' }}>
              <t.Icon size={14} sw={activeTab === t.id || (t.id === 'liverun' && isRunning) ? 2 : 1.7} />
              {t.id === 'liverun' && isRunning ? '\u25cf Live Run' : t.label}
            </div>
          ))}
        </div>
        )}
      </div>

      {/* Content */}
      {mode === 'stil-katalog'
        ? <TabStilKatalog />
        : <div style={{ flex: 1, overflow: 'auto', padding: mobile ? '14px 14px' : '24px 28px' }}>
            {activeTab === 'liverun'
              ? <TabProgress steps={steps} onRefresh={() => runEtappeId && loadSteps(runEtappeId)} latestEtappe={data?.etappenList?.[data.etappenList.length - 1]} />
              : activeContent?.Content ? <activeContent.Content data={data} selectedEtappe={curEtappe} /> : null
            }
          </div>
      }
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(e) { return { err: e }; }
  render() {
    if (this.state.err) return (
      <div style={{ padding: 32, fontFamily: 'monospace', fontSize: 13, color: '#B91C1C', background: '#FFF1F1', minHeight: '100vh' }}>
        <strong>Render-Fehler (bitte screenshot):</strong><br/><br/>
        {this.state.err.message}<br/><br/>
        <pre style={{ fontSize: 11, color: '#666', whiteSpace: 'pre-wrap' }}>{this.state.err.stack}</pre>
      </div>
    );
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
</body>
</html>
